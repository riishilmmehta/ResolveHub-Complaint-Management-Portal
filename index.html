<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResolveHub · Next-Gen Complaint Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --primary-50: #eef2ff;
      --primary-100: #e0e7ff;
      --primary-200: #c7d2fe;
      --primary-300: #a5b4fc;
      --primary-400: #818cf8;
      --primary-500: #6366f1;
      --primary-600: #4f46e5;
      --primary-700: #4338ca;
      --primary-800: #3730a3;
      --primary-900: #312e81;
      
      --success-500: #10b981;
      --warning-500: #f59e0b;
      --danger-500: #f43f5e;
      --info-500: #0ea5e9;
      
      --bg: #f8fafc;
      --surface: rgba(255,255,255,0.85);
      --surface-elevated: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --border: rgba(99,102,241,0.12);
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
      --shadow-glow: 0 0 20px rgba(99,102,241,0.15);
      --radius-sm: 8px;
      --radius: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
    }
    
    body.dark {
      --bg: #020617;
      --surface: rgba(15,23,42,0.7);
      --surface-elevated: #0f172a;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-tertiary: #64748b;
      --border: rgba(99,102,241,0.15);
      --shadow-glow: 0 0 20px rgba(99,102,241,0.25);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary); transition: background 0.4s ease, color 0.3s ease; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); } 50% { box-shadow: 0 0 0 8px rgba(99,102,241,0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes confetti { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }
    
    .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
    .animate-fadeInUp { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fadeInScale { animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slideInRight { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .stagger-1 { animation-delay: 0.05s; opacity: 0; }
    .stagger-2 { animation-delay: 0.1s; opacity: 0; }
    .stagger-3 { animation-delay: 0.15s; opacity: 0; }
    .stagger-4 { animation-delay: 0.2s; opacity: 0; }
    .stagger-5 { animation-delay: 0.25s; opacity: 0; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--primary-300); border-radius: 20px; }
    body.dark ::-webkit-scrollbar-thumb { background: var(--primary-700); }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-400); }
    
    /* Glass */
    .glass { background: var(--surface); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .glass-strong { background: var(--surface-elevated); backdrop-filter: blur(30px); border: 1px solid var(--border); }
    
    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: rgba(99,102,241,0.2); }
    .card:active { transform: scale(0.98); }
    
    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: var(--radius); font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent); transform: translateX(-100%); transition: transform 0.5s; }
    .btn:hover::after { transform: translateX(100%); }
    .btn-primary { background: linear-gradient(135deg, var(--primary-500), var(--primary-600)); color: white; box-shadow: 0 4px 14px rgba(99,102,241,0.3); }
    .btn-primary:hover { box-shadow: 0 8px 25px rgba(99,102,241,0.4); transform: translateY(-1px); }
    .btn-success { background: linear-gradient(135deg, var(--success-500), #059669); color: white; }
    .btn-danger { background: linear-gradient(135deg, var(--danger-500), #e11d48); color: white; }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-ghost:hover { background: rgba(99,102,241,0.08); color: var(--primary-600); }
    
    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
    
    /* Inputs */
    .input { width: 100%; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); font-size: 14px; transition: all 0.2s; outline: none; }
    .input:focus { border-color: var(--primary-400); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    
    /* Layout */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; position: fixed; height: 100vh; left: 0; top: 0; z-index: 40; display: flex; flex-direction: column; padding: 24px 16px; border-right: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(20px); }
    .main-content { margin-left: 260px; flex: 1; padding: 24px 32px; max-width: calc(100vw - 260px); }
    
    /* Navigation */
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-weight: 500; font-size: 14px; color: var(--text-secondary); transition: all 0.2s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-item:hover { background: rgba(99,102,241,0.08); color: var(--primary-600); }
    .nav-item.active { background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(99,102,241,0.05)); color: var(--primary-600); font-weight: 600; box-shadow: 0 2px 8px rgba(99,102,241,0.1); }
    .nav-item .nav-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 10px; transition: all 0.2s; }
    .nav-item.active .nav-icon { background: linear-gradient(135deg, var(--primary-500), var(--primary-600)); color: white; }
    
    /* Stats */
    .stat-card { position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: -50%; right: -20%; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%); }
    .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .stat-label { font-size: 13px; font-weight: 500; color: var(--text-tertiary); }
    
    /* Complaint Row */
    .complaint-row { transition: all 0.2s; border-bottom: 1px solid var(--border); }
    .complaint-row:last-child { border-bottom: none; }
    .complaint-row:hover { background: rgba(99,102,241,0.03); }
    
    /* Priority indicators */
    .priority-indicator { width: 4px; border-radius: 4px; }
    
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(2,6,23,0.4); backdrop-filter: blur(12px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease; }
    .modal-box { max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: var(--radius-lg); padding: 28px; background: var(--surface-elevated); border: 1px solid var(--border); box-shadow: var(--shadow-lg), var(--shadow-glow); animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    
    /* Toast */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 400px; }
    .toast { padding: 14px 20px; border-radius: var(--radius); backdrop-filter: blur(16px); font-weight: 500; font-size: 14px; border-left: 4px solid; animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; }
    
    /* Heatmap */
    .heat-cell { aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: all 0.3s; cursor: pointer; position: relative; overflow: hidden; }
    .heat-cell::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent); opacity: 0; transition: opacity 0.3s; }
    .heat-cell:hover { transform: scale(1.05) translateY(-2px); box-shadow: var(--shadow); z-index: 10; }
    .heat-cell:hover::after { opacity: 1; }
    
    /* Kanban */
    .kanban-column { min-width: 280px; background: rgba(99,102,241,0.03); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); }
    .kanban-card { background: var(--surface-elevated); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer; transition: all 0.2s; }
    .kanban-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: rgba(99,102,241,0.2); }
    
    /* Charts */
    .chart-bar { transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 6px 6px 0 0; }
    .chart-bar:hover { filter: brightness(1.1); }
    
    /* Command Palette */
    .cmd-palette { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding-top: 15vh; background: rgba(2,6,23,0.5); backdrop-filter: blur(8px); }
    .cmd-box { width: 100%; max-width: 600px; background: var(--surface-elevated); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-lg), 0 0 40px rgba(99,102,241,0.1); overflow: hidden; animation: fadeInScale 0.2s ease; }
    
    /* Notification Bell */
    .bell-ring { animation: bell-ring 2s ease-in-out infinite; }
    @keyframes bell-ring { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(8deg); } 20% { transform: rotate(-8deg); } 30% { transform: rotate(4deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(0); } }
    
    /* Progress */
    .progress-bar { height: 6px; border-radius: 10px; background: rgba(99,102,241,0.1); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 10px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); background: linear-gradient(90deg, var(--primary-500), var(--primary-400)); }
    
    /* Sparkline */
    .sparkline { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Tags */
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(99,102,241,0.1); color: var(--primary-600); border: 1px solid rgba(99,102,241,0.15); }
    
    /* Timeline */
    .timeline-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--surface-elevated); box-shadow: 0 0 0 2px var(--primary-500); }
    
    /* Mobile */
    .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--surface); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 8px 16px; justify-content: space-around; }
    .mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 12px; border-radius: 12px; border: none; background: transparent; color: var(--text-tertiary); font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .mobile-nav-item.active { color: var(--primary-500); background: rgba(99,102,241,0.1); }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; max-width: 100vw; padding: 16px; padding-bottom: 80px; }
      .mobile-nav { display: flex; }
      .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .kanban-scroll { overflow-x: auto; flex-wrap: nowrap !important; }
    }
    
    /* Confetti */
    .confetti-piece { position: fixed; width: 8px; height: 8px; top: 50%; left: 50%; z-index: 9999; animation: confetti 1.5s ease-out forwards; }
    
    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, rgba(99,102,241,0.05) 25%, rgba(99,102,241,0.1) 50%, rgba(99,102,241,0.05) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    
    /* Spotlight */
    .spotlight { position: relative; overflow: hidden; }
    .spotlight::before { content: ''; position: absolute; width: 200px; height: 200px; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 0.3s; transform: translate(-50%, -50%); }
    .spotlight:hover::before { opacity: 1; }
    
    /* Gradient text */
    .gradient-text { background: linear-gradient(135deg, var(--primary-500), #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Avatar stack */
    .avatar-stack { display: flex; align-items: center; }
    .avatar-stack img, .avatar-stack .avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface-elevated); margin-left: -8px; }
    .avatar-stack img:first-child, .avatar-stack .avatar:first-child { margin-left: 0; }
    
    /* Star rating */
    .star { color: var(--text-tertiary); transition: color 0.2s; cursor: pointer; }
    .star.filled { color: var(--warning-500); }
    .star:hover { transform: scale(1.2); }
    
    /* Custom checkbox */
    .checkbox-custom { width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 5px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; cursor: pointer; }
    .checkbox-custom.checked { background: var(--primary-500); border-color: var(--primary-500); color: white; }
    
    /* Page transition wrapper */
    .page-wrapper { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    
    /* Scrollbar hide for horizontal */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<div id="root"></div>
<script>

</body>
</html>
