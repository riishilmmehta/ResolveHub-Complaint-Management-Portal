<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#6C3CE1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ResolveHub · Luxury Resolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ===== LUXURY DESIGN SYSTEM ===== */
    :root {
      /* Premium Color Palette */
      --primary: #6C3CE1;
      --primary-light: #8B5CF6;
      --primary-dark: #5B2CC1;
      --secondary: #EC4899;
      --secondary-light: #F472B6;
      --accent: #06D6A0;
      --accent-light: #34D399;
      --gold: #F59E0B;
      --gold-light: #FCD34D;
      --rose: #F43F5E;
      --rose-light: #FB7185;
      
      /* Gradients */
      --gradient-primary: linear-gradient(135deg, #6C3CE1 0%, #EC4899 100%);
      --gradient-secondary: linear-gradient(135deg, #06D6A0 0%, #3B82F6 100%);
      --gradient-gold: linear-gradient(135deg, #F59E0B 0%, #FCD34D 100%);
      --gradient-rose: linear-gradient(135deg, #F43F5E 0%, #EC4899 100%);
      --gradient-dark: linear-gradient(135deg, #0F0C29, #302B63, #24243E);
      --gradient-glass: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.05) 100%);
      
      /* Colors */
      --bg-primary: #0F0C29;
      --bg-secondary: #1A1640;
      --bg-card: rgba(26, 22, 64, 0.6);
      --bg-elevated: rgba(255,255,255,0.08);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,0.7);
      --text-tertiary: rgba(255,255,255,0.4);
      --border: rgba(255,255,255,0.08);
      --border-glow: rgba(108,60,225,0.3);
      
      /* Sizes */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.3);
      --shadow-lg: 0 20px 64px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 40px rgba(108,60,225,0.3);
      --shadow-glow-pink: 0 0 40px rgba(236,72,153,0.3);
      
      /* Animations */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out-expo: cubic-bezier(0.87, 0, 0.13, 1);
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { 
      background: var(--gradient-primary); 
      border-radius: var(--radius-full);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-20px) rotate(2deg); }
      66% { transform: translateY(10px) rotate(-2deg); }
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.02); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(108,60,225,0.3); }
      50% { box-shadow: 0 0 60px rgba(108,60,225,0.6); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.8) rotate(-5deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(60px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-60px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes rotateIn {
      from { opacity: 0; transform: rotate(-180deg) scale(0.5); }
      to { opacity: 1; transform: rotate(0deg) scale(1); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100vh) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
    }

    @keyframes gradient-move {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink-cursor {
      50% { border-color: transparent; }
    }

    @keyframes ripple {
      0% { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(4); opacity: 0; }
    }

    @keyframes shimmer-text {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    /* ===== ANIMATION CLASSES ===== */
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-float-slow { animation: float-slow 8s ease-in-out infinite; }
    .animate-fade-up { animation: fadeInUp 0.8s var(--ease-out-expo) forwards; }
    .animate-fade-scale { animation: fadeInScale 0.6s var(--ease-out-expo) forwards; }
    .animate-slide-right { animation: slideInRight 0.7s var(--ease-out-expo) forwards; }
    .animate-slide-left { animation: slideInLeft 0.7s var(--ease-out-expo) forwards; }
    .animate-rotate-in { animation: rotateIn 0.8s var(--ease-out-expo) forwards; }
    .animate-breathe { animation: breathe 3s ease-in-out infinite; }
    .animate-gradient { animation: gradient-move 8s ease infinite; background-size: 200% 200%; }

    .animate-stagger > *:nth-child(1) { animation-delay: 0.05s; }
    .animate-stagger > *:nth-child(2) { animation-delay: 0.1s; }
    .animate-stagger > *:nth-child(3) { animation-delay: 0.15s; }
    .animate-stagger > *:nth-child(4) { animation-delay: 0.2s; }
    .animate-stagger > *:nth-child(5) { animation-delay: 0.25s; }
    .animate-stagger > *:nth-child(6) { animation-delay: 0.3s; }

    /* ===== GLASSMORPHISM ===== */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      transition: all 0.5s var(--ease-out-expo);
    }

    .glass:hover {
      border-color: var(--border-glow);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .glass-premium {
      background: var(--gradient-glass);
      backdrop-filter: blur(60px) saturate(200%);
      -webkit-backdrop-filter: blur(60px) saturate(200%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .btn:hover::after { opacity: 1; }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-glow);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: var(--shadow-glow), 0 12px 48px rgba(108,60,225,0.4);
    }

    .btn-secondary {
      background: var(--gradient-secondary);
      color: white;
      box-shadow: 0 4px 24px rgba(6,214,160,0.3);
    }

    .btn-secondary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 40px rgba(6,214,160,0.4);
    }

    .btn-gold {
      background: var(--gradient-gold);
      color: #1A1640;
      box-shadow: 0 4px 24px rgba(245,158,11,0.3);
    }

    .btn-gold:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 40px rgba(245,158,11,0.4);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.05);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .btn-sm {
      padding: 8px 20px;
      font-size: 12px;
    }

    .btn-lg {
      padding: 18px 40px;
      font-size: 16px;
    }

    .btn-icon {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: var(--radius-full);
    }

    /* ===== BADGES ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .badge-status {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-secondary);
    }

    .badge-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: breathe 2s ease-in-out infinite;
    }

    /* ===== INPUTS ===== */
    .input {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.4s var(--ease-out-expo);
      outline: none;
      backdrop-filter: blur(10px);
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(108,60,225,0.15), var(--shadow-glow);
      background: rgba(255,255,255,0.08);
    }

    .input::placeholder {
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .input-premium {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 24px;
      font-size: 15px;
    }

    .input-premium:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245,158,11,0.1), 0 8px 32px rgba(0,0,0,0.2);
    }

    /* ===== LAYOUT ===== */
    .app-shell {
      display: flex;
      min-height: 100vh;
      background: var(--bg-primary);
      position: relative;
    }

    /* ===== BACKGROUND EFFECTS ===== */
    .bg-effects {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.3;
      animation: float-slow 12s ease-in-out infinite;
    }

    .bg-orb-1 {
      width: 600px;
      height: 600px;
      background: var(--primary);
      top: -200px;
      right: -200px;
      animation-delay: 0s;
    }

    .bg-orb-2 {
      width: 500px;
      height: 500px;
      background: var(--secondary);
      bottom: -150px;
      left: -150px;
      animation-delay: 3s;
    }

    .bg-orb-3 {
      width: 400px;
      height: 400px;
      background: var(--gold);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 6s;
      opacity: 0.15;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 32px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-right: 1px solid var(--border);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transition: all 0.5s var(--ease-out-expo);
    }

    .sidebar-brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      padding: 0 12px;
      margin-bottom: 4px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }

    .sidebar-brand::after {
      content: '✦';
      position: absolute;
      right: -8px;
      top: -4px;
      font-size: 16px;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rotateIn 2s ease-in-out infinite;
    }

    .sidebar-subtitle {
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 0 12px;
      margin-bottom: 24px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      margin: 8px -4px;
      padding: 0 4px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
      margin-bottom: 4px;
      font-family: 'Inter', sans-serif;
      text-align: left;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      transform: translateX(4px);
    }

    .nav-item.active {
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-glow);
      transform: translateX(4px);
    }

    .nav-item .nav-icon {
      width: 24px;
      text-align: center;
      font-size: 16px;
    }

    .nav-item .nav-badge {
      margin-left: auto;
      padding: 2px 12px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,0.1);
      color: var(--text-secondary);
    }

    .nav-item.active .nav-badge {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    /* ===== SIDEBAR FOOTER ===== */
    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.03);
      transition: all 0.4s var(--ease-out-expo);
      cursor: pointer;
    }

    .user-card:hover {
      background: rgba(255,255,255,0.06);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
      background: var(--gradient-primary);
      box-shadow: var(--shadow-glow);
      position: relative;
    }

    .avatar::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: var(--gradient-gold);
      opacity: 0.3;
      z-index: -1;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .avatar-sm {
      width: 36px;
      height: 36px;
      font-size: 13px;
    }

    .avatar-lg {
      width: 64px;
      height: 64px;
      font-size: 24px;
    }

    .avatar-ring {
      border: 2px solid var(--gold);
      box-shadow: 0 0 20px rgba(245,158,11,0.3);
    }

    /* ===== MAIN AREA ===== */
    .main-area {
      flex: 1;
      padding: 32px 40px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 2px;
      font-weight: 400;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 360px;
      min-width: 200px;
    }

    .search-wrap i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 14px;
    }

    .search-wrap input {
      padding-left: 48px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      height: 48px;
    }

    .search-wrap input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245,158,11,0.1);
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      padding: 24px;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      transition: all 0.5s var(--ease-out-expo);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: var(--gradient-primary);
      opacity: 0;
      transition: all 0.6s var(--ease-out-expo);
      border-radius: 50%;
      filter: blur(40px);
    }

    .stat-card:hover::before {
      opacity: 0.1;
      transform: scale(2);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      background: var(--gradient-primary);
      box-shadow: var(--shadow-glow);
      margin-bottom: 12px;
    }

    .stat-icon.gold { background: var(--gradient-gold); }
    .stat-icon.green { background: var(--gradient-secondary); }
    .stat-icon.rose { background: var(--gradient-rose); }
    .stat-icon.purple { background: var(--gradient-primary); }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 4px;
    }

    .stat-trend {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: rgba(6,214,160,0.15);
      color: var(--accent);
    }

    .stat-trend.down {
      background: rgba(244,63,94,0.15);
      color: var(--rose);
    }

    /* ===== COMPLAINT ROW ===== */
    .complaint-row {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .complaint-row:last-child { border-bottom: none; }

    .complaint-row:hover {
      background: rgba(255,255,255,0.03);
      transform: translateX(4px);
    }

    .complaint-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: var(--gradient-primary);
      transition: height 0.4s var(--ease-out-expo);
      border-radius: 0 4px 4px 0;
    }

    .complaint-row:hover::before {
      height: 60%;
    }

    .complaint-info { flex: 1; min-width: 0; }
    .complaint-subject { 
      font-weight: 700; 
      font-size: 15px; 
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .complaint-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .complaint-meta .divider {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-tertiary);
    }

    .complaint-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    /* ===== UPVOTE ===== */
    .upvote-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
    }

    .upvote-btn:hover {
      background: rgba(108,60,225,0.1);
      border-color: var(--primary);
      color: var(--primary);
      transform: scale(1.05);
    }

    .upvote-btn.upvoted {
      background: rgba(108,60,225,0.15);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: var(--shadow-glow);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeInUp 0.3s ease;
    }

    .modal-box {
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: var(--radius-xl);
      padding: 32px;
      background: var(--bg-card);
      backdrop-filter: blur(60px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      animation: fadeInScale 0.5s var(--ease-out-expo) forwards;
    }

    .modal-box::-webkit-scrollbar { width: 3px; }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
      width: 100%;
      pointer-events: none;
    }

    .toast {
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      backdrop-filter: blur(40px);
      font-weight: 600;
      font-size: 14px;
      border-left: 4px solid;
      box-shadow: var(--shadow-lg);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideInRight 0.5s var(--ease-out-expo) forwards;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .toast-success { border-color: var(--accent); }
    .toast-success i { color: var(--accent); }

    .toast-error { border-color: var(--rose); }
    .toast-error i { color: var(--rose); }

    .toast-info { border-color: var(--primary); }
    .toast-info i { color: var(--primary); }

    /* ===== HEATMAP ===== */
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (min-width: 640px) {
      .heatmap-grid { grid-template-columns: repeat(6, 1fr); }
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.5s var(--ease-out-expo);
      border: 1px solid rgba(255,255,255,0.05);
      background: var(--bg-card);
      position: relative;
      overflow: hidden;
    }

    .heat-cell::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-primary);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .heat-cell:hover::before {
      opacity: 0.1;
    }

    .heat-cell:hover {
      transform: scale(1.08) translateY(-4px);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
    }

    .heat-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
      position: relative;
      z-index: 1;
    }

    .heat-value {
      font-size: 28px;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    /* ===== KANBAN ===== */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .kanban-column {
      border-radius: var(--radius-lg);
      padding: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      transition: all 0.4s var(--ease-out-expo);
    }

    .kanban-column:hover {
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
    }

    .kanban-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .kanban-count {
      padding: 2px 14px;
      border-radius: var(--radius-full);
      font-size: 11px;
      background: rgba(255,255,255,0.05);
      color: var(--text-secondary);
    }

    .kanban-card {
      padding: 16px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
    }

    .kanban-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px) scale(1.01);
      border-color: var(--border-glow);
      background: rgba(255,255,255,0.05);
    }

    /* ===== FORM ===== */
    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-group .input,
    .form-group select {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.4s var(--ease-out-expo);
      outline: none;
      width: 100%;
    }

    .form-group .input:focus,
    .form-group select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245,158,11,0.1);
      background: rgba(255,255,255,0.05);
    }

    .form-group select option {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    /* ===== CHECKBOX ===== */
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--gold);
      cursor: pointer;
      border-radius: 4px;
    }

    /* ===== TIMELINE ===== */
    .timeline-item {
      display: flex;
      gap: 16px;
      padding: 14px 0;
      position: relative;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 40px;
      bottom: -12px;
      width: 2px;
      background: var(--border);
      border-radius: 2px;
    }

    .timeline-item:last-child::before { display: none; }

    .timeline-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      z-index: 1;
      box-shadow: 0 0 20px rgba(108,60,225,0.3);
    }

    .timeline-content {
      flex: 1;
    }

    .timeline-status {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
      text-transform: capitalize;
    }

    .timeline-note {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .timeline-time {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    /* ===== DEPARTMENT BARS ===== */
    .dept-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .dept-bar-bg {
      flex: 1;
      height: 8px;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .dept-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--gradient-primary);
      transition: width 1s var(--ease-out-expo);
    }

    .dept-bar-fill.gold { background: var(--gradient-gold); }
    .dept-bar-fill.green { background: var(--gradient-secondary); }
    .dept-bar-fill.rose { background: var(--gradient-rose); }

    /* ===== ROLE SELECTOR ===== */
    .role-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }

    .role-card {
      padding: 24px;
      border-radius: var(--radius-lg);
      text-align: center;
      cursor: pointer;
      transition: all 0.5s var(--ease-out-expo);
      border: 2px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .role-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-primary);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .role-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .role-card:hover::before {
      opacity: 0.05;
    }

    .role-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 40px rgba(245,158,11,0.2), var(--shadow-lg);
    }

    .role-card .role-icon {
      font-size: 36px;
      margin-bottom: 10px;
      display: block;
      position: relative;
      z-index: 1;
    }

    .role-card .role-name {
      font-weight: 700;
      font-size: 15px;
      position: relative;
      z-index: 1;
    }

    .role-card .role-email {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }

    /* ===== ACTIVITY ===== */
    .activity-item {
      display: flex;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }

    .activity-item:last-child { border-bottom: none; }

    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: var(--gradient-primary);
    }

    /* ===== NOTIFICATION CENTER ===== */
    .notification-dropdown {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 380px;
      max-height: 480px;
      overflow-y: auto;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      backdrop-filter: blur(40px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      z-index: 60;
      animation: fadeInScale 0.3s var(--ease-out-expo) forwards;
    }

    .notification-dropdown::-webkit-scrollbar { width: 3px; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 56px;
      opacity: 0.2;
      margin-bottom: 20px;
      display: block;
    }

    /* ===== CONFETTI ===== */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 99999;
      animation: confetti-fall var(--duration, 3s) linear forwards;
      animation-delay: var(--delay, 0s);
    }

    /* ===== LOGIN ===== */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .login-box {
      max-width: 520px;
      width: 100%;
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      background: var(--bg-card);
      backdrop-filter: blur(60px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-brand h1 {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -1.5px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-brand p {
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
      margin-top: 4px;
    }

    .login-brand .luxury-badge {
      display: inline-block;
      padding: 4px 16px;
      border-radius: var(--radius-full);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      border: 1px solid rgba(245,158,11,0.2);
      margin-top: 8px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .main-area { padding: 24px 28px; }
    }

    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }
      
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
        flex-direction: row;
        align-items: center;
        overflow-x: auto;
      }

      .sidebar-brand {
        font-size: 22px;
        margin-bottom: 0;
        margin-right: 16px;
        flex-shrink: 0;
      }

      .sidebar-brand::after { display: none; }
      .sidebar-subtitle { display: none; }

      .sidebar-nav {
        display: flex;
        flex-direction: row;
        gap: 4px;
        margin: 0;
        overflow-x: auto;
        flex: 1;
        padding: 0;
      }

      .nav-item {
        width: auto;
        padding: 8px 16px;
        margin-bottom: 0;
        white-space: nowrap;
        font-size: 13px;
      }

      .nav-item span { display: none; }
      .nav-item .nav-icon { font-size: 18px; }
      .nav-item .nav-badge { display: none; }

      .sidebar-footer { display: none; }
      .main-area { padding: 16px; }

      .page-title { font-size: 24px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .stat-card { padding: 16px; }
      .stat-icon { width: 44px; height: 44px; font-size: 18px; }
      .stat-value { font-size: 24px; }
      .modal-box { padding: 24px; margin: 12px; }
      .heatmap-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .role-selector { grid-template-columns: repeat(2, 1fr); }
      .kanban-board { grid-template-columns: 1fr; }
      .login-box { padding: 32px 24px; }

      .topbar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .search-wrap { max-width: 100%; }

      .complaint-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 16px;
      }

      .complaint-actions {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .toast-container {
        bottom: 16px;
        right: 16px;
        max-width: calc(100% - 32px);
      }

      .notification-dropdown {
        width: 100%;
        right: 0;
        left: 0;
      }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat-card { padding: 12px; }
      .stat-icon { width: 36px; height: 36px; font-size: 14px; }
      .stat-value { font-size: 20px; }
      .page-title { font-size: 20px; }
      .main-area { padding: 12px; }
      .sidebar { padding: 12px 16px; }
      .role-selector { grid-template-columns: 1fr 1fr; gap: 10px; }
      .role-card { padding: 16px; }
    }

    @media (max-width: 380px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .heatmap-grid { grid-template-columns: repeat(3, 1fr); }
      .role-selector { grid-template-columns: 1fr; }
    }

    /* ===== UTILITY ===== */
    .text-gradient {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .text-gradient-gold {
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gap-2 { gap: 8px; }
    .gap-4 { gap: 16px; }
    .gap-6 { gap: 24px; }
    .gap-8 { gap: 32px; }

    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mt-6 { margin-top: 24px; }
    .mt-8 { margin-top: 32px; }

    .mb-2 { margin-bottom: 8px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .mb-8 { margin-bottom: 32px; }

    .flex { display: flex; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .flex-col { flex-direction: column; }
    .gap-2 { gap: 8px; }
    .gap-4 { gap: 16px; }
    .gap-6 { gap: 24px; }

    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 11px; }
    .text-muted { color: var(--text-secondary); }
    .text-muted-light { color: var(--text-tertiary); }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .font-black { font-weight: 900; }
    .tracking-tight { letter-spacing: -0.5px; }
    .tracking-wide { letter-spacing: 0.5px; }
    .uppercase { text-transform: uppercase; }

    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .z-10 { z-index: 10; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }

    .rounded-lg { border-radius: var(--radius-lg); }
    .rounded-full { border-radius: var(--radius-full); }

    .shadow-glow { box-shadow: var(--shadow-glow); }
    .shadow-glow-pink { box-shadow: var(--shadow-glow-pink); }

    .border-glow { border-color: var(--border-glow); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ===== REACT ===== -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script>
    // ===== MAIN APPLICATION =====
    (function() {
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
        document.getElementById('root').innerHTML = `
          <div style="height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; font-family:'Inter',sans-serif; padding:20px; text-align:center; background:#0F0C29; color:white;">
            <div style="font-size:48px;">✨</div>
            <h2 style="color:white;">ResolveHub</h2>
            <p style="color:rgba(255,255,255,0.6); max-width:400px;">Loading your luxury experience...</p>
            <button onclick="location.reload()" style="padding:12px 32px; background:linear-gradient(135deg,#6C3CE1,#EC4899); color:white; border:none; border-radius:30px; font-weight:600; cursor:pointer;">Retry</button>
          </div>
        `;
        return;
      }

      const { useState, useEffect, useCallback, useContext, useRef, createRef, useMemo } = React;

      // ===== CONSTANTS =====
      const STORAGE_KEY = 'resolvehub_luxury_v3';
      const SESSION_KEY = 'resolvehub_session_v3';

      const STATUS_COLORS = {
        submitted: '#6C3CE1',
        'under review': '#F59E0B',
        assigned: '#3B82F6',
        'in progress': '#8B5CF6',
        resolved: '#06D6A0',
        closed: '#64748B',
        reopened: '#F43F5E',
        rejected: '#F43F5E'
      };

      const PRIORITY_COLORS = {
        low: '#94A3B8',
        medium: '#F59E0B',
        high: '#F97316',
        critical: '#F43F5E'
      };

            React.createElement('div', { className: 'glass', style: { borderRadius: 'var(--radius-lg)', padding: 32, maxWidth: 600 } },
              React.createElement('div', { style: { marginBottom: 28 } },
                React.createElement('h4', { style: { fontWeight: 700, marginBottom: 14, color: 'var(--text-secondary)', letterSpacing: '0.5px', textTransform: 'uppercase', fontSize: 12 } }, 'Appearance'),
                React.createElement('div', { style: { display: 'flex', gap: 12 } },
                  React.createElement('button', {
                    className: `btn ${theme === 'light' ? 'btn-primary' : 'btn-ghost'}`,
                    onClick: () => handleTheme('light')
                  },
                    React.createElement('i', { className: 'fas fa-sun' }), ' Light'
                  ),
                  React.createElement('button', {
                    className: `btn ${theme === 'dark' ? 'btn-primary' : 'btn-ghost'}`,
                    onClick: () => handleTheme('dark')
                  },
                    React.createElement('i', { className: 'fas fa-moon' }), ' Dark'
                  )
                )
              ),
              React.createElement('div', { style: { marginBottom: 28 } },
                React.createElement('h4', { style: { fontWeight: 700, marginBottom: 14, color: 'var(--text-secondary)', letterSpacing: '0.5px', textTransform: 'uppercase', fontSize: 12 } }, 'Data Management'),
                React.createElement('button', { className: 'btn btn-ghost', onClick: handleReset, style: { color: 'var(--rose)', borderColor: 'var(--rose)44' } },
                  React.createElement('i', { className: 'fas fa-trash' }), ' Reset Demo Data'
                )
              ),
              React.createElement('div', { style: { padding: 16, borderRadius: 'var(--radius-md)', background: 'rgba(255,255,255,0.03)', fontSize: 12, color: 'var(--text-secondary)' } },
                React.createElement('i', { className: 'fas fa-asterisk', style: { color: 'var(--gold)', marginRight: 8 } }),
                'ResolveHub v3.0 · All data stored locally'
              )
            )
          );
        }

        // ===== RENDER VIEW =====
        const renderView = () => {
          switch (activeView) {
            case 'dashboard': return React.createElement(Dashboard, null);
            case 'heatmap': return React.createElement(HeatmapView, null);
            case 'leaderboard': return React.createElement(LeaderboardView, null);
            case 'complaints': return React.createElement(ComplaintList, null);
            case 'new-complaint': return React.createElement(ComplaintForm, { onSuccess: () => setActiveView('complaints') });
            case 'admin-dashboard': return isAdmin ? React.createElement(AdminDashboard, null) : React.createElement(EmptyState, { icon: 'fa-lock', message: 'Access denied', submessage: 'Admin privileges required' });
            case 'users': return isAdmin ? React.createElement(UserManagement, null) : React.createElement(EmptyState, { icon: 'fa-lock', message: 'Access denied', submessage: 'Admin privileges required' });
            case 'audit': return isAdmin ? React.createElement(AuditLogs, null) : React.createElement(EmptyState, { icon: 'fa-lock', message: 'Access denied', submessage: 'Admin privileges required' });
            case 'settings': return React.createElement(Settings, null);
            default: return React.createElement(Dashboard, null);
          }
        };

        // ===== MAIN RENDER =====
        return React.createElement('div', { className: 'app-shell' },
          React.createElement(Confetti, { active: confetti }),
          React.createElement(ToastContainer, null),
          React.createElement('div', { className: 'bg-effects' },
            React.createElement('div', { className: 'bg-orb bg-orb-1' }),
            React.createElement('div', { className: 'bg-orb bg-orb-2' }),
            React.createElement('div', { className: 'bg-orb bg-orb-3' }),
            React.createElement('div', { className: 'bg-grid' })
          ),
          React.createElement('aside', { className: 'sidebar' },
            React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
              React.createElement('div', { className: 'sidebar-brand' }, 'ResolveHub'),
              React.createElement('span', { style: { fontSize: 10, fontWeight: 700, color: 'var(--text-tertiary)', letterSpacing: 1, textTransform: 'uppercase', padding: '2px 10px', borderRadius: 'var(--radius-full)', background: 'rgba(255,255,255,0.05)' } }, 'v3')
            ),
            React.createElement('div', { className: 'sidebar-subtitle' }, 'Luxury Resolution'),
            React.createElement('nav', { className: 'sidebar-nav' },
              navItems.map(item => {
                const badge = item.id === 'complaints' ? data.complaints.filter(c => c.status === 'submitted' || c.status === 'under review').length : null;
                return React.createElement('button', {
                  key: item.id,
                  className: `nav-item ${activeView === item.id ? 'active' : ''}`,
                  onClick: () => setActiveView(item.id)
                },
                  React.createElement('i', { className: `fas ${item.icon} nav-icon` }),
                  React.createElement('span', null, item.label),
                  badge > 0 && React.createElement('span', { className: 'nav-badge' }, badge)
                );
              })
            ),
            React.createElement('div', { className: 'sidebar-footer' },
              React.createElement('div', { className: 'user-card' },
                React.createElement(Avatar, { name: user?.name, ring: true }),
                React.createElement('div', { style: { flex: 1, minWidth: 0 } },
                  React.createElement('div', { style: { fontWeight: 700, fontSize: 14, color: 'var(--text-primary)' } }, user?.name),
                  React.createElement('div', { style: { fontSize: 11, color: 'var(--text-secondary)' } }, session?.role)
                ),
                React.createElement('button', {
                  className: 'btn btn-ghost btn-sm btn-icon',
                  onClick: () => { logout(); addToast('Logged out', 'info'); },
                  style: { width: 40, height: 40 }
                },
                  React.createElement('i', { className: 'fas fa-sign-out-alt', style: { fontSize: 16 } })
                )
              )
            )
          ),
          React.createElement('main', { className: 'main-area' },
            React.createElement('div', { className: 'topbar' },
              React.createElement('div', null,
                React.createElement('h1', { className: 'page-title' }, currentNav?.label || 'Dashboard'),
                React.createElement('div', { className: 'page-subtitle' }, currentNav?.id === 'dashboard' ? 'Welcome to your luxury dashboard' : '')
              ),
              React.createElement('div', { style: { display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' } },
                React.createElement('div', { className: 'search-wrap' },
                  React.createElement('i', { className: 'fas fa-search' }),
                  React.createElement('input', {
                    type: 'text',
                    className: 'input',
                    placeholder: 'Search complaints...',
                    value: searchQuery,
                    onChange: e => setSearchQuery(e.target.value),
                    style: { borderRadius: 'var(--radius-full)', height: 48 }
                  })
                ),
                React.createElement(NotificationCenter, null),
                React.createElement('button', {
                  className: 'btn btn-gold btn-sm',
                  onClick: () => setActiveView('new-complaint')
                },
                  React.createElement('i', { className: 'fas fa-plus' }), ' New'
                )
              )
            ),
            renderView(),
            selectedComplaint && React.createElement(ComplaintDetail, {
              complaint: selectedComplaint,
              onClose: () => setSelectedComplaint(null)
            })
          )
        );
      }

      // ===== MOUNT =====
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        React.createElement(DataProvider, null,
          React.createElement(App, null)
        )
      );
    })();
  </script>
</body>
  </html>
