<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#4f46e5" id="theme-color">
  <meta name="description" content="ResolveHub — Next-Gen Smart Complaint Management">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ResolveHub · Next-Gen Issue Resolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #a855f7;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --surface: rgba(255,255,255,0.72);
      --surface-hover: rgba(255,255,255,0.9);
      --text: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border: rgba(99,102,241,0.12);
      --border-strong: rgba(99,102,241,0.22);
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.04);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.06), 0 4px 6px -2px rgba(0,0,0,0.03);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.08), 0 10px 10px -5px rgba(0,0,0,0.02);
      --shadow-glow: 0 0 20px rgba(99,102,241,0.15);
      --radius-sm: 12px;
      --radius: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .dark {
      --bg: #0b0f1f;
      --bg-elevated: #0f172a;
      --surface: rgba(15,23,42,0.65);
      --surface-hover: rgba(30,41,59,0.8);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --border: rgba(99,102,241,0.18);
      --border-strong: rgba(99,102,241,0.28);
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.2);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.2), 0 2px 4px -1px rgba(0,0,0,0.15);
      --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -2px rgba(0,0,0,0.2);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.4), 0 10px 10px -5px rgba(0,0,0,0.3);
      --shadow-glow: 0 0 30px rgba(99,102,241,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .glass:hover { border-color: var(--border-strong); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideRight { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes confetti-fall { 0% { transform: translateY(-120vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(120vh) rotate(960deg); opacity: 0; } }

    .animate-fade { animation: fadeIn 0.4s ease forwards; }
    .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-scale { animation: scaleIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .stagger-1 { animation-delay: 0.04s; }
    .stagger-2 { animation-delay: 0.08s; }
    .stagger-3 { animation-delay: 0.12s; }
    .stagger-4 { animation-delay: 0.16s; }
    .stagger-5 { animation-delay: 0.20s; }

    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--border-strong) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    .card-hover {
      transition: var(--transition);
      cursor: pointer;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }
    .card-hover:active { transform: scale(0.98); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius); border: none;
      font-weight: 600; font-size: 14px; cursor: pointer;
      transition: var(--transition); position: relative; overflow: hidden;
      font-family: var(--font);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      color: white; box-shadow: 0 4px 16px rgba(79,70,229,0.35);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px rgba(79,70,229,0.45); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.96); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #f87171); color: white; }
    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: rgba(99,102,241,0.08); color: var(--primary); }
    .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 20px; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: 40px; font-size: 11px;
      font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
    }

    .input {
      width: 100%; padding: 12px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 14px; font-family: var(--font);
      transition: var(--transition); outline: none;
    }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
    .input::placeholder { color: var(--text-tertiary); }

    .app-shell { display: flex; min-height: 100vh; }
    
    .sidebar {
      width: 260px; position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; padding: 24px 16px;
      border-right: 1px solid var(--border); z-index: 50;
      background: var(--surface); backdrop-filter: blur(20px);
    }
    .sidebar-brand {
      font-size: 24px; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      padding: 0 8px; margin-bottom: 8px;
    }
    .sidebar-nav { flex: 1; overflow-y: auto; margin: 16px -4px; padding: 0 4px; }
    .nav-item {
      width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: var(--radius); border: none;
      background: transparent; color: var(--text-secondary);
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: var(--transition); margin-bottom: 4px;
      font-family: var(--font); text-align: left;
    }
    .nav-item:hover { background: rgba(99,102,241,0.06); color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(168,85,247,0.08)); color: var(--primary); font-weight: 700; }
    .nav-item .nav-icon { width: 22px; text-align: center; }

    .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .user-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; color: white; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      box-shadow: 0 4px 12px rgba(79,70,229,0.3);
    }
    .avatar-sm { width: 32px; height: 32px; font-size: 13px; }

    .main-area { flex: 1; padding: 28px 32px; max-width: 1400px; margin: 0 auto; width: 100%; }
    
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
    .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
    .search-wrap { position: relative; flex: 1; max-width: 320px; min-width: 200px; }
    .search-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 14px; }
    .search-wrap input { padding-left: 42px; border-radius: 30px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      padding: 20px; border-radius: var(--radius-lg);
      display: flex; align-items: center; gap: 16px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow); transition: var(--transition);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .stat-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-top: 4px; }
    .stat-delta { font-size: 11px; font-weight: 700; margin-top: 6px; display: inline-flex; align-items: center; gap: 2px; }
    .stat-delta.positive { color: var(--success); }
    .stat-delta.negative { color: var(--danger); }

    .complaint-row {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; gap: 16px;
    }
    .complaint-row:last-child { border-bottom: none; }
    .complaint-row:hover { background: rgba(99,102,241,0.03); }
    .complaint-info { flex: 1; min-width: 0; }
    .complaint-subject { font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .complaint-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .complaint-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .upvote-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: 30px; font-size: 12px; font-weight: 700;
      border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
      cursor: pointer; transition: var(--transition);
    }
    .upvote-btn:hover { background: rgba(99,102,241,0.08); border-color: var(--primary-light); color: var(--primary); }
    .upvote-btn.upvoted { background: rgba(99,102,241,0.12); border-color: var(--primary); color: var(--primary); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.2s ease;
    }
    .modal-box {
      max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto;
      border-radius: var(--radius-xl); padding: 28px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-lg); animation: scaleIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .timeline-item { display: flex; gap: 14px; padding: 12px 0; position: relative; }
    .timeline-item::before {
      content: ''; position: absolute; left: 15px; top: 36px; bottom: -12px;
      width: 2px; background: var(--border); border-radius: 2px;
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: white; z-index: 1;
    }
    .timeline-content { flex: 1; }
    .timeline-status { font-weight: 700; font-size: 13px; color: var(--text); }
    .timeline-note { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .timeline-time { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 100%; pointer-events: none; }
    .toast {
      padding: 14px 18px; border-radius: var(--radius); backdrop-filter: blur(12px);
      font-weight: 600; font-size: 14px; border-left: 4px solid;
      box-shadow: var(--shadow-lg); pointer-events: auto;
      display: flex; align-items: center; gap: 10px; animation: slideUp 0.35s ease;
    }
    .toast-success { background: rgba(16,185,129,0.12); border-color: var(--success); color: #065f46; }
    .dark .toast-success { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .toast-error { background: rgba(239,68,68,0.12); border-color: var(--danger); color: #991b1b; }
    .dark .toast-error { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .toast-info { background: rgba(99,102,241,0.12); border-color: var(--primary); color: #3730a3; }
    .dark .toast-info { background: rgba(99,102,241,0.15); color: #a5b4fc; }

    .heatmap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (min-width: 640px) { .heatmap-grid { grid-template-columns: repeat(6, 1fr); } }
    .heat-cell {
      aspect-ratio: 1; border-radius: var(--radius); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px; cursor: pointer;
      transition: var(--transition); border: 1px solid transparent; position: relative;
    }
    .heat-cell:hover { transform: scale(1.06); z-index: 2; box-shadow: var(--shadow-md); }
    .heat-label { font-size: 12px; font-weight: 700; text-transform: capitalize; }
    .heat-value { font-size: 22px; font-weight: 800; }

    .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .kanban-column { border-radius: var(--radius-lg); padding: 16px; background: var(--surface); border: 1px solid var(--border); }
    .kanban-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    .kanban-count { padding: 2px 10px; border-radius: 20px; font-size: 11px; background: var(--border); }
    .kanban-card {
      padding: 14px; border-radius: var(--radius); background: var(--bg-elevated);
      border: 1px solid var(--border); margin-bottom: 10px; cursor: pointer;
      transition: var(--transition); box-shadow: var(--shadow-sm);
    }
    .kanban-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--border-strong); }

    .dept-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .dept-bar-bg { flex: 1; height: 8px; border-radius: 8px; background: var(--border); overflow: hidden; }
    .dept-bar-fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

    .notification-dropdown {
      position: absolute; top: 48px; right: 0; width: 360px; max-height: 480px;
      overflow-y: auto; border-radius: var(--radius-lg); z-index: 60;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-lg); animation: scaleIn 0.2s ease;
    }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 16px; display: block; }

    .confetti-piece {
      position: fixed; width: 10px; height: 10px; top: -10px; z-index: 99999;
      animation: confetti-fall 3s linear forwards;
    }

    .timer-badge {
      font-family: 'SF Mono', monospace; font-size: 13px; font-weight: 700;
      padding: 4px 10px; border-radius: 8px; background: rgba(239,68,68,0.1); color: var(--danger);
    }
    .timer-badge.safe { background: rgba(16,185,129,0.1); color: var(--success); }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    .filter-bar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px;
      background: var(--surface); border: 1px solid var(--border);
    }
    .filter-pill {
      padding: 6px 14px; border-radius: 30px; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); font-size: 13px;
      font-weight: 500; cursor: pointer; transition: var(--transition); font-family: var(--font);
    }
    .filter-pill:hover, .filter-pill.active { background: rgba(99,102,241,0.1); border-color: var(--primary-light); color: var(--primary); }

    .checkbox-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .checkbox-wrap input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 16px; flex-direction: row; align-items: center; overflow-x: auto; }
      .sidebar-brand { font-size: 20px; margin-bottom: 0; margin-right: 12px; }
      .sidebar-nav { display: flex; flex-direction: row; gap: 4px; margin: 0; overflow-x: auto; flex: 1; }
      .nav-item { width: auto; padding: 8px 14px; margin-bottom: 0; white-space: nowrap; }
      .nav-item span { display: none; }
      .sidebar-footer { display: none; }
      .main-area { padding: 16px; }
      .topbar { margin-bottom: 20px; }
      .page-title { font-size: 22px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-icon { width: 40px; height: 40px; font-size: 18px; }
      .stat-value { font-size: 20px; }
      .modal-box { padding: 20px; border-radius: var(--radius-lg); }
      .notification-dropdown { width: calc(100vw - 40px); right: -10px; }
      .kanban-board { grid-template-columns: 1fr; }
    }

    .login-bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #e0f2fe 100%);
    }
    .dark .login-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
    .login-blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: float 8s ease-in-out infinite;
    }

    .shortcut-key { 
      display: inline-flex; align-items: center; justify-content: center; 
      padding: 2px 8px; border-radius: 6px; background: var(--border); 
      font-size: 12px; font-weight: 700; font-family: monospace; 
      color: var(--text-secondary); border: 1px solid var(--border-strong); 
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useContext, useRef, useMemo, createContext } = React;

/* ===================== CONSTANTS & HELPERS ===================== */
const STORAGE_KEY = 'resolvehub_data_v2';
const SESSION_KEY = 'resolvehub_session';

const STATUS_COLORS = {
  submitted: '#94a3b8', 'under review': '#f59e0b', assigned: '#6366f1',
  'in progress': '#8b5cf6', resolved: '#10b981', closed: '#64748b',
  reopened: '#ef4444', rejected: '#ef4444'
};
const PRIORITY_COLORS = { low: '#94a3b8', medium: '#f59e0b', high: '#f97316', critical: '#ef4444' };

const SLA_HOURS = { critical: 4, high: 24, medium: 72, low: 168 };

function timeAgo(ts) { const s=Math.floor((Date.now()-ts)/1000); const i={y:31536000,m:2592000,w:604800,d:86400,h:3600,n:60}; for(let[k,v]of Object.entries(i)){const c=Math.floor(s/v);if(c>0)return c+' '+k+(c>1?'s':'')+' ago';} return 'Just now'; }
function generateId() { return 'CMP-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*100000)).padStart(5,'0'); }
function getGreeting() { const h=new Date().getHours(); if(h<12)return 'Good morning'; if(h<17)return 'Good afternoon'; return 'Good evening'; }
function suggestFromText(text) { if(!text) return null; for(const rule of KEYWORD_MAP){ if(rule.regex.test(text)) return { category: rule.category, priority: rule.priority }; } return null; }
function exportToJson(data, filename='resolvehub-export.json') { const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
function exportToCsv(complaints, filename='resolvehub-export.csv') {
  const headers = ['ID','Subject','Category','Priority','Status','Department','Location','Zone','SubmittedBy','AssignedTo','Upvotes','CreatedAt','UpdatedAt','Resolution'];
  const rows = complaints.map(c => [c.id, `"${c.subject}"`, c.category, c.priority, c.status, c.department, c.location, c.zone, c.submittedBy, c.assignedTo||'', c.upvotes||0, new Date(c.createdAt).toISOString(), new Date(c.updatedAt).toISOString(), `"${c.resolution||''}"`].join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

/* ===================== CONTEXT & PROVIDER ===================== */
const DataContext = createContext(null);

function DataProvider({ children }) {
  const [data, setData] = useState(loadData);
  const [session, setSession] = useState(loadSession);
  const [toasts, setToasts] = useState([]);

  useEffect(() => { saveData(data); }, [data]);

  const addToast = useCallback((message, type='info', duration=4000) => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, message, type, duration }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), duration);
  }, []);

  const login = useCallback((email, password) => {
    const user = data.users.find(u => u.email === email);
    if (user) {
      const sess = { userId: user.id, role: user.role, name: user.name, email: user.email };
      setSession(sess); saveSession(sess);
      const auditEntry = { id:'a'+Date.now(), actorId:user.id, actorName:user.name, role:user.role, action:'login', targetId:'', description:user.name+' logged in', createdAt:Date.now() };
      setData(prev => ({ ...prev, auditLogs: [auditEntry, ...prev.auditLogs] }));
      return { success:true, user };
    }
    return { success:false, error:'Invalid email or password' };
  }, [data.users]);

  const logout = useCallback(() => {
    if (session) {
      const auditEntry = { id:'a'+Date.now(), actorId:session.userId, actorName:session.name, role:session.role, action:'logout', targetId:'', description:session.name+' logged out', createdAt:Date.now() };
      setData(prev => ({ ...prev, auditLogs: [auditEntry, ...prev.auditLogs] }));
    }
    setSession(null); saveSession(null);
  }, [session]);

  const updateData = useCallback((fn) => setData(prev => typeof fn === 'function' ? fn(prev) : fn), []);

  return (
    <DataContext.Provider value={{ data, setData, updateData, session, login, logout, toasts, addToast }}>
      {children}
    </DataContext.Provider>
  );
}

function useData() { return useContext(DataContext); }

/* ===================== CONFETTI ===================== */
function Confetti({ active }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!active) return;
    const colors = ['#6366f1','#a855f7','#06b6d4','#10b981','#f59e0b','#ef4444'];
    const newPieces = Array.from({length:40}).map((_,i)=>({
      id: i, left: Math.random()*100+'vw',
      bg: colors[Math.floor(Math.random()*colors.length)],
      delay: Math.random()*0.5+'s',
      duration: (2+Math.random()*2)+'s',
      size: (6+Math.random()*8)+'px'
    }));
    setPieces(newPieces);
    const timer = setTimeout(() => setPieces([]), 4000);
    return () => clearTimeout(timer);
  }, [active]);
  if (!pieces.length) return null;
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:99999 }}>
      {pieces.map(p => (
        <div key={p.id} className="confetti-piece" style={{
          left: p.left, background: p.bg, width: p.size, height: p.size,
          animationDelay: p.delay, animationDuration: p.duration
        }} />
      ))}
    </div>
  );
}

/* ===================== NOTIFICATION CENTER ===================== */
function NotificationCenter() {
  const { data, session, updateData } = useData();
  const [open, setOpen] = useState(false);
  const ref = useRef();
  const userNotes = data.notifications.filter(n => n.userId === session?.userId);
  const unread = userNotes.filter(n => !n.read);

  useEffect(() => {
    function handleClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handleClick);
    return () => document.removeEventListener('mousedown', handleClick);
  }, []);

  const markAllRead = () => {
    updateData(prev => ({ ...prev, notifications: prev.notifications.map(n => n.userId===session.userId ? {...n, read:true} : n) }));
  };

  return (
    <div ref={ref} style={{ position:'relative' }}>
      <button className="btn btn-ghost btn-sm" onClick={() => setOpen(!open)} style={{ position:'relative' }}>
        <i className="fas fa-bell" />

            <span style={{ fontWeight:700, fontSize:14 }}>Notifications</span>
            {unread.length > 0 && <button className="btn btn-ghost btn-sm" onClick={markAllRead}>Mark all read</button>}

    const timer = setTimeout(() => setLoading(false), 600);
    return () => clearTimeout(timer);
  }, []);

  useEffect(() => {
    const theme = data.settings?.theme || 'light';
    if (theme === 'dark') document.body.classList.add('dark');
    else if (theme === 'light') document.body.classList.remove('dark');
    else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.body.classList.toggle('dark', prefersDark);
    }
  }, [data.settings?.theme]);

  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '/') { e.preventDefault(); document.querySelector('.global-search')?.focus(); }
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); setActiveView('new-complaint'); }
      if (e.key === 'Escape') { setSelectedComplaint(null); }
      if (e.key === '1') setActiveView('dashboard');
      if (e.key === '2') setActiveView('complaints');
      if (e.key === '3') setActiveView('heatmap');
      if (e.key === '4') setActiveView('leaderboard');

    return () => window.removeEventListener('keydown', handler);
  }, []);

      <div style={{ height:'100vh', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:24, background:'var(--bg)' }}>

  navItems.push({ id:'settings', label:'Settings', icon:'fa-sliders', shortcut:'' });

  const currentNav = navItems.find(n => n.id === activeView);

  /* ---------- Sub-Components ---------- */
  function StatCard({ label, value, icon, color, delta, delay }) {
    const [displayValue, setDisplayValue] = useState(0);
    useEffect(() => {
      const target = typeof value === 'number' ? value : parseInt(value) || 0;
      let current = 0;
      const step = Math.max(1, Math.floor(target / 20));
      const timer = setInterval(() => {
        current += step;
        if (current >= target) { current = target; clearInterval(timer); }
        setDisplayValue(current);
      }, 30);
      return () => clearInterval(timer);
    }, [value]);
    return (
      <div className={`stat-card animate-slide-up stagger-${delay||1}`}>
        <div className="stat-icon" style={{ background: color+'15', color: color }}><i className={`fas ${icon}`} /></div>
        <div>
          <div className="stat-value">{typeof value === 'string' && value.includes('%') ? value : displayValue}</div>
          <div className="stat-label">{label}</div>
          {delta && <div className={`stat-delta ${delta.positive ? 'positive' : 'negative'}`}><i className={`fas fa-arrow-${delta.positive?'up':'down'}`} /> {delta.text}</div>}
        </div>
      </div>
    );
  }

  function ComplaintRow({ complaint, selectable, selected, onSelect }) {
    const { session, updateData } = useData();
    const hasUpvoted = complaint.upvotedBy?.includes(session.userId);
    const handleUpvote = (e) => {
      e.stopPropagation();
      updateData(prev => {
        const idx = prev.complaints.findIndex(c => c.id === complaint.id);
        if (idx === -1) return prev;
        const c = prev.complaints[idx];
        const next = [...prev.complaints];
        if (c.upvotedBy?.includes(session.userId)) {
          next[idx] = { ...c, upvotes: (c.upvotes||0)-1, upvotedBy: c.upvotedBy.filter(id=>id!==session.userId) };
        } else {
          next[idx] = { ...c, upvotes: (c.upvotes||0)+1, upvotedBy: [...(c.upvotedBy||[]), session.userId] };
        }
        return { ...prev, complaints: next };
      });
    };
    const submitter = data.users.find(u => u.id === complaint.submittedBy);
    return (
      <div className="complaint-row animate-slide-up" onClick={() => setSelectedComplaint(complaint)}>
        {selectable && (
          <div className="checkbox-wrap" onClick={e => e.stopPropagation()}>
            <input type="checkbox" checked={selected} onChange={() => onSelect && onSelect(complaint.id)} />
          </div>
        )}
        <Avatar name={complaint.anonymous ? '?' : (submitter?.name || 'U')} size="sm" />
        <div className="complaint-info">
          <div className="complaint-subject">{complaint.subject}</div>
          <div className="complaint-meta">
            <span>{complaint.id}</span>
            <span>·</span>
            <span>{complaint.category}</span>
            <span>·</span>
            <span>{ZONE_LABELS[complaint.zone]}</span>
            <span>·</span>
            <span>{timeAgo(complaint.createdAt)}</span>
          </div>
        </div>
        <div className="complaint-actions">
          <button className={`upvote-btn ${hasUpvoted?'upvoted':''}`} onClick={handleUpvote}>
            <i className="fas fa-arrow-up" /> {complaint.upvotes||0}
          </button>
          <Badge color={getPriorityColor(complaint.priority)}>{complaint.priority}</Badge>
          <Badge color={getStatusColor(complaint.status)}>{complaint.status}</Badge>
        </div>
      </div>
    );
  }

    const pending = userComplaints.filter(c => !['resolved','closed','rejected'].includes(c.status));

    const resolved = userComplaints.filter(c => ['resolved','closed'].includes(c.status));
    const activities = [...data.auditLogs, ...data.complaints.map(c => ({ id:c.id+'-create', actorName:data.users.find(u=>u.id===c.submittedBy)?.name||'Unknown', action:'complaint_created', description:`Created ${c.id}`, createdAt:c.createdAt }))].sort((a,b)=>b.createdAt-a.createdAt).slice(0,8);

        </div>

  function HeatmapView() {
    const zoneCounts = {};
    ZONES.forEach(z => { zoneCounts[z] = data.complaints.filter(c => c.zone === z).length; });
    const maxCount = Math.max(...Object.values(zoneCounts), 1);
    
    return (
      <div className="animate-fade">
        <div style={{ marginBottom: 16 }}>
          <h2 className="page-title">Campus Heatmap</h2>
          <div className="page-subtitle">Visualize complaint density across campus zones</div>
        </div>
        <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 24 }}>
          <div className="heatmap-grid">
            {ZONES.map(z => {
              const count = zoneCounts[z] || 0;
              const intensity = Math.min(1, count / maxCount);
              const hue = 240 - intensity * 180;
              return (
                <div key={z} className="heat-cell" style={{ 
                  background: `hsl(${hue}, 80%, ${50 + (1 - intensity) * 30}%)`,
                  color: intensity > 0.6 ? 'white' : 'var(--text)'
                }}>
                  <span className="heat-label">{ZONE_LABELS[z]}</span>
                  <span className="heat-value">{count}</span>
                  <span style={{ fontSize: 10, opacity: 0.7 }}>{count} complaints</span>
                </div>
              );
            })}
          </div>
          <div style={{ display: 'flex', gap: 16, marginTop: 16, justifyContent: 'center', fontSize: 12, color: 'var(--text-secondary)' }}>
            <span>🔵 Low</span>
            <span style={{ width: 100, height: 8, borderRadius: 8, background: 'linear-gradient(90deg, #6366f1, #ef4444)' }} />
            <span>🔴 High</span>
          </div>
        </div>
      </div>
    );
  }

  function LeaderboardView() {
    const depts = ['Facilities', 'IT', 'Examination', 'Library', 'Transport', 'Administration', 'Security'];
    const deptStats = depts.map(d => {
      const comps = data.complaints.filter(c => c.department === d);
      const resolved = comps.filter(c => ['resolved', 'closed'].includes(c.status));
      const total = comps.length || 1;
      const avgTime = resolved.length ? Math.round(resolved.reduce((acc, c) => {
        const re = c.timeline?.find(t => t.status === 'resolved');
        return acc + (re ? (re.timestamp - c.createdAt) : 0);
      }, 0) / resolved.length / (1000 * 60 * 60)) : 0;
      const satisfaction = resolved.length ? Math.round(resolved.reduce((acc, c) => acc + (c.feedback?.rating || 3), 0) / resolved.length * 20) : 50;
      return { name: d, resolved: resolved.length, total: comps.length, rate: Math.round((resolved.length / total) * 100), avgTime, satisfaction: Math.min(100, satisfaction) };
    });
    deptStats.sort((a, b) => b.rate - a.rate || a.avgTime - b.avgTime);
    
    return (
      <div className="animate-fade">
        <div style={{ marginBottom: 16 }}>
          <h2 className="page-title">Department Leaderboard</h2>
          <div className="page-subtitle">Ranked by resolution rate and efficiency</div>
        </div>
        <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 24 }}>
          {deptStats.map((d, i) => (
            <div key={d.name} className="dept-row" style={{ animationDelay: `${i * 0.05}s` }}>
              <span style={{ fontWeight: 800, fontSize: 18, minWidth: 32, color: i === 0 ? 'var(--warning)' : 'var(--text-secondary)' }}>
                {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`}
              </span>
              <span style={{ fontWeight: 600, minWidth: 120, fontSize: 14 }}>{d.name}</span>
              <div className="dept-bar-bg">
                <div className="dept-bar-fill" style={{ width: `${d.rate}%` }} />
              </div>
              <span style={{ fontWeight: 700, fontSize: 14, minWidth: 50, color: 'var(--primary)' }}>{d.rate}%</span>
              <span style={{ fontSize: 12, color: 'var(--text-secondary)', minWidth: 60 }}>⏱ {d.avgTime}h avg</span>
              <span style={{ fontSize: 12, color: 'var(--success)', minWidth: 40 }}>⭐ {d.satisfaction}</span>
              <span style={{ fontSize: 11, color: 'var(--text-tertiary)' }}>({d.resolved}/{d.total})</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function ComplaintDetail({ complaint, onClose }) {
    const { updateData, addToast, session } = useData();
    const [comment, setComment] = useState('');
    if (!complaint) return null;

    const canAssign = isAdmin && complaint.status !== 'resolved' && complaint.status !== 'closed';
    const canResolve = isAdmin && complaint.status !== 'resolved' && complaint.status !== 'closed';
    const canReopen = isAdmin && ['resolved', 'closed'].includes(complaint.status);

    const handleAssign = () => {
      const staffUser = data.users.find(u => u.role === 'staff');
      updateData(prev => {
        const idx = prev.complaints.findIndex(c => c.id === complaint.id);
        if (idx === -1) return prev;
        const next = [...prev.complaints];
        next[idx] = { 
          ...next[idx], 
          status: 'assigned', 
          assignedTo: staffUser?.id || 'u4',
          timeline: [...next[idx].timeline, { status: 'assigned', timestamp: Date.now(), note: `Assigned to ${staffUser?.name || 'Staff'}` }]
        };
        return { ...prev, complaints: next };
      });
      addToast('Complaint assigned', 'success');
      onClose();
    };

    const handleResolve = () => {
      updateData(prev => {
        const idx = prev.complaints.findIndex(c => c.id === complaint.id);
        if (idx === -1) return prev;
        const next = [...prev.complaints];
        next[idx] = { 
          ...next[idx], 
          status: 'resolved',
          resolution: 'Resolved by admin',
          timeline: [...next[idx].timeline, { status: 'resolved', timestamp: Date.now(), note: 'Resolved by admin' }]
        };
        return { ...prev, complaints: next };
      });
      setConfetti(true);
      setTimeout(() => setConfetti(false), 3000);
      addToast('Complaint resolved! 🎉', 'success');
      onClose();
    };

    const handleReopen = () => {
      updateData(prev => {
        const idx = prev.complaints.findIndex(c => c.id === complaint.id);
        if (idx === -1) return prev;
        const next = [...prev.complaints];
        next[idx] = { 
          ...next[idx], 
          status: 'reopened',
          timeline: [...next[idx].timeline, { status: 'reopened', timestamp: Date.now(), note: 'Reopened by admin' }]
        };
        return { ...prev, complaints: next };
      });
      addToast('Complaint reopened', 'info');
      onClose();
    };

    const handleAddComment = () => {
      if (!comment.trim()) return;
      updateData(prev => {
        const idx = prev.complaints.findIndex(c => c.id === complaint.id);
        if (idx === -1) return prev;
        const next = [...prev.complaints];
        next[idx].comments = [...next[idx].comments, { 
          id: 'c' + Date.now(), 
          userId: session.userId, 
          name: session.name, 
          role: session.role, 
          message: comment, 
          timestamp: Date.now()
        }];
        return { ...prev, complaints: next };
      });
      setComment('');
      addToast('Comment added', 'info');
    };

    const elapsed = Math.floor((Date.now() - complaint.createdAt) / (1000 * 60));
    const timerDisplay = elapsed > 60 ? Math.floor(elapsed/60) + 'h ' + elapsed%60 + 'm' : elapsed + 'm';
    const isOverdue = complaint.priority && SLA_HOURS[complaint.priority] && elapsed > SLA_HOURS[complaint.priority] * 60;

    return (
      <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="modal-box animate-scale">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: 16 }}>
            <div>
              <h3 style={{ fontSize: 20, fontWeight: 800, color: 'var(--text)' }}>{complaint.subject}</h3>
              <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginTop: 4 }}>
                {complaint.id} · {complaint.category}
                {complaint.anonymous && <span style={{ marginLeft: 8 }}><i className="fas fa-user-secret" /> Anonymous</span>}
              </div>
            </div>
            <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: 20, color: 'var(--text-tertiary)', cursor: 'pointer' }}>
              <i className="fas fa-times" />
            </button>
          </div>
          
          {isOverdue && (
            <div style={{ background: 'rgba(239,68,68,0.1)', padding: '8px 16px', borderRadius: 8, marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8, border: '1px solid var(--danger)' }}>
              <i className="fas fa-exclamation-triangle" style={{ color: 'var(--danger)' }} />
              <span style={{ fontWeight: 600, fontSize: 13, color: 'var(--danger)' }}>SLA BREACHED · {timerDisplay} since submission</span>
            </div>
          )}

          <p style={{ color: 'var(--text)', marginBottom: 16, fontSize: 14, lineHeight: 1.7 }}>{complaint.description}</p>
          
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', fontSize: 13, color: 'var(--text-secondary)', marginBottom: 16 }}>
            <span>Priority: <Badge color={getPriorityColor(complaint.priority)}>{complaint.priority}</Badge></span>
            <span>Status: <Badge color={getStatusColor(complaint.status)}>{complaint.status}</Badge></span>
            <span>Location: {complaint.location}</span>
            <span>Zone: {ZONE_LABELS[complaint.zone]}</span>
            <span>Upvotes: <span style={{ fontWeight: 700, color: 'var(--primary)' }}>{complaint.upvotes || 0}</span></span>
          </div>

          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
            {canAssign && <button className="btn btn-primary btn-sm" onClick={handleAssign}><i className="fas fa-user-plus" /> Assign</button>}
            {canResolve && <button className="btn btn-primary btn-sm" onClick={handleResolve} style={{ background: 'linear-gradient(135deg, var(--success), #34d399)' }}><i className="fas fa-check" /> Resolve</button>}
            {canReopen && <button className="btn btn-secondary btn-sm" onClick={handleReopen}><i className="fas fa-undo" /> Reopen</button>}
          </div>

          {complaint.timeline && complaint.timeline.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: 'var(--text)', marginBottom: 8 }}>Timeline</div>
              {complaint.timeline.map((t, i) => (
                <div key={i} className="timeline-item">
                  <div className="timeline-dot" style={{ background: getStatusColor(t.status) }}>
                    <i className={`fas ${t.status === 'submitted' ? 'fa-paper-plane' : t.status === 'resolved' ? 'fa-check' : 'fa-circle'}`} style={{ fontSize: 10 }} />
                  </div>
                  <div className="timeline-content">
                    <div className="timeline-status">{t.status}</div>
                    <div className="timeline-note">{t.note}</div>
                    <div className="timeline-time">{formatDate(t.timestamp)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {complaint.comments && complaint.comments.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: 'var(--text)', marginBottom: 8 }}>Comments ({complaint.comments.length})</div>
              {complaint.comments.map(c => (
                <div key={c.id} style={{ padding: '8px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                  <span style={{ fontWeight: 700 }}>{c.name}</span>
                  <span style={{ color: 'var(--text-secondary)', fontSize: 11, marginLeft: 6 }}>@{c.role}</span>
                  <span style={{ color: 'var(--text-tertiary)', fontSize: 11, marginLeft: 8 }}>{timeAgo(c.timestamp)}</span>
                  <div style={{ marginTop: 4, color: 'var(--text)' }}>{c.message}</div>
                </div>
              ))}
            </div>
          )}

          <div style={{ display: 'flex', gap: 8 }}>
            <input 
              type="text" 
              className="input" 
              value={comment} 
              onChange={e => setComment(e.target.value)} 
              placeholder="Add a comment..." 
              style={{ flex: 1, borderRadius: 30 }}
              onKeyDown={e => { if (e.key === 'Enter') handleAddComment(); }}
            />
            <button className="btn btn-primary" onClick={handleAddComment} style={{ borderRadius: 30 }}>
              <i className="fas fa-paper-plane" /> Send
            </button>
          </div>
          <div style={{ marginTop: 12, fontSize: 12, color: 'var(--text-tertiary)' }}>
            <i className="fas fa-shield-alt" /> Smart redaction active · Auto-blur sensitive content
          </div>
        </div>
      </div>
    );
  }

  function ComplaintForm({ onSuccess }) {
    const { updateData, addToast, session } = useData();
    const [form, setForm] = useState({ 
      subject: '', category: 'Infrastructure', subcategory: '', description: '', 
      priority: 'medium', department: '', location: '', zone: 'academic', anonymous: false 
    });
    const [loading, setLoading] = useState(false);

    useEffect(() => {
      const suggestion = suggestFromText(form.description);
      if (suggestion) {
        setForm(prev => ({
          ...prev,
          category: suggestion.category || prev.category,
          priority: suggestion.priority || prev.priority
        }));
      }
    }, [form.description]);

    const handleSubmit = (e) => {
      e.preventDefault();
      if (!form.subject.trim() || !form.description.trim()) {
        addToast('Subject and description are required', 'error');
        return;
      }
      setLoading(true);
      setTimeout(() => {
        const newComplaint = {
          id: generateId(),
          subject: form.subject.trim(),
          description: form.description.trim(),
          category: form.category,
          subcategory: form.subcategory || 'General',
          priority: form.priority,
          status: 'submitted',
          department: form.department || 'General',
          location: form.location || 'Campus',
          zone: form.zone,
          anonymous: form.anonymous,
          submittedBy: session.userId,
          assignedTo: null,
          upvotes: 0,
          upvotedBy: [],
          attachments: [],
          comments: [],
          timeline: [{ status: 'submitted', timestamp: Date.now(), note: 'Submitted by ' + (form.anonymous ? 'Anonymous' : session.name) }],
          resolution: '',
          feedback: null,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        updateData(prev => ({
          ...prev,
          complaints: [newComplaint, ...prev.complaints],
          auditLogs: [{ id: 'a'+Date.now(), actorId: session.userId, actorName: session.name, role: session.role, action: 'complaint_created', targetId: newComplaint.id, description: `Created ${newComplaint.id}`, createdAt: Date.now() }, ...prev.auditLogs]
        }));
        addToast(`Complaint ${newComplaint.id} created successfully`, 'success');
        setConfetti(true);
        setTimeout(() => setConfetti(false), 2000);
        onSuccess?.();
        setLoading(false);
      }, 500);
    };

    return (
      <div className="animate-fade">
        <div style={{ marginBottom: 16 }}>
          <h2 className="page-title">Report an Issue</h2>
          <div className="page-subtitle">Help us improve by describing the problem</div>
        </div>
        <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 28, maxWidth: 700 }}>
          <form onSubmit={handleSubmit}>
            <div className="form-group">
              <label>Subject <span style={{ color: 'var(--danger)' }}>*</span></label>
              <input className="input" value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} placeholder="Brief title of the issue" required />
            </div>
            <div className="form-group">
              <label>Description <span style={{ color: 'var(--danger)' }}>*</span></label>
              <textarea className="input" value={form.description} onChange={e => setForm({...form, description: e.target.value})} rows={5} placeholder="Describe what happened, when, and where..." required />
              <div style={{ fontSize: 11, color: 'var(--text-tertiary)', marginTop: 4 }}>
                <i className="fas fa-lightbulb" /> Smart suggestions based on your description
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Category</label>
                <select className="input" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                  {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Priority</label>
                <select className="input" value={form.priority} onChange={e => setForm({...form, priority: e.target.value})}>
                  {PRIORITIES.map(p => <option key={p}>{p}</option>)}
                </select>
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Department</label>
                <input className="input" value={form.department} onChange={e => setForm({...form, department: e.target.value})} placeholder="e.g. Facilities" />
              </div>
              <div className="form-group">
                <label>Location</label>
                <input className="input" value={form.location} onChange={e => setForm({...form, location: e.target.value})} placeholder="e.g. Building A, Room 301" />
              </div>
            </div>
            <div className="form-group">
              <label>Zone</label>
              <select className="input" value={form.zone} onChange={e => setForm({...form, zone: e.target.value})}>
                {ZONES.map(z => <option key={z} value={z}>{ZONE_LABELS[z]}</option>)}
              </select>
            </div>
            <div className="form-group checkbox-wrap">
              <input type="checkbox" checked={form.anonymous} onChange={e => setForm({...form, anonymous: e.target.checked})} />
              <label style={{ cursor: 'pointer' }}>Submit anonymously <span style={{ fontSize: 12, color: 'var(--text-secondary)' }}>(your identity will be hidden)</span></label>
            </div>
            <button type="submit" disabled={loading} className="btn btn-primary" style={{ width: '100%', padding: '14px', borderRadius: 30, fontSize: 16 }}>
              {loading ? <><i className="fas fa-circle-notch fa-spin" /> Submitting...</> : <><i className="fas fa-paper-plane" /> Submit Complaint</>}
            </button>
          </form>
        </div>
      </div>
    );
  }

  function AdminDashboard() {
    const complaints = data.complaints;
    const total = complaints.length;
    const pending = complaints.filter(c => !['resolved','closed','rejected'].includes(c.status)).length;
    const resolved = complaints.filter(c => ['resolved','closed'].includes(c.status)).length;
    const critical = complaints.filter(c => c.priority === 'critical').length;
    const rate = total ? Math.round((resolved/total)*100) : 0;
    const totalUpvotes = complaints.reduce((acc, c) => acc + (c.upvotes || 0), 0);
    
    const resolvedComplaints = complaints.filter(c => ['resolved','closed'].includes(c.status));
    let avgTime = 0;
    if (resolvedComplaints.length) {
      const times = resolvedComplaints.map(c => {
        const re = c.timeline?.find(t => t.status === 'resolved');
        return re ? re.timestamp - c.createdAt : c.updatedAt - c.createdAt;
      });
      avgTime = Math.round(times.reduce((a,b) => a+b, 0) / times.length / (1000*60*60));
    }

    const catMap = {}; complaints.forEach(c => { catMap[c.category] = (catMap[c.category]||0)+1; });
    const priMap = {}; complaints.forEach(c => { priMap[c.priority] = (priMap[c.priority]||0)+1; });
    const statusMap = {}; complaints.forEach(c => { statusMap[c.status] = (statusMap[c.status]||0)+1; });
    const zoneMap = {}; complaints.forEach(c => { zoneMap[c.zone] = (zoneMap[c.zone]||0)+1; });

    return (
      <div className="animate-fade">
        <div style={{ marginBottom: 16 }}>
          <h2 className="page-title">Analytics Dashboard</h2>
          <div className="page-subtitle">System-wide metrics and insights</div>
        </div>
        <div className="stats-grid">
          <StatCard label="Total Issues" value={total} icon="fa-folder-open" color="#6366f1" />
          <StatCard label="Pending" value={pending} icon="fa-clock" color="#f59e0b" />
          <StatCard label="Resolved" value={resolved} icon="fa-check-circle" color="#10b981" />
          <StatCard label="Critical" value={critical} icon="fa-exclamation-triangle" color="#ef4444" />
          <StatCard label="Resolution Rate" value={rate+'%'} icon="fa-percent" color="#8b5cf6" />
          <StatCard label="Avg Time" value={avgTime+'h'} icon="fa-hourglass-half" color="#06b6d4" />
          <StatCard label="Total Upvotes" value={totalUpvotes} icon="fa-arrow-up" color="#a855f7" />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 16 }}>
          <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 20 }}>
            <h4 style={{ fontWeight: 700, marginBottom: 12, fontSize: 14 }}>By Category</h4>
            {Object.entries(catMap).sort((a,b) => b[1]-a[1]).slice(0,8).map(([k,v]) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <span>{k}</span>
                <span style={{ fontWeight: 600, color: 'var(--primary)' }}>{v}</span>
              </div>
            ))}
          </div>
          <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 20 }}>
            <h4 style={{ fontWeight: 700, marginBottom: 12, fontSize: 14 }}>By Priority</h4>
            {Object.entries(priMap).map(([k,v]) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <span><Badge color={getPriorityColor(k)}>{k}</Badge></span>
                <span style={{ fontWeight: 600 }}>{v}</span>
              </div>
            ))}
          </div>
          <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 20 }}>
            <h4 style={{ fontWeight: 700, marginBottom: 12, fontSize: 14 }}>By Status</h4>
            {Object.entries(statusMap).map(([k,v]) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <span><Badge color={getStatusColor(k)}>{k}</Badge></span>
                <span style={{ fontWeight: 600 }}>{v}</span>
              </div>
            ))}
          </div>
          <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 20 }}>
            <h4 style={{ fontWeight: 700, marginBottom: 12, fontSize: 14 }}>By Zone</h4>
            {Object.entries(zoneMap).map(([k,v]) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <span>{ZONE_LABELS[k]||k}</span>
                <span style={{ fontWeight: 600 }}>{v}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function UserManagement() {
    return (
      <div className="animate-fade">
        <div style={{ marginBottom: 16 }}>
          <h2 className="page-title">User Management</h2>
          <div className="page-subtitle">{data.users.length} registered users</div>
        </div>
        <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 24, overflow: 'hidden' }}>
          {data.users.map(u => (
            <div key={u.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderBottom: '1px solid var(--border)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <Avatar name={u.name} />
                <div>
                  <div style={{ fontWeight: 600 }}>{u.name}</div>
                  <div style={{ fontSize: 12, color: 'var(--text-secondary)' }}>{u.email}</div>
                </div>
              </div>
              <Badge color={u.role === 'admin' ? 'var(--primary)' : u.role === 'staff' ? 'var(--success)' : 'var(--text-secondary)'}>
                {u.role}
              </Badge>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function AuditLogs() {
    return (
      <div className="animate-fade">
        <div style={{ marginBottom: 16 }}>
          <h2 className="page-title">Audit Log</h2>
          <div className="page-subtitle">Track all system activity</div>
        </div>
        <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 24, overflow: 'hidden' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 8, fontWeight: 700, fontSize: 12, color: 'var(--text-secondary)', padding: '8px 0', borderBottom: '2px solid var(--border)' }}>
            <span>User</span>
            <span>Action</span>
            <span>Details</span>
            <span style={{ textAlign: 'right' }}>Time</span>
          </div>
          {data.auditLogs.slice(0,50).map(a => (
            <div key={a.id} style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 8, padding: '10px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
              <span style={{ fontWeight: 500 }}>{a.actorName}</span>
              <span><Badge color="var(--primary)" style={{ fontSize: 10 }}>{a.action}</Badge></span>
              <span style={{ color: 'var(--text-secondary)' }}>{a.description}</span>
              <span style={{ textAlign: 'right', color: 'var(--text-tertiary)', fontSize: 12 }}>{formatDate(a.createdAt)}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function Settings() {
    const { updateData, addToast } = useData();
    const [theme, setTheme] = useState(data.settings?.theme || 'light');
    
    const handleTheme = (t) => {
      setTheme(t);
      updateData(prev => ({ ...prev, settings: { ...prev.settings, theme: t } }));
      document.body.classList.toggle('dark', t === 'dark');
      addToast(`Theme: ${t}`, 'info');
    };

    const handleReset = () => {
      if (confirm('Reset all demo data? This cannot be undone.')) {
        updateData(getDefaultData());
        addToast('Demo data reset successfully', 'success');
        setConfetti(true);
        setTimeout(() => setConfetti(false), 2000);
      }
    };

    const handleExport = () => {
      exportToJson(data, `resolvehub-export-${new Date().toISOString().slice(0,10)}.json`);
      addToast('Data exported', 'success');
    };

    const handleExportCsv = () => {
      exportToCsv(data.complaints, `resolvehub-export-${new Date().toISOString().slice(0,10)}.csv`);
      addToast('CSV exported', 'success');
    };

    return (
      <div className="animate-fade">
        <div style={{ marginBottom: 16 }}>
          <h2 className="page-title">Settings</h2>
          <div className="page-subtitle">Customize your experience</div>
        </div>
        <div className="glass" style={{ borderRadius: 'var(--radius-lg)', padding: 28, maxWidth: 600 }}>
          <div style={{ marginBottom: 24 }}>
            <h4 style={{ fontWeight: 700, marginBottom: 12 }}>Theme</h4>
            <div style={{ display: 'flex', gap: 12 }}>
              <button className={`btn ${theme === 'light' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => handleTheme('light')}>
                <i className="fas fa-sun" /> Light
              </button>
              <button className={`btn ${theme === 'dark' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => handleTheme('dark')}>
                <i className="fas fa-moon" /> Dark
              </button>
              <button className={`btn ${theme === 'system' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => handleTheme('system')}>
                <i className="fas fa-desktop" /> System
              </button>
            </div>
          </div>
          <div style={{ marginBottom: 24 }}>
            <h4 style={{ fontWeight: 700, marginBottom: 12 }}>Data</h4>
            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
              <button className="btn btn-secondary" onClick={handleExport}><i className="fas fa-download" /> Export JSON</button>
              <button className="btn btn-secondary" onClick={handleExportCsv}><i className="fas fa-file-csv" /> Export CSV</button>
              <button className="btn btn-danger" onClick={handleReset}><i className="fas fa-trash" /> Reset Demo Data</button>
            </div>
          </div>
          <div>
            <h4 style={{ fontWeight: 700, marginBottom: 12 }}>Shortcuts</h4>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 8, fontSize: 13 }}>
              <span>Dashboard</span><span className="shortcut-key">1</span>
              <span>Complaints</span><span className="shortcut-key">2</span>
              <span>Heatmap</span><span className="shortcut-key">3</span>
              <span>Leaderboard</span><span className="shortcut-key">4</span>
              <span>New Complaint</span><span className="shortcut-key">N</span>
              <span>Search</span><span className="shortcut-key">/</span>
              <span>Close Modal</span><span className="shortcut-key">Esc</span>
            </div>
          </div>
          <div style={{ marginTop: 24, padding: 16, borderRadius: 'var(--radius)', background: 'rgba(99,102,241,0.05)', fontSize: 13, color: 'var(--text-secondary)' }}>
            <i className="fas fa-info-circle" /> ResolveHub v2.0 · Built with React · Data stored locally
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Render ---------- */
  const renderView = () => {
    switch(activeView) {
      case 'dashboard': return <Dashboard />;
      case 'heatmap': return <HeatmapView />;
      case 'leaderboard': return <LeaderboardView />;
      case 'complaints': return <ComplaintList />;
      case 'new-complaint': return <ComplaintForm onSuccess={() => { setActiveView('complaints'); }} />;
      case 'admin-dashboard': return isAdmin ? <AdminDashboard /> : <EmptyState icon="fa-lock" message="Access denied" />;
      case 'users': return isAdmin ? <UserManagement /> : <EmptyState icon="fa-lock" message="Access denied" />;
      case 'audit': return isAdmin ? <AuditLogs /> : <EmptyState icon="fa-lock" message="Access denied" />;
      case 'settings': return <Settings />;
      default: return <Dashboard />;
    }
  };

  return (
    <div className="app-shell">
      <Confetti active={confetti} />
      <ToastContainer />
      
      <aside className="sidebar">
        <div className="sidebar-brand">ResolveHub</div>
        <nav className="sidebar-nav">
          {navItems.map(item => (
            <button
              key={item.id}
              className={`nav-item ${activeView === item.id ? 'active' : ''}`}
              onClick={() => setActiveView(item.id)}
            >
              <i className={`fas ${item.icon} nav-icon`} />
              <span>{item.label}</span>
              {item.shortcut && <span style={{ marginLeft: 'auto', fontSize: 10, opacity: 0.5 }}>{item.shortcut}</span>}
            </button>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="user-card">
            <Avatar name={user?.name} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 13 }}>{user?.name}</div>
              <div style={{ fontSize: 11, color: 'var(--text-secondary)' }}>{session?.role}</div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={() => { logout(); addToast('Logged out', 'info'); }}>
              <i className="fas fa-sign-out-alt" />
            </button>
          </div>
        </div>
      </aside>

      <main className="main-area">
        <div className="topbar">
          <div>
            <h1 className="page-title">{currentNav?.label || 'Dashboard'}</h1>
            <div className="page-subtitle">{currentNav?.shortcut && <span className="shortcut-key" style={{ marginRight: 8 }}>{currentNav.shortcut}</span>}</div>
          </div>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
            <div className="search-wrap">
              <i className="fas fa-search" />
              <input
                type="text"
                className="input global-search"
                placeholder="Search complaints..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                style={{ borderRadius: 30 }}
              />
            </div>
            <NotificationCenter />
            <button className="btn btn-primary btn-sm" onClick={() => setActiveView('new-complaint')}>
              <i className="fas fa-plus" /> New
            </button>
          </div>
        </div>
        {renderView()}
        {selectedComplaint && <ComplaintDetail complaint={selectedComplaint} onClose={() => setSelectedComplaint(null)} />}
      </main>
    </div>
  );
}

/* ===================== MOUNT ===================== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <DataProvider>
    <App />
  </DataProvider>
);
</script>
</body>
  </html>
