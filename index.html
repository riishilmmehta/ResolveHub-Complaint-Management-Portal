<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<title>Smart Complaint System — Intelligent Campus Resolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--p:#7c3aed;--p2:#a855f7;--pink:#ec4899;--cyan:#22d3ee;--green:#10b981;--yellow:#f59e0b;--red:#f43f5e;--blue:#3b82f6;
--bg:#070511;--panel:rgba(17,12,35,.72);--panel2:#120d25;--text:#f8fafc;--muted:#a7a2b8;--dim:#6f6a82;--line:rgba(255,255,255,.09);
--grad:linear-gradient(135deg,#7c3aed,#ec4899);--grad2:linear-gradient(135deg,#22d3ee,#7c3aed);
--shadow:0 24px 80px rgba(0,0,0,.38);--r:22px;
--font-main:'Inter',system-ui,sans-serif;--font-display:'Space Grotesk',sans-serif;
}
[data-theme="light"]{--bg:#f5f3ff;--panel:rgba(255,255,255,.82);--panel2:#fff;--text:#181425;--muted:#625b72;--dim:#8b8498;--line:rgba(24,20,37,.1);--shadow:0 20px 60px rgba(50,35,90,.12)}
html,body,#root{min-height:100%;width:100%}
body{font-family:var(--font-main);background:var(--bg);color:var(--text);overflow-x:hidden;transition:background .4s,color .4s}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:#8b5cf6;color:#fff}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#5b21b6;border-radius:20px}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-2;background:radial-gradient(circle at 10% 10%,rgba(124,58,237,.18),transparent 30%),radial-gradient(circle at 90% 20%,rgba(236,72,153,.12),transparent 30%),var(--bg)}
.grid-bg{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent);animation:gridMove 20s linear infinite}
@keyframes gridMove{0%{transform:translateY(0)}100%{transform:translateY(44px)}}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28;animation:float 12s ease-in-out infinite}.o1{width:420px;height:420px;background:#7c3aed;left:-160px;top:-150px}.o2{width:360px;height:360px;background:#ec4899;right:-120px;top:25%;animation-delay:-4s}.o3{width:300px;height:300px;background:#22d3ee;left:40%;bottom:-180px;animation-delay:-7s}
@keyframes float{50%{transform:translate3d(30px,-25px,0) scale(1.08)}}@keyframes up{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.4)}50%{box-shadow:0 0 0 15px rgba(124,58,237,0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.animate{animation:up .5s cubic-bezier(.22,1,.36,1) both}.pop{animation:pop .35s cubic-bezier(.22,1,.36,1) both}.slide{animation:slideIn .4s ease both}

.app{display:flex;min-height:100vh}
.sidebar{width:280px;position:sticky;top:0;height:100vh;padding:24px 18px;background:rgba(9,6,20,.8);backdrop-filter:blur(40px);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20;transition:.3s}
[data-theme=light] .sidebar{background:rgba(255,255,255,.9)}
.brand{display:flex;align-items:center;gap:13px;padding:8px 12px 28px}.brand-mark{width:46px;height:46px;border-radius:16px;background:var(--grad);display:grid;place-items:center;box-shadow:0 12px 40px #7c3aed55;color:white;font-size:20px;animation:pulse 3s infinite}.brand b{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.5px}.brand small{display:block;color:var(--dim);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:3px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:6px;overflow:auto}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:13px 16px;border-radius:16px;text-align:left;display:flex;align-items:center;gap:13px;transition:.3s;font-weight:500;position:relative;overflow:hidden}.nav button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);border-radius:0 4px 4px 0;transform:scaleY(0);transition:.3s}.nav button:hover{background:rgba(255,255,255,.06);color:var(--text);transform:translateX(4px)}.nav button:hover::before{transform:scaleY(.6)}.nav button.active{background:var(--grad);color:#fff;box-shadow:0 12px 40px #7c3aed33;transform:translateX(0)}.nav button.active::before{transform:scaleY(1)}.nav i{width:22px;text-align:center;font-size:15px}.section-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.8px;padding:24px 14px 10px;font-weight:700}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.mini-user{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.03);border-radius:16px;border:1px solid var(--line);transition:.3s}.mini-user:hover{border-color:#8b5cf655;transform:translateY(-2px)}.avatar{width:40px;height:40px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 24px #7c3aed33}.avatar.sm{width:32px;height:32px;border-radius:11px;font-size:12px}.mini-user div:nth-child(2){min-width:0;flex:1}.mini-user strong,.mini-user small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-user small{color:var(--dim);font-size:10px;margin-top:2px;font-weight:500}

.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1600px;margin:auto;width:100%}
.topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:28px}.title h1{font-size:32px;font-family:var(--font-display);font-weight:800;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.title p{color:var(--muted);font-size:13px;margin-top:6px;font-weight:500}.top-actions{display:flex;gap:10px;align-items:center}.search{position:relative;width:min(360px,36vw)}.search i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--dim);transition:.3s}.search:focus-within i{color:var(--p)}.search input{padding-left:44px}
.input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);outline:none;border-radius:16px;padding:13px 16px;transition:.3s;font-size:13px}.input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px #7c3aed18,0 0 20px #7c3aed10}.input::placeholder{color:var(--dim)}textarea.input{resize:vertical;min-height:120px}select.input option{background:#18122b;color:white}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:11px 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.3s;position:relative;overflow:hidden}.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transform:translateX(-100%);transition:.5s}.btn:hover{transform:translateY(-2px);border-color:#8b5cf666;box-shadow:0 8px 24px rgba(124,58,237,.15)}.btn:hover::after{transform:translateX(100%)}.btn:active{transform:translateY(0)}.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 12px 35px #7c3aed28}.btn.success{background:#10b98118;border-color:#10b98155;color:#34d399}.btn.warn{background:#f59e0b16;border-color:#f59e0b55;color:#fbbf24}.btn.danger{background:#f43f5e16;border-color:#f43f5e55;color:#fb7185}.btn.info{background:#3b82f618;border-color:#3b82f655;color:#60a5fa}.btn.icon{width:44px;height:44px;padding:0;border-radius:13px}.btn.sm{padding:8px 12px;font-size:11px;border-radius:11px}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.panel{background:var(--panel);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:.3s}.panel.pad{padding:24px}.panel:hover{box-shadow:0 28px 90px rgba(0,0,0,.42)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}.stat{padding:22px;position:relative;overflow:hidden;transition:.4s;border-radius:var(--r);background:var(--panel);backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:var(--shadow)}.stat:hover{transform:translateY(-6px) scale(1.02);border-color:#8b5cf655;box-shadow:0 30px 100px rgba(124,58,237,.15)}.stat .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:18px;transition:.3s}.stat:hover .ico{transform:scale(1.1) rotate(-5deg)}.stat .num{font-size:34px;font-weight:900;font-family:var(--font-display);letter-spacing:-1.5px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.stat .lab{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}.stat .delta{position:absolute;right:16px;top:16px;font-size:10px;color:#34d399;background:#10b98115;padding:6px 10px;border-radius:99px;font-weight:700;backdrop-filter:blur(10px)}

.grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:20px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h3{font-size:16px;font-weight:800;font-family:var(--font-display)}.head p{color:var(--muted);font-size:12px;margin-top:4px;font-weight:500}.muted{color:var(--muted)}.dim{color:var(--dim)}

.complaint{padding:18px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;transition:.3s;cursor:pointer;position:relative;overflow:hidden}.complaint:first-child{border-top:0}.complaint::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grad);opacity:.15;transition:.3s}.complaint:hover::before{width:4px}.complaint:hover{background:rgba(255,255,255,.04);transform:translateX(6px)}.cmain{min-width:0;flex:1}.cmain b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:11px;margin-top:6px;font-weight:500}.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;border:1px solid;backdrop-filter:blur(10px)}.up{color:#fbbf24;border-color:#f59e0b44;background:#f59e0b0d;display:flex;align-items:center;gap:4px}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}.filters .input{width:auto;min-width:160px;padding:10px 13px;font-size:12px;border-radius:12px}

.progress{height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;position:relative}.progress>i{display:block;height:100%;border-radius:inherit;background:var(--grad);transition:width 1s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}.progress>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite}

.chart{height:240px;display:flex;align-items:end;gap:12px;padding:18px 8px 6px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:end;transition:.3s}.bar:hover{transform:translateY(-4px)}.bar i{width:100%;max-width:40px;border-radius:10px 10px 4px 4px;background:var(--grad);min-height:4px;box-shadow:0 12px 30px #7c3aed22;transition:.6s cubic-bezier(.22,1,.36,1)}.bar span{font-size:10px;color:var(--dim);font-weight:600;text-align:center}

.donut{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;margin:auto;position:relative;transition:.6s}.donut::after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:var(--panel2)}.donut b{z-index:1;font-size:28px;font-family:var(--font-display);font-weight:800}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:500}.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}

.empty{padding:60px 20px;text-align:center;color:var(--muted)}.empty i{font-size:42px;color:var(--dim);margin-bottom:14px;display:block;animation:floatCard 3s ease-in-out infinite}

.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;overflow:auto;padding-bottom:10px}.col{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:20px;padding:14px;min-height:300px;transition:.3s}.col:hover{background:rgba(255,255,255,.05)}.colhead{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:14px;letter-spacing:.5px}.kcard{background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:10px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}.kcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0;transition:.3s}.kcard:hover{transform:translateY(-5px);border-color:#8b5cf655;box-shadow:0 16px 40px rgba(0,0,0,.2)}.kcard:hover::before{opacity:1}.kcard b{font-size:12px;line-height:1.4;display:block;font-weight:700}.kcard small{color:var(--dim);font-size:10px;display:block;margin-top:8px;font-weight:500}

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin:0 0 8px}.field.full{grid-column:1/-1}.toggle{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.toggle input{accent-color:#7c3aed;width:18px;height:18px}

.modal{position:fixed;inset:0;background:rgba(2,1,8,.85);backdrop-filter:blur(24px);z-index:100;display:grid;place-items:center;padding:20px;animation:up .3s ease}.modalbox{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:30px;box-shadow:0 40px 120px #000a;padding:28px;position:relative}.modalhead{display:flex;justify-content:space-between;gap:14px;margin-bottom:22px;align-items:start}.modalhead h2{font-size:24px;font-family:var(--font-display);font-weight:800}

.timeline{position:relative;margin:16px 0 22px;padding-left:24px}.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}.event{position:relative;padding:0 0 20px 18px}.event::before{content:"";position:absolute;left:0px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 5px #7c3aed15;transition:.3s}.event:hover::before{transform:scale(1.2);box-shadow:0 0 0 8px #7c3aed25}.event b{font-size:12px;text-transform:capitalize;font-weight:700}.event small{display:block;color:var(--dim);font-size:10px;margin-top:4px;font-weight:500}

.comment{padding:14px 0;border-top:1px solid var(--line);transition:.3s}.comment:hover{padding-left:8px}.comment b{font-size:11px;font-weight:700}.comment p{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}

.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);font-size:11px}.table th{color:var(--dim);text-transform:uppercase;font-size:9px;letter-spacing:1.2px;font-weight:800}.table tr{transition:.2s}.table tr:hover td{background:rgba(255,255,255,.03)}

.toastwrap{position:fixed;right:24px;bottom:24px;z-index:300;display:flex;flex-direction:column;gap:10px;width:min(400px,calc(100vw - 48px))}.toast{background:var(--panel2);backdrop-filter:blur(30px);border:1px solid var(--line);border-left:4px solid #7c3aed;border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:12px;animation:up .3s cubic-bezier(.22,1,.36,1);font-weight:500}.toast.success{border-left-color:#10b981}.toast.error{border-left-color:#f43f5e}.toast.warn{border-left-color:#f59e0b}

.notif{position:relative}.notifpanel{position:absolute;right:0;top:58px;width:380px;max-height:460px;overflow:auto;padding:10px;z-index:50;border-radius:20px}.notice{padding:14px;border-radius:14px;border-bottom:1px solid var(--line);transition:.2s;cursor:pointer}.notice:hover{background:rgba(255,255,255,.04);transform:translateX(4px)}.notice.unread{background:#7c3aed0b;border-left:3px solid #7c3aed}.notice b{font-size:12px;font-weight:700}.notice p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.notice small{color:var(--dim);font-size:9px;font-weight:600}

.login{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}.loginbox{width:min(600px,100%);padding:42px;background:var(--panel);backdrop-filter:blur(50px);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:pop .6s cubic-bezier(.22,1,.36,1)}.loginbox::before{content:"";position:absolute;inset:-2px;background:linear-gradient(120deg,transparent,#8b5cf633,transparent);transform:translateX(-100%);animation:shine 6s infinite;pointer-events:none;z-index:0}.loginbrand{text-align:center;position:relative;z-index:2}.loginbrand .mark{margin:auto;width:72px;height:72px;border-radius:24px;background:var(--grad);display:grid;place-items:center;font-size:30px;color:#fff;box-shadow:0 20px 60px #7c3aed44;animation:pulse 3s infinite}.loginbrand h1{font-size:42px;margin-top:18px;font-weight:900;font-family:var(--font-display);background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}.loginbrand p{font-size:14px;color:var(--muted);margin-top:8px;font-weight:500}
.roles{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0}.role{padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.04);transition:.3s;cursor:pointer;text-align:left;position:relative;overflow:hidden}.role::after{content:"";position:absolute;inset:0;border-radius:20px;border:2px solid transparent;transition:.3s}.role:hover{transform:translateY(-4px);background:rgba(255,255,255,.07);box-shadow:0 16px 40px rgba(0,0,0,.2)}.role.selected::after{border-color:#f59e0b;box-shadow:0 0 30px #f59e0b15 inset}.role i{font-size:24px;margin-bottom:10px;display:block}.role b{display:block;font-size:13px;margin-bottom:4px}.role small{color:var(--dim);font-size:10px;font-weight:500}
@keyframes shine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}

.mobile-nav{display:none}

.rating-stars{display:flex;gap:6px}.rating-stars button{background:transparent;border:none;padding:6px;cursor:pointer;transition:.2s;font-size:20px;color:var(--dim)}.rating-stars button:hover{transform:scale(1.2)}.rating-stars button.active{color:#fbbf24;filter:drop-shadow(0 0 8px #f59e0b55)}

.proof-upload{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;transition:.3s;cursor:pointer;background:rgba(255,255,255,.02)}.proof-upload:hover{border-color:#8b5cf666;background:rgba(124,58,237,.05);transform:translateY(-2px)}.proof-upload i{font-size:28px;color:var(--dim);margin-bottom:10px;display:block}.proof-upload p{font-size:12px;color:var(--muted);font-weight:500}

.status-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;border:1px solid;backdrop-filter:blur(10px)}.status-badge::before{content:"";width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
