<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#6C3CE1">
  <title>ResolveHub · Luxury Resolution</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6C3CE1;
      --primary-light: #8B5CF6;
      --primary-dark: #5B2CC1;
      --secondary: #EC4899;
      --gold: #F59E0B;
      --accent: #06D6A0;
      --rose: #F43F5E;
      --gradient-primary: linear-gradient(135deg, #6C3CE1 0%, #EC4899 100%);
      --gradient-gold: linear-gradient(135deg, #F59E0B 0%, #FCD34D 100%);
      --bg-primary: #0F0C29;
      --bg-secondary: #1A1640;
      --bg-card: rgba(26, 22, 64, 0.6);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,0.7);
      --text-tertiary: rgba(255,255,255,0.4);
      --border: rgba(255,255,255,0.08);
      --shadow-glow: 0 0 40px rgba(108,60,225,0.3);
      --radius-lg: 24px;
      --radius-full: 9999px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .animate-fade-scale { animation: fadeInScale 0.6s ease forwards; }
    .animate-slide-up { animation: slideUp 0.6s ease forwards; }
    .animate-float { animation: float 6s ease-in-out infinite; }

    /* ===== GLASS ===== */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      color: white;
    }

    .btn-primary {
      background: var(--gradient-primary);
      box-shadow: var(--shadow-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 60px rgba(108,60,225,0.4);
    }

    .btn-gold {
      background: var(--gradient-gold);
      color: #1A1640;
    }

    .btn-gold:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.1);
    }

    .btn-sm {
      padding: 8px 18px;
      font-size: 12px;
    }

    /* ===== INPUTS ===== */
    .input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      outline: none;
    }

    .input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245,158,11,0.1);
    }

    .input::placeholder {
      color: var(--text-tertiary);
    }

    /* ===== BADGE ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== LOGIN ===== */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      background: var(--bg-primary);
    }

    .login-bg-effects {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .login-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.3;
      animation: float 8s ease-in-out infinite;
    }

    .login-orb-1 {
      width: 500px;
      height: 500px;
      background: var(--primary);
      top: -200px;
      right: -100px;
    }

    .login-orb-2 {
      width: 400px;
      height: 400px;
      background: var(--secondary);
      bottom: -150px;
      left: -100px;
      animation-delay: 3s;
    }

    .login-box {
      max-width: 520px;
      width: 100%;
      padding: 48px 40px;
      background: var(--bg-card);
      backdrop-filter: blur(60px);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: 0 20px 64px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-brand h1 {
      font-size: 40px;
      font-weight: 900;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-brand p {
      color: var(--text-secondary);
      font-size: 15px;
      margin-top: 4px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .role-card {
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid var(--border);
      background: rgba(255,255,255,0.03);
    }

    .role-card:hover {
      transform: translateY(-4px);
      border-color: rgba(108,60,225,0.3);
    }

    .role-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 40px rgba(245,158,11,0.15);
    }

    .role-card .role-icon {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
    }

    .role-card .role-name {
      font-weight: 700;
      font-size: 14px;
    }

    .role-card .role-email {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      background: var(--bg-card);
      backdrop-filter: blur(40px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-brand {
      font-size: 26px;
      font-weight: 900;
      padding: 0 12px;
      margin-bottom: 4px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-subtitle {
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 0 12px;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      text-align: left;
      margin-bottom: 4px;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-glow);
    }

    .nav-item .nav-icon {
      width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      background: var(--gradient-primary);
      flex-shrink: 0;
    }

    .avatar-sm {
      width: 32px;
      height: 32px;
      font-size: 13px;
    }

    /* ===== MAIN ===== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .main-area {
      flex: 1;
      padding: 28px 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
      min-width: 180px;
    }

    .search-wrap i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
    }

    .search-wrap input {
      padding-left: 44px;
      border-radius: var(--radius-full);
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 20px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(108,60,225,0.3);
      box-shadow: var(--shadow-glow);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--gradient-primary);
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ===== COMPLAINT ROW ===== */
    .complaint-row {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .complaint-row:last-child { border-bottom: none; }

    .complaint-row:hover {
      background: rgba(255,255,255,0.03);
      transform: translateX(4px);
    }

    .complaint-info { flex: 1; min-width: 0; }
    .complaint-subject { font-weight: 700; font-size: 15px; }
    .complaint-meta {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .complaint-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .upvote-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .upvote-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .upvote-btn.upvoted {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(245,158,11,0.1);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      background: var(--bg-card);
      backdrop-filter: blur(60px);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: 0 20px 64px rgba(0,0,0,0.4);
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      width: 100%;
    }

    .toast {
      padding: 14px 20px;
      border-radius: 16px;
      backdrop-filter: blur(20px);
      font-weight: 600;
      font-size: 14px;
      border-left: 4px solid;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .toast-success { border-color: var(--accent); }
    .toast-success i { color: var(--accent); }
    .toast-error { border-color: var(--rose); }
    .toast-error i { color: var(--rose); }
    .toast-info { border-color: var(--primary); }
    .toast-info i { color: var(--primary); }

    /* ===== EMPTY ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 48px;
      opacity: 0.2;
      margin-bottom: 16px;
      display: block;
    }

    /* ===== HEATMAP ===== */
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .heatmap-grid { grid-template-columns: repeat(6, 1fr); }
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.05);
      background: var(--bg-card);
    }

    .heat-cell:hover {
      transform: scale(1.08);
      box-shadow: var(--shadow-glow);
    }

    .heat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .heat-value {
      font-size: 24px;
      font-weight: 800;
    }

    /* ===== KANBAN ===== */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .kanban-column {
      padding: 16px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .kanban-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .kanban-count {
      padding: 2px 12px;
      border-radius: var(--radius-full);
      font-size: 11px;
      background: rgba(255,255,255,0.05);
    }

    .kanban-card {
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .kanban-card:hover {
      transform: translateY(-2px);
      border-color: rgba(108,60,225,0.3);
      box-shadow: var(--shadow-glow);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        flex-direction: row;
        align-items: center;
        overflow-x: auto;
      }

      .sidebar-brand { font-size: 20px; margin-right: 16px; flex-shrink: 0; }
      .sidebar-subtitle { display: none; }

      .sidebar-nav {
        display: flex;
        flex-direction: row;
        gap: 4px;
        margin: 0;
        overflow-x: auto;
        flex: 1;
      }

      .nav-item {
        width: auto;
        padding: 8px 14px;
        margin-bottom: 0;
        white-space: nowrap;
        font-size: 13px;
      }

      .nav-item span { display: none; }
      .nav-item .nav-icon { font-size: 18px; }
      .sidebar-footer { display: none; }

      .main-area { padding: 16px; }
      .page-title { font-size: 22px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-icon { width: 40px; height: 40px; font-size: 16px; }
      .stat-value { font-size: 22px; }
      .modal-box { padding: 20px; margin: 10px; }
      .role-selector { grid-template-columns: repeat(2, 1fr); }
      .login-box { padding: 32px 24px; }
      .topbar { flex-direction: column; align-items: stretch; }
      .search-wrap { max-width: 100%; }
      .complaint-row { flex-direction: column; align-items: stretch; gap: 10px; }
      .complaint-actions { flex-wrap: wrap; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .role-selector { grid-template-columns: 1fr; }
      .heatmap-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ===== CONFETTI ===== */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 99999;
      animation: confettiFall 3s linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Load React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    // Wait for React to load
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      document.getElementById('root').innerHTML = `
        <div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:'Inter',sans-serif;padding:20px;text-align:center;background:#0F0C29;color:white;">
          <div style="font-size:48px;">✨</div>
          <h2>ResolveHub</h2>
          <p style="color:rgba(255,255,255,0.6);">Loading luxury experience...</p>
          <button onclick="location.reload()" style="padding:12px 32px;background:linear-gradient(135deg,#6C3CE1,#EC4899);color:white;border:none;border-radius:30px;font-weight:600;cursor:pointer;font-size:14px;">Retry</button>
        </div>
      `;
    } else {
      // React is loaded, now render the app
      const { useState, useEffect, useCallback, useContext, useRef, createContext } = React;

      // ===== CONSTANTS =====
      const STORAGE_KEY = 'resolvehub_v3';
      const SESSION_KEY = 'resolvehub_session';

      function generateId() { return 'CMP-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random() * 100000)).padStart(5, '0'); }
      function timeAgo(ts) { const s = Math.floor((Date.now() - ts) / 1000); if (s < 60) return 'Just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
      function formatDate(ts) { if (!ts) return ''; return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
      function getGreeting() { const h = new Date().getHours(); if (h < 12) return 'Good morning'; if (h < 17) return 'Good afternoon'; return 'Good evening'; }

      const STATUS_COLORS = {
        submitted: '#6C3CE1',
        'under review': '#F59E0B',
        assigned: '#3B82F6',
        'in progress': '#8B5CF6',
        resolved: '#06D6A0',
        closed: '#64748B'
      };

      const PRIORITY_COLORS = {
        low: '#94A3B8',
        medium: '#F59E0B',

            <div style="font-size:48px;">⚠️</div>
            <h2>Something went wrong</h2>
            <p style="color:rgba(255,255,255,0.6);max-width:400px;">${error.message || 'Please try refreshing the page'}</p>
            <button onclick="location.reload()" style="padding:12px 32px;background:linear-gradient(135deg,#6C3CE1,#EC4899);color:white;border:none;border-radius:30px;font-weight:600;cursor:pointer;">Refresh</button>
          </div>
        `;
      }
    }
  </script>
