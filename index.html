<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Complaint System — Classic Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--navy:#1a2332;
--gold:#c9a84c;
--gold-light:#e8d5a3;
--cream:#f5efe6;
--burgundy:#6b2e3e;
--charcoal:#2c2c2c;
--ivory:#faf8f5;
--sage:#8a9a8a;
--rose:#d4a0a0;
--panel:rgba(255,252,248,.92);
--panel-dark:rgba(26,35,50,.95);
--text:#1a2332;
--muted:#6b6b6b;
--dim:#9a9a9a;
--line:rgba(26,35,50,.12);
--shadow:0 8px 40px rgba(26,35,50,.15);
--r:12px;
--font-serif:'Playfair Display',serif;
--font-sans:'Inter',sans-serif;
}
[data-theme="dark"]{
--panel:rgba(26,35,50,.94);
--panel-dark:rgba(26,35,50,.98);
--text:#f5efe6;
--muted:#b8b0a0;
--dim:#8a8278;
--line:rgba(245,239,230,.12);
--shadow:0 8px 40px rgba(0,0,0,.3);
}
html,body{min-height:100%;width:100%}
body{
font-family:var(--font-sans);
background:var(--cream);
color:var(--text);
overflow-x:hidden;
background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
button,input,textarea,select{font:inherit;font-family:var(--font-sans)}
button{cursor:pointer;transition:all .3s ease}
::selection{background:var(--gold);color:var(--navy)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--cream)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.app{display:flex;min-height:100vh}
/* SIDEBAR - Classic */
.sidebar{
width:280px;
position:sticky;
top:0;
height:100vh;
padding:28px 20px;
background:var(--panel-dark);
backdrop-filter:blur(20px);
border-right:2px solid var(--gold);
display:flex;
flex-direction:column;
z-index:20;
overflow-y:auto;
}
.sidebar .brand{
display:flex;
align-items:center;
gap:14px;
padding-bottom:28px;
border-bottom:2px solid rgba(201,168,76,.2);
margin-bottom:20px;
}
.sidebar .brand .crest{
width:52px;
height:52px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
color:var(--navy);
font-size:24px;
border:2px solid var(--gold-light);
box-shadow:0 4px 20px rgba(201,168,76,.3);
}
.sidebar .brand h1{
font-family:var(--font-serif);
font-size:22px;
font-weight:900;
color:var(--gold);
letter-spacing:-.5px;
}
.sidebar .brand span{
display:block;
font-size:10px;
color:var(--dim);
letter-spacing:2px;
text-transform:uppercase;
font-weight:300;
}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{
border:1px solid transparent;
background:transparent;
color:var(--muted);
padding:12px 16px;
border-radius:var(--r);
text-align:left;
display:flex;
align-items:center;
gap:14px;
font-size:14px;
font-weight:500;
transition:.3s;
position:relative;
}
.nav button:hover{
background:rgba(201,168,76,.08);
color:var(--text);
transform:translateX(4px);
}
.nav button.active{
background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));
color:var(--gold);
border-color:rgba(201,168,76,.3);
}
.nav button.active::before{
content:'';
position:absolute;
left:0;
top:20%;
height:60%;
width:3px;
background:var(--gold);
border-radius:0 3px 3px 0;
}
.nav i{width:22px;text-align:center;font-size:16px}
.section-label{
font-size:9px;
color:var(--dim);
text-transform:uppercase;
letter-spacing:2px;
padding:20px 14px 8px;
font-weight:600;
}
.sidebar-bottom{
margin-top:auto;
border-top:2px solid rgba(201,168,76,.15);
padding-top:16px;
}
.user-card{
display:flex;
align-items:center;
gap:12px;
padding:10px 6px;
border-radius:var(--r);
background:rgba(201,168,76,.06);
}
.user-card .avatar{
width:40px;
height:40px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
font-weight:700;
color:var(--navy);
font-size:16px;
border:2px solid var(--gold-light);
flex:none;
}
.user-card .info{flex:1;min-width:0}
.user-card .info strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-card .info small{color:var(--dim);font-size:10px;text-transform:capitalize}
.user-card .logout-btn{
width:34px;height:34px;
border-radius:50%;
border:1px solid rgba(201,168,76,.2);
background:transparent;
color:var(--muted);
display:grid;
place-items:center;
transition:.3s;
}
.user-card .logout-btn:hover{background:rgba(201,168,76,.15);color:var(--gold);transform:rotate(90deg)}
/* MAIN */
.main{flex:1;min-width:0;padding:30px 36px 50px;max-width:1600px;margin:auto;width:100%}
/* Topbar Classic */
.topbar{
display:flex;
gap:16px;
align-items:center;
justify-content:space-between;
margin-bottom:28px;
padding-bottom:16px;
border-bottom:2px solid var(--line);
}
.topbar .title h1{
font-family:var(--font-serif);
font-size:30px;
font-weight:900;
letter-spacing:-.5px;
color:var(--text);
}
.topbar .title p{
color:var(--muted);
font-size:13px;
margin-top:4px;
font-weight:400;
}
.topbar .title p i{color:var(--gold);margin-right:6px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{
position:relative;
width:min(320px,40vw);
}
.search i{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
color:var(--dim);
font-size:14px;
}
.search input{
padding-left:42px;
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--r);
padding:11px 14px 11px 42px;
font-size:13px;
color:var(--text);
outline:none;
width:100%;
transition:.3s;
font-family:var(--font-sans);
}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
.search input::placeholder{color:var(--dim)}
/* Buttons Classic */
.btn{
border:1px solid var(--line);
background:var(--panel);
color:var(--text);
padding:10px 18px;
border-radius:var(--r);
font-weight:600;
display:inline-flex;
align-items:center;
gap:8px;
transition:.3s;
font-size:13px;
font-family:var(--font-sans);
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary{
background:linear-gradient(135deg,var(--gold),#b8953a);
border-color:var(--gold);
color:var(--navy);
box-shadow:0 4px 20px rgba(201,168,76,.25);
}
.btn.primary:hover{box-shadow:0 6px 30px rgba(201,168,76,.35);transform:translateY(-2px)}
.btn.success{
background:rgba(138,154,138,.15);
border-color:var(--sage);
color:var(--sage);
}
.btn.danger{
background:rgba(107,46,62,.15);
border-color:var(--burgundy);
color:var(--burgundy);
}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center}
.btn.sm{padding:6px 12px;font-size:11px;border-radius:8px}
.btn.outline{
background:transparent;
border-color:var(--gold);
color:var(--gold);
}
.btn.outline:hover{background:var(--gold);color:var(--navy)}
/* Panels */
.panel{
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--r);
box-shadow:var(--shadow);
backdrop-filter:blur(10px);
}
.panel.pad{padding:22px}
.panel .head{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:16px;
}
.panel .head h3{
font-family:var(--font-serif);
font-size:18px;
font-weight:700;
}
.panel .head p{
color:var(--muted);
font-size:12px;
margin-top:3px;
}
/* Stats Cards */
.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-bottom:20px;
}
.stat-card{
padding:20px 22px;
position:relative;
overflow:hidden;
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--r);
box-shadow:var(--shadow);
transition:.3s;
}
.stat-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.stat-card .icon{
width:44px;
height:44px;
border-radius:50%;
display:grid;
place-items:center;
margin-bottom:14px;
font-size:18px;
border:1px solid;
}
.stat-card .number{font-size:30px;font-weight:900;font-family:var(--font-serif);letter-spacing:-1px}
.stat-card .label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}
.stat-card .badge{
position:absolute;right:16px;top:16px;
font-size:9px;
padding:4px 10px;
border-radius:20px;
font-weight:600;
background:rgba(201,168,76,.12);
color:var(--gold);
}
/* Grid */
.grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
/* Complaint Row */
.complaint-row{
padding:14px 18px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
gap:14px;
cursor:pointer;
transition:.3s;
}
.complaint-row:last-child{border-bottom:0}
.complaint-row:hover{background:rgba(201,168,76,.05);transform:translateX(4px)}
.complaint-row .avatar-sm{
width:36px;height:36px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
font-weight:700;
color:var(--navy);
font-size:13px;
flex:none;
}
.complaint-row .content{flex:1;min-width:0}
.complaint-row .content b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.complaint-row .content .meta{
display:flex;gap:8px;flex-wrap:wrap;
color:var(--dim);font-size:10px;margin-top:4px;
}
.complaint-row .badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{
padding:4px 10px;
border-radius:20px;
font-size:9px;
font-weight:700;
text-transform:uppercase;
letter-spacing:.5px;
border:1px solid;
}
.badge-gold{color:var(--gold);border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.08)}
.badge-navy{color:var(--navy);border-color:rgba(26,35,50,.2);background:rgba(26,35,50,.06)}
.badge-sage{color:var(--sage);border-color:rgba(138,154,138,.3);background:rgba(138,154,138,.08)}
.badge-rose{color:var(--rose);border-color:rgba(212,160,160,.3);background:rgba(212,160,160,.08)}
.badge-burgundy{color:var(--burgundy);border-color:rgba(107,46,62,.3);background:rgba(107,46,62,.08)}
/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters input{
padding:9px 14px;
border:1px solid var(--line);
border-radius:var(--r);
background:var(--panel);
color:var(--text);
outline:none;
font-size:12px;
font-family:var(--font-sans);
min-width:140px;
transition:.3s;
}
.filters select:focus,.filters input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.filters select option{background:var(--panel-dark);color:var(--text)}
/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{
font-size:11px;
font-weight:600;
color:var(--muted);
text-transform:uppercase;
letter-spacing:.7px;
}
.field .input{
padding:11px 14px;
border:1px solid var(--line);
border-radius:var(--r);
background:var(--panel);
color:var(--text);
outline:none;
font-size:13px;
font-family:var(--font-sans);
transition:.3s;
width:100%;
}
.field .input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.field .input::placeholder{color:var(--dim)}
.field textarea.input{resize:vertical;min-height:100px}
/* Modal */
.modal{
position:fixed;inset:0;
background:rgba(26,35,50,.7);
backdrop-filter:blur(8px);
z-index:100;
display:grid;
place-items:center;
padding:20px;
}
.modal-box{
width:min(820px,100%);
max-height:90vh;
overflow:auto;
background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
box-shadow:var(--shadow);
padding:28px;
}
.modal-box .modal-head{
display:flex;
justify-content:space-between;
gap:12px;
margin-bottom:20px;
padding-bottom:14px;
border-bottom:2px solid var(--line);
}
.modal-box .modal-head h2{
font-family:var(--font-serif);
font-size:22px;
font-weight:700;
}
/* Timeline */
.timeline{position:relative;padding-left:24px;margin:12px 0 18px}
.timeline::before{
content:'';
position:absolute;left:6px;top:4px;bottom:4px;
width:2px;
background:var(--gold);
opacity:.3;
}
.timeline .event{
position:relative;
padding:0 0 18px 16px;
}
.timeline .event::before{
content:'';
position:absolute;left:-4px;top:4px;
width:12px;height:12px;
border-radius:50%;
background:var(--gold);
border:2px solid var(--panel);
box-shadow:0 0 0 3px rgba(201,168,76,.2);
}
.timeline .event b{font-size:12px;text-transform:capitalize;color:var(--gold)}
.timeline .event p{font-size:11px;color:var(--muted);margin-top:3px}
.timeline .event small{color:var(--dim);font-size:9px;display:block;margin-top:2px}
/* Comments */
.comment{padding:10px 0;border-top:1px solid var(--line)}
.comment .author{font-weight:600;font-size:12px}
.comment .author small{color:var(--dim);font-weight:400;font-size:10px;margin-left:8px}
.comment p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
/* Login */
.login-page{
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
background:var(--cream);
background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.login-box{
width:min(540px,100%);
padding:40px 44px;
background:var(--panel);
border:2px solid var(--gold);
border-radius:16px;
box-shadow:var(--shadow);
position:relative;
}
.login-box::before{
content:'';
position:absolute;inset:-3px;
background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold));
border-radius:18px;
z-index:-1;
opacity:.3;
}
.login-box .crest{
width:72px;height:72px;
margin:0 auto 16px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
font-size:32px;
color:var(--navy);
border:3px solid var(--gold-light);
}
.login-box h1{
font-family:var(--font-serif);
font-size:34px;
font-weight:900;
text-align:center;
color:var(--text);
}
.login-box .subtitle{
text-align:center;
color:var(--muted);
font-size:13px;
margin-top:4px;
}
.login-box .subtitle i{color:var(--gold);margin-right:4px}
.role-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:24px 0;
}
.role-card{
padding:16px;
border:2px solid var(--line);
border-radius:var(--r);
background:transparent;
text-align:center;
transition:.3s;
cursor:pointer;
}
.role-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.role-card.selected{border-color:var(--gold);background:rgba(201,168,76,.08)}
.role-card i{font-size:28px;margin-bottom:8px;display:block}
.role-card b{display:block;font-size:14px}
.role-card small{color:var(--dim);font-size:10px}
/* Mobile */
.mobile-nav{display:none}
@media(max-width:1150px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:800px){
.sidebar{display:none}
.main{padding:16px 14px 80px}
.topbar{flex-direction:column;align-items:stretch}
.top-actions{flex-wrap:wrap}
.search{width:100%}
.stats{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:1fr}
.form-grid{grid-template-columns:1fr}
.field.full{grid-column:auto}
.role-grid{grid-template-columns:1fr}
.login-box{padding:24px 20px}
.mobile-nav{
display:flex;
position:fixed;bottom:12px;left:12px;right:12px;
z-index:40;
background:var(--panel-dark);
backdrop-filter:blur(20px);
border:1px solid var(--gold);
border-radius:14px;
padding:6px;
gap:2px;
}
.mobile-nav button{
flex:1;
background:transparent;
border:0;
color:var(--muted);
padding:8px 4px;
border-radius:10px;
font-size:9px;
font-weight:500;
}
.mobile-nav button.active{background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));color:var(--gold)}
.mobile-nav i{display:block;font-size:16px;margin-bottom:2px}
}
.toast-wrap{
position:fixed;right:20px;bottom:20px;z-index:300;
display:flex;flex-direction:column;gap:8px;
width:min(380px,calc(100vw - 40px));
}
.toast{
background:var(--panel);
border:1px solid var(--line);
border-left:4px solid var(--gold);
border-radius:var(--r);
padding:12px 16px;
box-shadow:var(--shadow);
display:flex;
gap:10px;
align-items:center;
font-size:12px;
animation:up .3s ease;
}
.toast.success{border-left-color:var(--sage)}
.toast.error{border-left-color:var(--burgundy)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
(()=>{
'use strict';
const {useState,useEffect,useMemo,useRef,useCallback}=React;

// Firebase Config - Replace with yours
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

let firebaseApp, firestore, auth;
try {
  firebaseApp = firebase.initializeApp(firebaseConfig);
  firestore = firebase.firestore(firebaseApp);
  auth = firebase.auth(firebaseApp);
} catch(e){ console.warn("Firebase not configured:",e); }

// Constants
const STATUSES = ['submitted','reviewing','assigned','in_progress','resolved','closed','rejected'];
const CATEGORIES = ['Academic','Infrastructure','IT/Technical','Administrative','Hostel','Cafeteria','Library','Transport','Security','Cleanliness','Electricity','Water','Harassment/Misconduct','Other'];
const DEPARTMENTS = ['Facilities','IT','Examination','Library','Transport','Administration','Academics','Security','Housekeeping','General'];
const ZONES = ['Academic Lab','Academic Class','Hostel','Library','Cafeteria','Admin Block','Transport'];
const PRIORITY_MAP = {
  'Academic':'medium','Infrastructure':'high','IT/Technical':'high','Administrative':'medium',
  'Hostel':'medium','Cafeteria':'low','Library':'low','Transport':'medium',
  'Security':'critical','Cleanliness':'low','Electricity':'critical','Water':'high',
  'Harassment/Misconduct':'critical','Other':'medium'
};

// Roles
const ROLES = [
  {id:'admin',name:'Administrator',icon:'fa-user-shield',color:'#c9a84c'},
  {id:'student',name:'Student',icon:'fa-user-graduate',color:'#8a9a8a'},
  {id:'teacher',name:'Teacher',icon:'fa-chalkboard-user',color:'#d4a0a0'},
  {id:'staff',name:'Staff (IT)',icon:'fa-user-tie',color:'#6b2e3e'}
];

function generateId(){ return 'CMP-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase(); }

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('dashboard');
  const [query,setQuery]=useState('');
  const [selected,setSelected]=useState(null);
  const [toasts,setToasts]=useState([]);
  const [theme,setTheme]=useState(localStorage.getItem('theme')||'light');
  const [loading,setLoading]=useState(false);
  const [complaints,setComplaints]=useState([]);
  const [users,setUsers]=useState([]);
  const [notifications,setNotifications]=useState([]);

  useEffect(()=>{
    document.documentElement.dataset.theme=theme;
    localStorage.setItem('theme',theme);
  },[theme]);

  // Load from localStorage if Firebase not available
  useEffect(()=>{
    const saved=localStorage.getItem('complaint_data');
    if(saved){
      try{
        const d=JSON.parse(saved);
        setComplaints(d.complaints||[]);
        setUsers(d.users||[]);
        setNotifications(d.notifications||[]);
      }catch(e){}
    }
    // Try Firebase
    if(firestore){
      firestore.collection('complaints').onSnapshot(snap=>{
        const data=snap.docs.map(d=>({id:d.id,...d.data()}));
        setComplaints(data);
      });
      firestore.collection('users').onSnapshot(snap=>{
        setUsers(snap.docs.map(d=>({id:d.id,...d.data()})));
      });
    }
    const sess=localStorage.getItem('session');
    if(sess) setUser(JSON.parse(sess));
  },[]);

  useEffect(()=>{
    if(!firestore){
      localStorage.setItem('complaint_data',JSON.stringify({complaints,users,notifications}));
    }
  },[complaints,users,notifications]);

  const currentUser = useMemo(()=>{
    if(!user) return null;
    return users.find(u=>u.id===user.id)||user;
  },[user,users]);

  const isAdmin = currentUser?.role==='admin';
  const isStaff = currentUser?.role==='staff';
  const isTeacher = currentUser?.role==='teacher';
  const isStudent = currentUser?.role==='student';

  function addToast(msg,type='info'){
    const t={id:Date.now()+Math.random(),msg,type};
    setToasts(prev=>[...prev,t]);
    setTimeout(()=>setToasts(prev=>prev.filter(x=>x.id!==t.id)),4000);
  }

  function login(role){
    let u = users.find(x=>x.role===role);
    if(!u){
      const newUser = {
        id:'u'+Date.now(),
        name: role==='admin'?'Administrator':role==='student'?'Student User':role==='teacher'?'Teacher':`Staff (${role})`,
        email:`${role}@complaint.demo`,
        role:role,
        department: role==='staff'?'IT':role==='admin'?'Administration':role==='teacher'?'Academics':'General'
      };
      if(firestore){
        firestore.collection('users').add(newUser).then(ref=>{
          setUsers(prev=>[...prev,{...newUser,id:ref.id}]);
        });
      } else {
        setUsers(prev=>[...prev,newUser]);
      }
      u=newUser;
    }
    setUser(u);
    localStorage.setItem('session',JSON.stringify(u));
    addToast(`Welcome ${u.name} ✨`,'success');
    setView('dashboard');
  }

  function logout(){
    if(auth) auth.signOut();
    setUser(null);
    localStorage.removeItem('session');
    addToast('Logged out','info');
  }

  function saveComplaint(data){
    const newC = {
      ...data,
      id: generateId(),
      status:'submitted',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      timeline: [{status:'submitted',timestamp:Date.now(),note:'Complaint submitted'}],
      comments:[],
      resolution:'',
      rating:0,
      feedback:'',
      approved:false,
      resolvedBy:null,
      departmentApproved:false,
      reviewedBy:null
    };
    if(firestore){
      firestore.collection('complaints').add(newC).then(ref=>{
        setComplaints(prev=>[...prev,{...newC,id:ref.id}]);
      });
    } else {
      setComplaints(prev=>[newC,...prev]);
    }
    addToast(`Complaint ${newC.id} submitted`,'success');
    setView('complaints');
  }

  function updateComplaint(id,changes,note){
    const updated = complaints.map(c=>{
      if(c.id!==id) return c;
      const newC={...c,...changes,updatedAt:Date.now()};
      if(note){
        newC.timeline=[...c.timeline,{status:changes.status||c.status,timestamp:Date.now(),note}];
      }
      return newC;
    });
    setComplaints(updated);
    if(firestore){
      firestore.collection('complaints').doc(id).update(changes);
    }
  }

  function addComment(cid,msg){
    const c={id:'cmt'+Date.now(),userId:currentUser?.id||'anon',name:currentUser?.name||'Anonymous',role:currentUser?.role||'user',message:msg,timestamp:Date.now()};
    updateComplaint(cid,{comments:[...complaints.find(x=>x.id===cid)?.comments||[],c]},'Comment added');
  }

  function rateComplaint(cid,rating,feedback){
    updateComplaint(cid,{rating,feedback,status:'closed'},`Rated ${rating}/5 - ${feedback}`);
    addToast('Feedback submitted!','success');
  }

  function approveComplaint(cid){
    updateComplaint(cid,{approved:true,status:'closed'},'Approved by Admin');
    addToast('Complaint approved and closed','success');
  }

  function resolveComplaint(cid,resolution){
    updateComplaint(cid,{status:'resolved',resolution,resolvedBy:currentUser?.id,departmentApproved:true},'Resolved by department');
    addToast('Complaint resolved, pending admin approval','success');
  }

  // Filter complaints based on role
  const visibleComplaints = useMemo(()=>{
    let list = complaints;
    if(query){
      const q=query.toLowerCase();
      list = list.filter(c=> 
        (c.id||'').toLowerCase().includes(q) ||
        (c.title||'').toLowerCase().includes(q) ||
        (c.category||'').toLowerCase().includes(q) ||
        (c.department||'').toLowerCase().includes(q)
      );
    }
    // Role-based filtering
    if(isAdmin) return list;
    if(isStaff){
      // Staff sees complaints assigned to their department or IT
      return list.filter(c=>c.department===currentUser?.department || c.assignedTo===currentUser?.id);
    }
    if(isTeacher){
      // Teacher sees complaints from their department
      return list.filter(c=>c.department===currentUser?.department);
    }
    if(isStudent){
      return list.filter(c=>c.submittedBy===currentUser?.id);
    }
    return list;
  },[complaints,query,currentUser,isAdmin,isStaff,isTeacher,isStudent]);

  const stats = useMemo(()=>{
    const total=visibleComplaints.length;
    const pending=visibleComplaints.filter(c=>!['resolved','closed','rejected'].includes(c.status)).length;
    const resolved=visibleComplaints.filter(c=>c.status==='resolved' || c.status==='closed').length;
    const approved=visibleComplaints.filter(c=>c.approved).length;
    const critical=visibleComplaints.filter(c=>c.priority==='critical').length;
    return {total,pending,resolved,approved,critical};
  },[visibleComplaints]);

  if(!currentUser){
    return <LoginPage onLogin={login} theme={theme} setTheme={setTheme} />;
  }

  return (
    <>
      <div className="app">
        <Sidebar view={view} setView={setView} user={currentUser} logout={logout} isAdmin={isAdmin} />
        <main className="main">
          <Topbar 
            view={view} setView={setView}
            query={query} setQuery={setQuery}
            theme={theme} setTheme={setTheme}
            user={currentUser}
            complaints={visibleComplaints}
          />
          {view==='dashboard' && <Dashboard stats={stats} complaints={visibleComplaints} setSelected={setSelected} setView={setView} user={currentUser} />}
          {view==='complaints' && <ComplaintsList complaints={visibleComplaints} setSelected={setSelected} setView={setView} user={currentUser} isAdmin={isAdmin} isStaff={isStaff} />}
          {view==='new' && <NewComplaint user={currentUser} onSubmit={saveComplaint} />}
          {view==='analytics' && isAdmin && <Analytics complaints={complaints} users={users} />}
          {view==='users' && isAdmin && <UserManagement users={users} setUsers={setUsers} />}
          {view==='audit' && isAdmin && <AuditLog complaints={complaints} users={users} />}
          {view==='settings' && <Settings theme={theme} setTheme={setTheme} />}
        </main>
        <MobileNav view={view} setView={setView} />
      </div>
      {selected && <ComplaintDetail 
        complaint={selected}
        user={currentUser}
        isAdmin={isAdmin}
        isStaff={isStaff}
        onClose={()=>setSelected(null)}
        onUpdate={updateComplaint}
        onComment={addComment}
        onResolve={resolveComplaint}
        onApprove={approveComplaint}
        onRate={rateComplaint}
      />}
      <div className="toast-wrap">
        {toasts.map(t=>(
          <div key={t.id} className={`toast ${t.type}`}>
            <i className={`fas ${t.type==='success'?'fa-check-circle':t.type==='error'?'fa-exclamation-circle':'fa-info-circle'}`} />
            {t.msg}
          </div>
        ))}
      </div>
    </>
  );
}

function LoginPage({onLogin,theme,setTheme}){
  const [selected,setSelected]=useState(null);
  return (
    <div className="login-page">
      <div className="login-box pop">
        <button className="btn icon" onClick={()=>setTheme(theme==='dark'?'light':'dark')} style={{position:'absolute',top:16,right:16,zIndex:5,background:'transparent',border:'1px solid var(--line)'}}>
          <i className={`fas ${theme==='dark'?'fa-sun':'fa-moon'}`} />
        </button>
        <div className="crest"><i className="fas fa-scale-balanced" /></div>
        <h1>ResolveHub</h1>
        <p className="subtitle"><i className="fas fa-crown" /> Smart Complaint System · Classic Edition</p>
        <div className="role-grid">
          {ROLES.map(r=>(
            <button key={r.id} className={`role-card ${selected===r.id?'selected':''}`} onClick={()=>setSelected(r.id)}>
              <i className={`fas ${r.icon}`} style={{color:r.color}} />
              <b>{r.name}</b>
              <small>{r.id==='staff'?'IT Department':r.id==='admin'?'Full Access':r.id==='teacher'?'Faculty':r.id==='student'?'General User':''}</small>
            </button>
          ))}
        </div>
        <button className="btn primary" style={{width:'100%',padding:'14px',justifyContent:'center'}} onClick={()=>selected&&onLogin(selected)} disabled={!selected}>
          <i className="fas fa-arrow-right-to-bracket" /> Continue as {selected||'select a role'}
        </button>
        <p style={{textAlign:'center',marginTop:12,color:'var(--dim)',fontSize:10}}>Demo login · no password required</p>
      </div>
    </div>
  );
}

function Sidebar({view,setView,user,logout,isAdmin}){
  const items = [
    ['dashboard','fa-gauge-high','Dashboard'],
    ['complaints','fa-list-check','Complaints'],
    ['new','fa-plus-circle','New Issue'],
  ];
  if(isAdmin) items.push(['analytics','fa-chart-pie','Analytics'],['users','fa-users','Users'],['audit','fa-clock-rotate-left','Audit']);
  items.push(['settings','fa-sliders','Settings']);
  return (
    <aside className="sidebar">
      <div className="brand">
        <div className="crest"><i className="fas fa-scale-balanced" /></div>
        <div><h1>ResolveHub</h1><span>Smart Complaint System</span></div>
      </div>
      <nav className="nav">
        {items.map(([id,icon,label])=>(
          <button key={id} className={view===id?'active':''} onClick={()=>setView(id)}>
            <i className={`fas ${icon}`} /> {label}
          </button>
        ))}
      </nav>
      <div className="sidebar-bottom">
        <div className="user-card">
          <div className="avatar">{user?.name?.[0]||'U'}</div>
          <div className="info">
            <strong>{user?.name}</strong>
            <small>{user?.role} · {user?.department}</small>
          </div>
          <button className="logout-btn" onClick={logout}><i className="fas fa-sign-out-alt" /></button>
        </div>
      </div>
    </aside>
  );
}

function Topbar({view,setView,query,setQuery,theme,setTheme,user,complaints}){
  const titles = {
    dashboard:'Command Center',
    complaints:'Complaint Intelligence',
    new:'Report an Issue',
    analytics:'Analytics',
    users:'User Management',
    audit:'Audit Trail',
    settings:'Settings'
  };
  return (
    <div className="topbar">
      <div className="title">
        <h1>{titles[view]||'ResolveHub'}</h1>
        <p><i className="fas fa-clock" /> {new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</p>
      </div>
      <div className="top-actions">
        <div className="search">
          <i className="fas fa-search" />
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search complaints..." />
        </div>
        <button className="btn icon" onClick={()=>setTheme(theme==='dark'?'light':'dark')}>
          <i className={`fas ${theme==='dark'?'fa-sun':'fa-moon'}`} />
        </button>
        <button className="btn primary" onClick={()=>setView('new')}>
          <i className="fas fa-plus" /> New Complaint
        </button>
      </div>
    </div>
  );
}

function Dashboard({stats,complaints,setSelected,setView,user}){
  const recent = [...complaints].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  return (
    <div className="animate">
      <div className="stats">
        <div className="stat-card"><div className="icon" style={{color:'var(--gold)',borderColor:'rgba(201,168,76,.3)'}}><i className="fas fa-folder-open" /></div><div className="number">{stats.total}</div><div className="label">Total Cases</div></div>
        <div className="stat-card"><div className="icon" style={{color:'var(--burgundy)',borderColor:'rgba(107,46,62,.3)'}}><i className="fas fa-clock" /></div><div className="number">{stats.pending}</div><div className="label">Pending</div></div>
        <div className="stat-card"><div className="icon" style={{color:'var(--sage)',borderColor:'rgba(138,154,138,.3)'}}><i className="fas fa-check-circle" /></div><div className="number">{stats.resolved}</div><div className="label">Resolved</div></div>
        <div className="stat-card"><div className="icon" style={{color:'var(--gold)',borderColor:'rgba(201,168,76,.3)'}}><i className="fas fa-crown" /></div><div className="number">{stats.approved}</div><div className="label">Approved</div></div>
        <div className="stat-card"><div className="icon" style={{color:'var(--rose)',borderColor:'rgba(212,160,160,.3)'}}><i className="fas fa-triangle-exclamation" /></div><div className="number">{stats.critical}</div><div className="label">Critical</div></div>
      </div>
      <div className="panel pad">
        <div className="head"><div><h3>Recent Activity</h3><p>Latest complaints from your workspace</p></div><button className="btn sm outline" onClick={()=>setView('complaints')}>View All</button></div>
        {recent.length?recent.map(c=><ComplaintRow key={c.id} complaint={c} onClick={setSelected} />):<div style={{textAlign:'center',color:'var(--dim)',padding:30}}><i className="fas fa-inbox" style={{fontSize:24,display:'block',marginBottom:8}} />No complaints yet</div>}
      </div>
    </div>
  );
}

function ComplaintRow({complaint,onClick}){
  const statusColors = {submitted:'badge-navy',reviewing:'badge-gold',assigned:'badge-sage',in_progress:'badge-gold',resolved:'badge-sage',closed:'badge-navy',rejected:'badge-rose'};
  const priorityColors = {low:'badge-sage',medium:'badge-gold',high:'badge-rose',critical:'badge-burgundy'};
  return (
    <div className="complaint-row" onClick={()=>onClick(complaint)}>
      <div className="avatar-sm">{complaint.title?.[0]||'?'}</div>
      <div className="content">
        <b>{complaint.title||'Untitled'}</b>
        <div className="meta">
          <span>{complaint.id}</span>
          <span>·</span>
          <span>{complaint.category}</span>
          <span>·</span>
          <span>{new Date(complaint.createdAt).toLocaleDateString()}</span>
          <span>·</span>
          <span>{complaint.department}</span>
        </div>
      </div>
      <div className="badges">
        <span className={`badge ${priorityColors[complaint.priority]||'badge-navy'}`}>{complaint.priority||'medium'}</span>
        <span className={`badge ${statusColors[complaint.status]||'badge-navy'}`}>{complaint.status||'submitted'}</span>
        {complaint.approved && <span className="badge badge-gold"><i className="fas fa-check" /> Approved</span>}
      </div>
    </div>
  );
}

function ComplaintsList({complaints,setSelected,setView,user,isAdmin,isStaff}){
  const [filterStatus,setFilterStatus]=useState('all');
  const [filterPriority,setFilterPriority]=useState('all');
  const filtered = complaints.filter(c=>filterStatus==='all'||c.status===filterStatus).filter(c=>filterPriority==='all'||c.priority===filterPriority);
  return (
    <div className="animate">
      <div className="filters">
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="all">All Status</option>
          {STATUSES.map(s=><option key={s}>{s}</option>)}
        </select>
        <select value={filterPriority} onChange={e=>setFilterPriority(e.target.value)}>
          <option value="all">All Priority</option>
          <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="critical">Critical</option>
        </select>
        <span style={{fontSize:12,color:'var(--dim)',alignSelf:'center'}}>{filtered.length} complaints</span>
        {!isAdmin&&!isStaff&&<button className="btn sm" onClick={()=>setView('new')}><i className="fas fa-plus" /> New</button>}
      </div>
      <div className="panel">
        {filtered.length?filtered.map(c=><ComplaintRow key={c.id} complaint={c} onClick={setSelected} />):
          <div style={{textAlign:'center',color:'var(--dim)',padding:40}}><i className="fas fa-search" style={{fontSize:28,display:'block',marginBottom:10}} />No complaints match your filters</div>}
      </div>
    </div>
  );
}

function NewComplaint({user,onSubmit}){
  const [form,setForm]=useState({
    title:'',description:'',category:'Academic',priority:'medium',
    department:user?.department||'General',location:'',zone:'Academic Lab',
    submittedBy:user?.id
  });
  const [error,setError]=useState('');

  const handleCategoryChange = (cat)=>{
    const priority = PRIORITY_MAP[cat]||'medium';
    setForm({...form,category:cat,priority});
  };

  const handleSubmit=(e)=>{
    e.preventDefault();
    if(!form.title.trim()){
      setError('Title is required');
      return;
    }
    if(form.title.trim().length<5){
      setError('Title must be at least 5 characters');
      return;
    }
    if(!form.description.trim()){
      setError('Description is required');
      return;
    }
    setError('');
    onSubmit(form);
  };

  return (
    <div className="animate">
      <div className="panel pad" style={{maxWidth:900,margin:'auto'}}>
        <div className="head"><div><h3>Report a New Issue</h3><p>Fill in the details below</p></div></div>
        <form onSubmit={handleSubmit}>
          <div className="form-grid">
            <div className="field full">
              <label>Issue Title <span style={{color:'var(--burgundy)'}}>*</span></label>
              <input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Enter a clear, descriptive title..." />
              {error && <span style={{color:'var(--burgundy)',fontSize:11,marginTop:4}}><i className="fas fa-exclamation-circle" /> {error}</span>}
            </div>
            <div className="field full">
              <label>Description <span style={{color:'var(--burgundy)'}}>*</span></label>
              <textarea className="input" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Describe the issue in detail..." rows={4} />
            </div>
            <div className="field">
              <label>Category</label>
              <select className="input" value={form.category} onChange={e=>handleCategoryChange(e.target.value)}>
                {CATEGORIES.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Priority <span style={{color:'var(--dim)',fontWeight:400,textTransform:'none'}}>(auto-set)</span></label>
              <input className="input" value={form.priority} disabled style={{opacity:.7,background:'rgba(201,168,76,.06)'}} />
            </div>
            <div className="field">
              <label>Department <span style={{color:'var(--dim)',fontWeight:400,textTransform:'none'}}>(auto-filled)</span></label>
              <input className="input" value={form.department} disabled style={{opacity:.7,background:'rgba(201,168,76,.06)'}} />
            </div>
            <div className="field">
              <label>Campus Zone</label>
              <select className="input" value={form.zone} onChange={e=>setForm({...form,zone:e.target.value})}>
                {ZONES.map(z=><option key={z}>{z}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Location (optional)</label>
              <input className="input" value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="Building / room number" />
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:18,borderTop:'1px solid var(--line)',paddingTop:18}}>
            <button type="button" className="btn" onClick={()=>window.history.back()}>Cancel</button>
            <button type="submit" className="btn primary"><i className="fas fa-paper-plane" /> Submit Complaint</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ComplaintDetail({complaint,user,isAdmin,isStaff,onClose,onUpdate,onComment,onResolve,onApprove,onRate}){
  const [comment,setComment]=useState('');
  const [resolution,setResolution]=useState('');
  const [rating,setRating]=useState(0);
  const [feedback,setFeedback]=useState('');
  const [showResolve,setShowResolve]=useState(false);

  const isResolved = complaint.status==='resolved'||complaint.status==='closed';
  const canResolve = isStaff && !isResolved && complaint.status!=='rejected';
  const canApprove = isAdmin && complaint.status==='resolved' && !complaint.approved;
  const canRate = !isAdmin && complaint.status==='resolved' && complaint.approved && !complaint.rating;

  const addComment=()=>{
    if(!comment.trim()) return;
    onComment(complaint.id,comment);
    setComment('');
  };

  return (
    <div className="modal" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box pop">
        <div className="modal-head">
          <div>
            <div className="badges" style={{marginBottom:6}}>
              <span className={`badge badge-${complaint.priority==='critical'?'burgundy':complaint.priority==='high'?'rose':'sage'}`}>{complaint.priority}</span>
              <span className={`badge badge-${complaint.status==='resolved'?'sage':complaint.status==='closed'?'navy':'gold'}`}>{complaint.status}</span>
              {complaint.approved && <span className="badge badge-gold"><i className="fas fa-check" /> Approved</span>}
            </div>
            <h2>{complaint.title}</h2>
            <p style={{fontSize:12,color:'var(--muted)'}}>{complaint.id} · {complaint.category} · {complaint.department}</p>
          </div>
          <button className="btn icon" onClick={onClose}><i className="fas fa-times" /></button>
        </div>

        <p style={{color:'var(--text)',lineHeight:1.7,marginBottom:16,fontSize:14}}>{complaint.description}</p>

        <div className="grid3" style={{marginBottom:16}}>
          <div><small className="dim">Submitted</small><div style={{fontWeight:600,fontSize:13}}>{new Date(complaint.createdAt).toLocaleString()}</div></div>
          <div><small className="dim">By</small><div style={{fontWeight:600,fontSize:13}}>{user?.name||'Anonymous'}</div></div>
          <div><small className="dim">Location</small><div style={{fontWeight:600,fontSize:13}}>{complaint.location||complaint.zone||'N/A'}</div></div>
        </div>

        {complaint.resolution && (
          <div className="panel pad" style={{marginBottom:16,background:'rgba(138,154,138,.06)',borderColor:'var(--sage)'}}>
            <b style={{color:'var(--sage)'}}><i className="fas fa-check-circle" /> Resolution</b>
            <p style={{fontSize:13,color:'var(--text)',marginTop:4}}>{complaint.resolution}</p>
            {complaint.resolvedBy && <small className="dim">Resolved by: {users?.find(u=>u.id===complaint.resolvedBy)?.name||'Staff'}</small>}
          </div>
        )}

        {!isResolved && complaint.timeline && (
          <div className="timeline">
            {complaint.timeline.map((t,i)=><div key={i} className="event"><b>{t.status}</b><p>{t.note}</p><small>{new Date(t.timestamp).toLocaleString()}</small></div>)}
          </div>
        )}

        {/* Staff: Resolve */}
        {canResolve && (
          <div className="panel pad" style={{marginBottom:16}}>
            <div className="head"><h3>Resolve This Complaint</h3></div>
            <textarea className="input" value={resolution} onChange={e=>setResolution(e.target.value)} placeholder="Describe how this issue was resolved..." rows={2} />
            <button className="btn success" style={{marginTop:8}} onClick={()=>{if(resolution.trim()){onResolve(complaint.id,resolution);setShowResolve(false);}}}><i className="fas fa-check-double" /> Mark Resolved</button>
          </div>
        )}

        {/* Admin: Approve */}
        {canApprove && (
          <div className="panel pad" style={{marginBottom:16,borderColor:'var(--gold)'}}>
            <div className="head"><h3 style={{color:'var(--gold)'}}>Admin Approval</h3></div>
            <p style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>This complaint has been resolved by the department. Approve to close it officially.</p>
            <button className="btn primary" onClick={()=>onApprove(complaint.id)}><i className="fas fa-crown" /> Approve & Close</button>
          </div>
        )}

        {/* User: Rating */}
        {canRate && (
          <div className="panel pad" style={{marginBottom:16,borderColor:'var(--gold)'}}>
            <div className="head"><h3>Rate Resolution</h3></div>
            <div style={{display:'flex',gap:6,marginBottom:8}}>
              {[1,2,3,4,5].map(n=><button key={n} className="btn icon" style={{color:n<=rating?'var(--gold)':'var(--dim)'}} onClick={()=>setRating(n)}><i className="fas fa-star" /></button>)}
            </div>
            <input className="input" value={feedback} onChange={e=>setFeedback(e.target.value)} placeholder="Share your feedback..." />
            <button className="btn primary" style={{marginTop:8}} onClick={()=>{if(rating){onRate(complaint.id,rating,feedback);}}}><i className="fas fa-comment" /> Submit Feedback</button>
          </div>
        )}

        {/* Comments */}
        <div className="head" style={{marginTop:12}}><h3>Comments</h3></div>
        {complaint.comments?.map(c=>(
          <div key={c.id} className="comment">
            <div className="author">{c.name} <small>@{c.role} · {new Date(c.timestamp).toLocaleString()}</small></div>
            <p>{c.message}</p>
          </div>
        ))||<p className="dim" style={{fontSize:12}}>No comments yet</p>}

        <div style={{display:'flex',gap:8,marginTop:12}}>
          <input className="input" value={comment} onChange={e=>setComment(e.target.value)} placeholder="Add a comment..." onKeyDown={e=>e.key==='Enter'&&addComment()} />
          <button className="btn primary" onClick={addComment}><i className="fas fa-paper-plane" /></button>
        </div>
      </div>
    </div>
  );
}

// Placeholder components for other views
function Analytics({complaints,users}){ return <div className="animate panel pad"><h3>Analytics Dashboard</h3><p className="muted">Complaint statistics and insights</p><div className="stats" style={{marginTop:16}}><div className="stat-card"><div className="number">{complaints.length}</div><div className="label">Total</div></div><div className="stat-card"><div className="number">{complaints.filter(c=>c.status==='resolved').length}</div><div className="label">Resolved</div></div><div className="stat-card"><div className="number">{complaints.filter(c=>c.approved).length}</div><div className="label">Approved</div></div></div></div>; }
function UserManagement({users,setUsers}){ return <div className="animate panel pad"><h3>User Management</h3><table className="table" style={{width:'100%',borderCollapse:'collapse',marginTop:12}}><thead><tr style={{borderBottom:'2px solid var(--line)'}}><th style={{textAlign:'left',padding:10,fontSize:11,color:'var(--dim)'}}>Name</th><th style={{textAlign:'left',padding:10,fontSize:11,color:'var(--dim)'}}>Role</th><th style={{textAlign:'left',padding:10,fontSize:11,color:'var(--dim)'}}>Department</th></tr></thead><tbody>{users.map(u=><tr key={u.id} style={{borderBottom:'1px solid var(--line)'}}><td style={{padding:10}}>{u.name}</td><td style={{padding:10}}><span className="badge badge-gold">{u.role}</span></td><td style={{padding:10}}>{u.department}</td></tr>)}</tbody></table></div>; }
function AuditLog({complaints,users}){ return <div className="animate panel pad"><h3>Audit Trail</h3><p className="muted">Recent activity log</p><div style={{marginTop:12}}>{complaints.slice(0,10).map(c=><div key={c.id} style={{padding:8,borderBottom:'1px solid var(--line)',fontSize:12}}><span className="badge badge-navy">{c.status}</span> {c.id} - {c.title} <span className="dim">{new Date(c.updatedAt).toLocaleString()}</span></div>)}</div></div>; }
function Settings({theme,setTheme}){ return <div className="animate panel pad"><h3>Settings</h3><div style={{display:'flex',gap:12,alignItems:'center',marginTop:12}}><button className="btn" onClick={()=>setTheme(theme==='dark'?'light':'dark')}><i className={`fas ${theme==='dark'?'fa-sun':'fa-moon'}`} /> Switch to {theme==='dark'?'Light':'Dark'} Mode</button></div><p className="muted" style={{fontSize:11,marginTop:16}}>Data is stored locally. Connect Firebase for cloud sync.</p></div>; }

function MobileNav({view,setView}){
  const items=[['dashboard','fa-gauge-high','Home'],['complaints','fa-list','Cases'],['new','fa-plus','New'],['settings','fa-sliders','More']];
  return <nav className="mobile-nav">{items.map(([id,icon,label])=><button key={id} className={view===id?'active':''} onClick={()=>setView(id)}><i className={`fas ${icon}`} />{label}</button>)}</nav>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body>
</html>
