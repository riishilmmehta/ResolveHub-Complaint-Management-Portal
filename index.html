<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>ResolveHub · Extreme Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ... (all styles from the provided file remain exactly as given) ... */
    :root {
      --bg: #0a0e1a;
      --bg-elevated: #111827;
      --surface: rgba(255,255,255,0.03);
      --surface-hover: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-glow: rgba(99,102,241,0.4);
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --info: #3b82f6;
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --font: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 20px;
      --radius-sm: 12px;
    }
    .light-mode {
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --surface: rgba(255,255,255,0.7);
      --surface-hover: rgba(241,245,249,0.9);
      --border: rgba(148,163,184,0.2);
      --border-hover: rgba(148,163,184,0.3);
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 10px; }
    ::selection { background: var(--primary-glow); color: white; }
    
    /* Animations */
    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity:0; transform: translateX(-20px); } to { opacity:1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes glow { 0%,100% { box-shadow: 0 0 20px var(--primary-glow); } 50% { box-shadow: 0 0 40px var(--primary-glow); } }
    @keyframes countUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    @keyframes ring { 0% { transform: scale(1); opacity:1; } 100% { transform: scale(1.5); opacity:0; } }
    
    .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
    .animate-slide { animation: slideIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
    .stagger-1 { animation-delay: 0.05s; opacity:0; }
    .stagger-2 { animation-delay: 0.1s; opacity:0; }
    .stagger-3 { animation-delay: 0.15s; opacity:0; }
    .stagger-4 { animation-delay: 0.2s; opacity:0; }
    
    /* Glass */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .glass:hover { border-color: var(--border-hover); }
    
    /* Layout */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
      z-index: 50;
      transition: transform 0.3s;
    }
    .sidebar-collapsed { transform: translateX(-100%); }
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 24px 32px;
      max-width: calc(100vw - 260px);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .page-subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    
    /* Nav */
    .nav-brand {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-brand .badge {
      font-size: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      -webkit-text-fill-color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .nav-section { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 20px 0 10px 12px; font-weight: 600; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      position: relative;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.1));
      color: var(--primary-light);
      font-weight: 600;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: linear-gradient(180deg, var(--primary), var(--accent-purple));
      border-radius: 0 4px 4px 0;
    }
    .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }
    
    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      cursor: pointer;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-hover);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 120px; height: 120px;
      background: radial-gradient(circle, var(--glow-color, rgba(99,102,241,0.1)), transparent 70%);
      border-radius: 50%;
      transform: translate(30%, -30%);
    }
    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 14px;
      background: var(--glow-color, rgba(99,102,241,0.1));
      color: var(--icon-color, var(--primary-light));
    }
    .stat-value {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .stat-delta {
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--delta-bg);
      color: var(--delta-color);
    }
    
    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: all 0.3s;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card-title { font-size: 16px; font-weight: 700; margin: 0; }
    
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(99,102,241,0.4); }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }
    
    /* Search & Filters */
    .search-bar {
      position: relative;
      flex: 1;
      max-width: 400px;
    }
    .search-bar input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .search-bar i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-chip:hover, .filter-chip.active {
      border-color: var(--primary);
      color: var(--primary-light);
      background: rgba(99,102,241,0.08);
    }
    
    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge-priority-critical { background: rgba(239,68,68,0.12); color: #f87171; }
    .badge-priority-high { background: rgba(234,179,8,0.12); color: #facc15; }
    .badge-priority-medium { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .badge-priority-low { background: rgba(148,163,184,0.12); color: #94a3b8; }
    .badge-status-submitted { background: rgba(148,163,184,0.12); color: #94a3b8; }
    .badge-status-assigned { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .badge-status-progress { background: rgba(168,85,247,0.12); color: #c084fc; }
    .badge-status-review { background: rgba(234,179,8,0.12); color: #facc15; }
    .badge-status-resolved { background: rgba(34,197,94,0.12); color: #4ade80; }
    .badge-status-closed { background: rgba(100,116,139,0.12); color: #64748b; }
    
    /* Complaint List */
    .complaint-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .complaint-row:hover {
      background: var(--surface-hover);
      border-color: var(--border);
    }
    .complaint-row.selected {
      background: rgba(99,102,241,0.05);
      border-color: rgba(99,102,241,0.3);
    }
    .complaint-info { flex: 1; min-width: 0; }
    .complaint-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .complaint-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .upvote-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .upvote-btn:hover { border-color: var(--primary); color: var(--primary-light); }
    .upvote-btn.active {
      background: rgba(99,102,241,0.12);
      border-color: var(--primary);
      color: var(--primary-light);
    }
    
    /* Kanban */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .kanban-column {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      min-height: 400px;
    }
    .kanban-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .kanban-count {
      background: var(--surface);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .kanban-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .kanban-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-hover);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .kanban-card.dragging { opacity: 0.5; transform: rotate(3deg); }
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent-purple));
      transition: width 0.5s ease;
    }
    
    /* Calendar */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .calendar-day-header {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .calendar-day {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 80px;
    }
    .calendar-day:hover { border-color: var(--primary); }
    .calendar-day.other-month { opacity: 0.3; }
    .calendar-day.today {
      border-color: var(--primary);
      background: rgba(99,102,241,0.05);
    }
    .calendar-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      position: absolute;
      bottom: 8px;
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s;
    }
    .modal-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideIn 0.3s cubic-bezier(0.16,1,0.3,1);
      box-shadow: 0 40px 80px rgba(0,0,0,0.4);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 24px 0;
    }
    .modal-body { padding: 20px 24px 24px; }
    .modal-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--surface-hover); color: var(--text); }
    
    /* Timeline */
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--primary), var(--accent-purple));
      border-radius: 2px;
    }
    .timeline-item {
      position: relative;
      padding-bottom: 20px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 2px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 2px solid var(--primary);
    }
    .timeline-time {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .timeline-content {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    
    /* Comments */
    .comment {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .comment-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .comment-body { flex: 1; }
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .comment-author { font-weight: 600; font-size: 13px; }
    .comment-role {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-muted);
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .comment-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .comment-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .comment-action {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      font-family: inherit;
    }
    .comment-action:hover { color: var(--primary-light); }
    
    /* Form */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    /* Notifications */
    .notif-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      width: 360px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      z-index: 60;
      overflow: hidden;
      animation: fadeIn 0.2s;
    }
    .notif-item {
      display: flex;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }
    .notif-item:hover { background: var(--surface-hover); }
    .notif-item.unread { border-left: 3px solid var(--primary); }
    .notif-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    
    /* Heatmap */
    .heatmap-grid {
      display: grid;
