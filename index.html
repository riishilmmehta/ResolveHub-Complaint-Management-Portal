<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#4f46e5">
  <title>ResolveHub · Next-Gen Issue Resolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #a855f7;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --surface: rgba(255,255,255,0.72);
      --surface-hover: rgba(255,255,255,0.9);
      --text: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border: rgba(99,102,241,0.12);
      --border-strong: rgba(99,102,241,0.22);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.08);
      --radius: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .dark {
      --bg: #0b0f1f;
      --bg-elevated: #0f172a;
      --surface: rgba(15,23,42,0.65);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --border: rgba(99,102,241,0.18);
      --border-strong: rgba(99,102,241,0.28);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius); border: none;
      font-weight: 600; font-size: 14px; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      color: white;
      box-shadow: 0 4px 16px rgba(79,70,229,0.35);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px rgba(79,70,229,0.45); transform: translateY(-1px); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: rgba(99,102,241,0.08); color: var(--primary); }
    .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 20px; }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #f87171); color: white; }
    .btn-success { background: linear-gradient(135deg, var(--success), #34d399); color: white; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: 40px; font-size: 11px;
      font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
    }

    .input {
      width: 100%; padding: 12px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 14px; font-family: var(--font);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }

    .app-shell { display: flex; min-height: 100vh; }
    
    .sidebar {
      width: 260px; position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; padding: 24px 16px;
      border-right: 1px solid var(--border); z-index: 50;
      background: var(--surface); backdrop-filter: blur(20px);
    }
    .sidebar-brand {
      font-size: 24px; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      padding: 0 8px; margin-bottom: 8px;
    }
    .sidebar-nav { flex: 1; overflow-y: auto; margin: 16px -4px; padding: 0 4px; }
    .nav-item {
      width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: var(--radius); border: none;
      background: transparent; color: var(--text-secondary);
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 4px;
      font-family: var(--font); text-align: left;
    }
    .nav-item:hover { background: rgba(99,102,241,0.06); color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(168,85,247,0.08)); color: var(--primary); font-weight: 700; }
    .nav-item .nav-icon { width: 22px; text-align: center; }

    .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .user-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; color: white; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
    }
    .avatar-sm { width: 32px; height: 32px; font-size: 13px; }

    .main-area { flex: 1; padding: 28px 32px; max-width: 1400px; margin: 0 auto; width: 100%; }
    
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
    .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
    .search-wrap { position: relative; flex: 1; max-width: 320px; min-width: 200px; }
    .search-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 14px; }
    .search-wrap input { padding-left: 42px; border-radius: 30px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      padding: 20px; border-radius: var(--radius-lg);
      display: flex; align-items: center; gap: 16px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
    .stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .stat-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-top: 4px; }

    .complaint-row {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; gap: 16px;
    }
    .complaint-row:last-child { border-bottom: none; }
    .complaint-row:hover { background: rgba(99,102,241,0.03); }
    .complaint-info { flex: 1; min-width: 0; }
    .complaint-subject { font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .complaint-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .complaint-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .upvote-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: 30px; font-size: 12px; font-weight: 700;
      border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
      cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .upvote-btn:hover { background: rgba(99,102,241,0.08); border-color: var(--primary-light); color: var(--primary); }
    .upvote-btn.upvoted { background: rgba(99,102,241,0.12); border-color: var(--primary); color: var(--primary); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.2s ease;
    }
    .modal-box {
      max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto;
      border-radius: var(--radius-xl); padding: 28px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-lg); animation: scaleIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 100%; pointer-events: none; }
    .toast {
      padding: 14px 18px; border-radius: var(--radius); backdrop-filter: blur(12px);
      font-weight: 600; font-size: 14px; border-left: 4px solid;
      box-shadow: var(--shadow-lg); pointer-events: auto;
      display: flex; align-items: center; gap: 10px; animation: slideUp 0.35s ease;
    }
    .toast-success { background: rgba(16,185,129,0.12); border-color: var(--success); color: #065f46; }
    .dark .toast-success { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .toast-error { background: rgba(239,68,68,0.12); border-color: var(--danger); color: #991b1b; }
    .dark .toast-error { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .toast-info { background: rgba(99,102,241,0.12); border-color: var(--primary); color: #3730a3; }
    .dark .toast-info { background: rgba(99,102,241,0.15); color: #a5b4fc; }

    .heatmap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (min-width: 640px) { .heatmap-grid { grid-template-columns: repeat(6, 1fr); } }
    .heat-cell {
      aspect-ratio: 1; border-radius: var(--radius); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
    }
    .heat-cell:hover { transform: scale(1.06); z-index: 2; box-shadow: var(--shadow); }
    .heat-label { font-size: 12px; font-weight: 700; text-transform: capitalize; }
    .heat-value { font-size: 22px; font-weight: 800; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 16px; display: block; }

    .login-bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #e0f2fe 100%);
    }
    .dark .login-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
    .login-blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6;
      animation: float 8s ease-in-out infinite;
    }

    .checkbox-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .checkbox-wrap input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

    .timeline-item { display: flex; gap: 14px; padding: 12px 0; position: relative; }
    .timeline-item::before {
      content: ''; position: absolute; left: 15px; top: 36px; bottom: -12px;
      width: 2px; background: var(--border); border-radius: 2px;
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: white; z-index: 1;
    }

    .dept-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .dept-bar-bg { flex: 1; height: 8px; border-radius: 8px; background: var(--border); overflow: hidden; }
    .dept-bar-fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

    .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .kanban-column { border-radius: var(--radius-lg); padding: 16px; background: var(--surface); border: 1px solid var(--border); }
    .kanban-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    .kanban-count { padding: 2px 10px; border-radius: 20px; font-size: 11px; background: var(--border); }
    .kanban-card {
      padding: 14px; border-radius: var(--radius); background: var(--bg-elevated);
      border: 1px solid var(--border); margin-bottom: 10px; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .kanban-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--border-strong); }

    .confetti-piece {
      position: fixed; width: 10px; height: 10px; top: -10px; z-index: 99999;
      animation: confetti-fall 3s linear forwards;
    }
    @keyframes confetti-fall { 0% { transform: translateY(-120vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(120vh) rotate(960deg); opacity: 0; } }

    .activity-item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

    .role-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }
    .role-card {
      padding: 20px;
      border-radius: var(--radius-lg);
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid var(--border);
      background: var(--surface);
    }
    .role-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-light);
      box-shadow: var(--shadow-lg);
    }
    .role-card.selected {
      border-color: var(--primary);
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
    }
    .role-card .role-icon {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
    }
    .role-card .role-name {
      font-weight: 700;
      font-size: 14px;
    }
    .role-card .role-email {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 16px; flex-direction: row; align-items: center; overflow-x: auto; }
      .sidebar-brand { font-size: 20px; margin-bottom: 0; margin-right: 12px; }
      .sidebar-nav { display: flex; flex-direction: row; gap: 4px; margin: 0; overflow-x: auto; flex: 1; }
      .nav-item { width: auto; padding: 8px 14px; margin-bottom: 0; white-space: nowrap; }
      .nav-item span { display: none; }
      .sidebar-footer { display: none; }
      .main-area { padding: 16px; }
      .page-title { font-size: 22px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-icon { width: 40px; height: 40px; font-size: 18px; }
      .stat-value { font-size: 20px; }
      .modal-box { padding: 20px; }
      .heatmap-grid { grid-template-columns: repeat(3, 1fr); }
      .role-selector { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script>
    // Check if React loaded
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      document.getElementById('root').innerHTML = `
        <div style="height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; font-family:'Inter',sans-serif; padding:20px; text-align:center;">
          <div style="font-size:48px;">⚠️</div>
          <h2 style="color:#0f172a;">Failed to load React</h2>
          <p style="color:#64748b; max-width:400px;">Please check your internet connection and try again.</p>

        </div>
      `;
    } else {
      const { useState, useEffect, useCallback, useContext, useRef, createContext } = React;

      // ===================== CONSTANTS & HELPERS =====================
      const STORAGE_KEY = 'resolvehub_data_v2';
      const SESSION_KEY = 'resolvehub_session';

      const STATUS_COLORS = {
        submitted: '#94a3b8', 'under review': '#f59e0b', assigned: '#6366f1',
        'in progress': '#8b5cf6', resolved: '#10b981', closed: '#64748b',

      };

      const ZONES = ['academic', 'hostel', 'library', 'cafeteria', 'admin', 'transport'];
      const ZONE_LABELS = { academic: 'Academic', hostel: 'Hostel', library: 'Library', cafeteria: 'Cafeteria', admin: 'Admin', transport: 'Transport' };
      const CATEGORIES = ['Infrastructure','Academic','Faculty','Examination','Hostel','Transport','Library','IT / Technology','Security','Cleanliness','Electricity','Water','Harassment / Misconduct','Administration','Other'];
      const PRIORITIES = ['low','medium','high','critical'];

      function getStatusColor(s) { return STATUS_COLORS[(s||'').toLowerCase()] || '#94a3b8'; }
      function getPriorityColor(p) { return PRIORITY_COLORS[(p||'').toLowerCase()] || '#94a3b8'; }
      function formatDate(ts) { if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
      function timeAgo(ts) { const s=Math.floor((Date.now()-ts)/1000); const intervals={y:31536000,m:2592000,w:604800,d:86400,h:3600,n:60}; for(let[k,v]of Object.entries(intervals)){const c=Math.floor(s/v); if(c>0) return c+' '+k+(c>1?'s':'')+' ago'; } return 'Just now'; }
      function generateId() { return 'CMP-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*100000)).padStart(5,'0'); }
      function getGreeting() { const h=new Date().getHours(); if(h<12)return 'Good morning'; if(h<17)return 'Good afternoon'; return 'Good evening'; }

      const defaultUsers = [
        { id:'u1', name:'Admin', email:'admin@portal.demo', role:'admin', department:'Administration' },
        { id:'u2', name:'Student', email:'student@portal.demo', role:'student', department:'Engineering' },
        { id:'u3', name:'Teacher', email:'teacher@portal.demo', role:'teacher', department:'CS' },
        { id:'u4', name:'Staff', email:'staff@portal.demo', role:'staff', department:'Facilities' },
      ];

      const defaultComplaints = [
