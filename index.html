<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Complaint System — ResolveHub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--navy:#1a2332;
--gold:#c9a84c;
--gold-light:#e8d5a3;
--cream:#f5efe6;
--burgundy:#6b2e3e;
--sage:#8a9a8a;
--rose:#d4a0a0;
--panel:rgba(255,252,248,.92);
--panel-dark:rgba(26,35,50,.95);
--text:#1a2332;
--muted:#6b6b6b;
--dim:#9a9a9a;
--line:rgba(26,35,50,.12);
--shadow:0 8px 40px rgba(26,35,50,.15);
--r:12px;
--font-serif:'Playfair Display',serif;
--font-sans:'Inter',sans-serif;
}
[data-theme="dark"]{
--panel:rgba(26,35,50,.94);
--panel-dark:rgba(26,35,50,.98);
--text:#f5efe6;
--muted:#b8b0a0;
--dim:#8a8278;
--line:rgba(245,239,230,.12);
--shadow:0 8px 40px rgba(0,0,0,.3);
}
html,body{min-height:100%;width:100%;margin:0;padding:0}
body{
font-family:var(--font-sans);
background:var(--cream);
color:var(--text);
overflow-x:hidden;
}
button,input,textarea,select{font:inherit;font-family:var(--font-sans)}
button{cursor:pointer;transition:all .3s ease}
::selection{background:var(--gold);color:var(--navy)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--cream)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
#root{min-height:100vh}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes slideUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes slideDown{0%{opacity:0;transform:translateY(-30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:translateX(0)}}
@keyframes slideRight{0%{opacity:0;transform:translateX(-30px)}100%{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(201,168,76,.2)}50%{box-shadow:0 0 40px rgba(201,168,76,.4)}}
.animate-fade{animation:fadeIn .5s ease both}
.animate-slide-up{animation:slideUp .5s ease both}
.animate-slide-down{animation:slideDown .5s ease both}
.animate-slide-left{animation:slideLeft .5s ease both}
.animate-slide-right{animation:slideRight .5s ease both}
.animate-scale{animation:scaleIn .4s ease both}
.animate-float{animation:float 3s ease-in-out infinite}
.animate-glow{animation:glow 2s ease-in-out infinite}
.stagger>*{animation:slideUp .5s ease both}
.stagger>*:nth-child(1){animation-delay:.05s}
.stagger>*:nth-child(2){animation-delay:.1s}
.stagger>*:nth-child(3){animation-delay:.15s}
.stagger>*:nth-child(4){animation-delay:.2s}
.stagger>*:nth-child(5){animation-delay:.25s}

/* ===== SIDEBAR ===== */
.sidebar{
width:280px;
position:sticky;
top:0;
height:100vh;
padding:28px 20px;
background:var(--panel-dark);
backdrop-filter:blur(20px);
border-right:2px solid var(--gold);
display:flex;
flex-direction:column;
z-index:20;
overflow-y:auto;
flex-shrink:0;
}
.sidebar .brand{
display:flex;
align-items:center;
gap:14px;
padding-bottom:28px;
border-bottom:2px solid rgba(201,168,76,.2);
margin-bottom:20px;
}
.sidebar .brand .crest{
width:52px;height:52px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
color:var(--navy);
font-size:24px;
border:2px solid var(--gold-light);
flex:none;
}
.sidebar .brand h1{
font-family:var(--font-serif);
font-size:22px;
font-weight:900;
color:var(--gold);
}
.sidebar .brand span{
display:block;
font-size:10px;
color:var(--dim);
letter-spacing:2px;
text-transform:uppercase;
}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{
border:1px solid transparent;
background:transparent;
color:var(--muted);
padding:12px 16px;
border-radius:var(--r);
text-align:left;
display:flex;
align-items:center;
gap:14px;
font-size:14px;
font-weight:500;
transition:all .3s ease;
position:relative;
}
.nav button:hover{
background:rgba(201,168,76,.08);
color:var(--text);
transform:translateX(4px);
}
.nav button.active{
background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));
color:var(--gold);
border-color:rgba(201,168,76,.3);
}
.nav button.active::before{
content:'';
position:absolute;
left:0;
top:20%;
height:60%;
width:3px;
background:var(--gold);
border-radius:0 3px 3px 0;
}
.nav i{width:22px;text-align:center;font-size:16px}
.sidebar-bottom{
margin-top:auto;
border-top:2px solid rgba(201,168,76,.15);
padding-top:16px;
}
.user-card{
display:flex;
align-items:center;
gap:12px;
padding:10px 6px;
border-radius:var(--r);
background:rgba(201,168,76,.06);
}
.user-card .avatar{
width:40px;height:40px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
font-weight:700;
color:var(--navy);
font-size:16px;
border:2px solid var(--gold-light);
flex:none;
}
.user-card .info{flex:1;min-width:0}
.user-card .info strong{display:block;font-size:13px}
.user-card .info small{color:var(--dim);font-size:10px;text-transform:capitalize}
.user-card .logout-btn{
width:34px;height:34px;
border-radius:50%;
border:1px solid rgba(201,168,76,.2);
background:transparent;
color:var(--muted);
display:grid;
place-items:center;
transition:all .3s ease;
}
.user-card .logout-btn:hover{background:rgba(201,168,76,.15);color:var(--gold);transform:rotate(90deg)}

/* ===== MAIN ===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;padding:30px 36px 50px;max-width:1600px;margin:auto;width:100%}

/* ===== TOPBAR ===== */
.topbar{
display:flex;
gap:16px;
align-items:center;
justify-content:space-between;
margin-bottom:28px;
padding-bottom:16px;
border-bottom:2px solid var(--line);
}
.topbar .title h1{
font-family:var(--font-serif);
font-size:30px;
font-weight:900;
color:var(--text);
}
.topbar .title p{color:var(--muted);font-size:13px;margin-top:4px}
.topbar .title p i{color:var(--gold);margin-right:6px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{
position:relative;
width:min(320px,40vw);
}
.search i{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
color:var(--dim);
font-size:14px;
}
.search input{
padding-left:42px;
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--r);
padding:11px 14px 11px 42px;
font-size:13px;
color:var(--text);
outline:none;
width:100%;
transition:all .3s ease;
}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}

/* ===== BUTTONS ===== */
.btn{
border:1px solid var(--line);
background:var(--panel);
color:var(--text);
padding:10px 18px;
border-radius:var(--r);
font-weight:600;
display:inline-flex;
align-items:center;
gap:8px;
transition:all .3s ease;
font-size:13px;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary{
background:linear-gradient(135deg,var(--gold),#b8953a);
border-color:var(--gold);
color:var(--navy);
box-shadow:0 4px 20px rgba(201,168,76,.25);
}
.btn.primary:hover{box-shadow:0 6px 30px rgba(201,168,76,.35)}
.btn.success{
background:rgba(138,154,138,.15);
border-color:var(--sage);
color:var(--sage);
}
.btn.danger{
background:rgba(107,46,62,.15);
border-color:var(--burgundy);
color:var(--burgundy);
}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center}
.btn.sm{padding:6px 12px;font-size:11px;border-radius:8px}
.btn.outline{
background:transparent;
border-color:var(--gold);
color:var(--gold);
}
.btn.outline:hover{background:var(--gold);color:var(--navy)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ===== PANELS ===== */
.panel{
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--r);
box-shadow:var(--shadow);
backdrop-filter:blur(10px);
}
.panel.pad{padding:22px}
.panel .head{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:16px;
}
.panel .head h3{font-family:var(--font-serif);font-size:18px;font-weight:700}
.panel .head p{color:var(--muted);font-size:12px;margin-top:3px}

/* ===== STATS ===== */
.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-bottom:20px;
}
.stat-card{
padding:20px 22px;
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--r);
box-shadow:var(--shadow);
transition:all .3s ease;
position:relative;
}
.stat-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.stat-card .icon{
width:44px;height:44px;
border-radius:50%;
display:grid;
place-items:center;
margin-bottom:14px;
font-size:18px;
border:1px solid;
}
.stat-card .number{font-size:30px;font-weight:900;font-family:var(--font-serif)}
.stat-card .label{font-size:12px;color:var(--muted);margin-top:4px}

/* ===== GRIDS ===== */
.grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

/* ===== COMPLAINT ROW ===== */
.complaint-row{
padding:14px 18px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
gap:14px;
cursor:pointer;
transition:all .3s ease;
}
.complaint-row:last-child{border-bottom:0}
.complaint-row:hover{background:rgba(201,168,76,.05);transform:translateX(4px)}
.complaint-row .avatar-sm{
width:36px;height:36px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
font-weight:700;
color:var(--navy);
font-size:13px;
flex:none;
}
.complaint-row .content{flex:1;min-width:0}
.complaint-row .content b{font-size:14px;display:block}
.complaint-row .content .meta{
display:flex;gap:8px;flex-wrap:wrap;
color:var(--dim);font-size:10px;margin-top:4px;
}
.complaint-row .badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ===== BADGES ===== */
.badge{
padding:4px 10px;
border-radius:20px;
font-size:9px;
font-weight:700;
text-transform:uppercase;
letter-spacing:.5px;
border:1px solid;
}
.badge-gold{color:var(--gold);border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.08)}
.badge-navy{color:var(--navy);border-color:rgba(26,35,50,.2);background:rgba(26,35,50,.06)}
.badge-sage{color:var(--sage);border-color:rgba(138,154,138,.3);background:rgba(138,154,138,.08)}
.badge-rose{color:var(--rose);border-color:rgba(212,160,160,.3);background:rgba(212,160,160,.08)}
.badge-burgundy{color:var(--burgundy);border-color:rgba(107,46,62,.3);background:rgba(107,46,62,.08)}

/* ===== FILTERS ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters input{
padding:9px 14px;
border:1px solid var(--line);
border-radius:var(--r);
background:var(--panel);
color:var(--text);
outline:none;
font-size:12px;
min-width:140px;
transition:all .3s ease;
}
.filters select:focus,.filters input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}

/* ===== FORM ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{
font-size:11px;
font-weight:600;
color:var(--muted);
text-transform:uppercase;
letter-spacing:.7px;
}
.field .input{
padding:11px 14px;
border:1px solid var(--line);
border-radius:var(--r);
background:var(--panel);
color:var(--text);
outline:none;
font-size:13px;
width:100%;
transition:all .3s ease;
}
.field .input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.field textarea.input{resize:vertical;min-height:100px}

/* ===== MODAL ===== */
.modal{
position:fixed;inset:0;
background:rgba(26,35,50,.7);
backdrop-filter:blur(8px);
z-index:100;
display:grid;
place-items:center;
padding:20px;
}
.modal-box{
width:min(820px,100%);
max-height:90vh;
overflow:auto;
background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
box-shadow:var(--shadow);
padding:28px;
}
.modal-box .modal-head{
display:flex;
justify-content:space-between;
gap:12px;
margin-bottom:20px;
padding-bottom:14px;
border-bottom:2px solid var(--line);
}
.modal-box .modal-head h2{font-family:var(--font-serif);font-size:22px;font-weight:700}

/* ===== TIMELINE ===== */
.timeline{position:relative;padding-left:24px;margin:12px 0 18px}
.timeline::before{
content:'';
position:absolute;left:6px;top:4px;bottom:4px;
width:2px;
background:var(--gold);
opacity:.3;
}
.timeline .event{
position:relative;
padding:0 0 18px 16px;
}
.timeline .event::before{
content:'';
position:absolute;left:-4px;top:4px;
width:12px;height:12px;
border-radius:50%;
background:var(--gold);
border:2px solid var(--panel);
box-shadow:0 0 0 3px rgba(201,168,76,.2);
}
.timeline .event b{font-size:12px;text-transform:capitalize;color:var(--gold)}
.timeline .event p{font-size:11px;color:var(--muted);margin-top:3px}
.timeline .event small{color:var(--dim);font-size:9px;display:block;margin-top:2px}

/* ===== COMMENTS ===== */
.comment{padding:10px 0;border-top:1px solid var(--line)}
.comment .author{font-weight:600;font-size:12px}
.comment .author small{color:var(--dim);font-weight:400;font-size:10px;margin-left:8px}
.comment p{font-size:13px;color:var(--muted);margin-top:4px}

/* ===== LOGIN ===== */
.login-page{
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
background:var(--cream);
}
.login-box{
width:min(540px,100%);
padding:40px 44px;
background:var(--panel);
border:2px solid var(--gold);
border-radius:16px;
box-shadow:var(--shadow);
position:relative;
}
.login-box .crest{
width:72px;height:72px;
margin:0 auto 16px;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
display:grid;
place-items:center;
font-size:32px;
color:var(--navy);
border:3px solid var(--gold-light);
}
.login-box h1{font-family:var(--font-serif);font-size:34px;font-weight:900;text-align:center}
.login-box .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
.role-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:24px 0;
}
.role-card{
padding:16px;
border:2px solid var(--line);
border-radius:var(--r);
background:transparent;
text-align:center;
transition:all .3s ease;
cursor:pointer;
}
.role-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.role-card.selected{border-color:var(--gold);background:rgba(201,168,76,.08)}
.role-card i{font-size:28px;margin-bottom:8px;display:block}
.role-card b{display:block;font-size:14px}
.role-card small{color:var(--dim);font-size:10px}

/* ===== MOBILE ===== */
.mobile-nav{display:none}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
.table th{color:var(--dim);font-weight:600;text-transform:uppercase;font-size:10px}

/* ===== TOAST ===== */
.toast-wrap{
position:fixed;right:20px;bottom:20px;z-index:300;
display:flex;flex-direction:column;gap:8px;
width:min(380px,calc(100vw - 40px));
}
.toast{
background:var(--panel);
border:1px solid var(--line);
border-left:4px solid var(--gold);
border-radius:var(--r);
padding:12px 16px;
box-shadow:var(--shadow);
display:flex;
gap:10px;
align-items:center;
font-size:12px;
animation:slideUp .3s ease;
}
.toast.success{border-left-color:var(--sage)}
.toast.error{border-left-color:var(--burgundy)}

/* ===== CHART ===== */
.chart-container{position:relative;height:250px;padding:10px}

@media(max-width:1150px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:800px){
.sidebar{display:none}
.main{padding:16px 14px 80px}
.topbar{flex-direction:column;align-items:stretch}
.top-actions{flex-wrap:wrap}
.search{width:100%}
.stats{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:1fr}
.form-grid{grid-template-columns:1fr}
.field.full{grid-column:auto}
.role-grid{grid-template-columns:1fr}
.login-box{padding:24px 20px}
.mobile-nav{
display:flex;
position:fixed;bottom:12px;left:12px;right:12px;
z-index:40;
background:var(--panel-dark);
backdrop-filter:blur(20px);
border:1px solid var(--gold);
border-radius:14px;
padding:6px;
gap:2px;
}
.mobile-nav button{
flex:1;
background:transparent;
border:0;
color:var(--muted);
padding:8px 4px;
border-radius:10px;
font-size:9px;
font-weight:500;
}
.mobile-nav button.active{background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));color:var(--gold)}
.mobile-nav i{display:block;font-size:16px;margin-bottom:2px}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
// ===== REACT COMPONENTS =====
const {useState,useEffect,useMemo,useRef,createElement} = React;

// ===== CONSTANTS =====
const STATUSES = ['submitted','reviewing','assigned','in_progress','resolved','closed','rejected'];
const CATEGORIES = ['Academic','Infrastructure','IT/Technical','Administrative','Hostel','Cafeteria','Library','Transport','Security','Cleanliness','Electricity','Water','Harassment/Misconduct','Other'];
const ZONES = ['Academic Lab','Academic Class','Hostel','Library','Cafeteria','Admin Block','Transport'];
const DEPARTMENTS = ['IT','Facilities','Examination','Library','Transport','Administration','Academics','Security','Housekeeping','General'];
const PRIORITY_MAP = {
  'Academic':'medium','Infrastructure':'high','IT/Technical':'high','Administrative':'medium',
  'Hostel':'medium','Cafeteria':'low','Library':'low','Transport':'medium',
  'Security':'critical','Cleanliness':'low','Electricity':'critical','Water':'high',
  'Harassment/Misconduct':'critical','Other':'medium'
};
const ROLES = [
  {id:'admin',name:'Administrator',icon:'fa-user-shield',color:'#c9a84c'},
  {id:'student',name:'Student',icon:'fa-user-graduate',color:'#8a9a8a'},
  {id:'teacher',name:'Teacher',icon:'fa-chalkboard-user',color:'#d4a0a0'},
  {id:'staff',name:'Staff (IT)',icon:'fa-user-tie',color:'#6b2e3e'}
];

// ===== DEFAULT DATA =====
const DEFAULT_USERS = [
  {id:'u1',name:'Administrator',email:'admin@demo.com',role:'admin',department:'Administration'},
  {id:'u2',name:'Student User',email:'student@demo.com',role:'student',department:'General'},
  {id:'u3',name:'Dr. Teacher',email:'teacher@demo.com',role:'teacher',department:'Academics'},
  {id:'u4',name:'IT Staff',email:'staff@demo.com',role:'staff',department:'IT'},
  {id:'u5',name:'Facilities Staff',email:'facilities@demo.com',role:'staff',department:'Facilities'},
  {id:'u6',name:'Library Staff',email:'library@demo.com',role:'staff',department:'Library'},
  {id:'u7',name:'Examination Staff',email:'exam@demo.com',role:'staff',department:'Examination'}
];

const seedComplaints = [

  {id:'CMP-002',title:'Exam Schedule Conflict',description:'Two major exams scheduled on same day.',category:'Examination',priority:'critical',status:'reviewing',department:'Examination',zone:'Admin Block',location:'Academic Block',submittedBy:'u3',assignedTo:null,createdAt:Date.now()-86400000*1.5,updatedAt:Date.now()-86400000*1.2,timeline:[{status:'submitted',timestamp:Date.now()-86400000*1.5,note:'Complaint submitted'},{status:'reviewing',timestamp:Date.now()-86400000*1.2,note:'Under review by Examination Department'}],comments:[],resolution:'',rating:0,feedback:'',approved:false,resolvedBy:null,departmentApproved:false},
  {id:'CMP-003',title:'WiFi Connectivity Issue',description:'No reliable WiFi in hostel block C.',category:'IT/Technical',priority:'high',status:'in_progress',department:'IT',zone:'Hostel',location:'Hostel C',submittedBy:'u2',assignedTo:'u4',createdAt:Date.now()-86400000*3,updatedAt:Date.now()-86400000*1,timeline:[{status:'submitted',timestamp:Date.now()-86400000*3,note:'Complaint submitted'},{status:'assigned',timestamp:Date.now()-86400000*2.5,note:'Assigned to IT Staff'},{status:'in_progress',timestamp:Date.now()-86400000*1,note:'Work in progress - checking routers'}],comments:[{id:'c2',userId:'u4',name:'IT Staff',role:'staff',message:'We have identified the issue and are working on a fix.',timestamp:Date.now()-86400000*0.5}],resolution:'',rating:0,feedback:'',approved:false,resolvedBy:null,departmentApproved:false}
];

function generateId(){ return 'CMP-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase(); }

// ===== MAIN APP =====
function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('dashboard');
  const [query,setQuery]=useState('');
  const [selected,setSelected]=useState(null);
  const [toasts,setToasts]=useState([]);
  const [theme,setTheme]=useState('light');
  const [complaints,setComplaints]=useState([]);
  const [users,setUsers]=useState([]);

  // Load data
  useEffect(()=>{
    const saved = localStorage.getItem('complaint_data');
    if(saved){
      try{
        const d = JSON.parse(saved);
        setComplaints(d.complaints||[]);
        setUsers(d.users||[]);
      }catch(e){}
    } else {
      setUsers(DEFAULT_USERS);
      setComplaints(seedComplaints);
    }
    const sess = localStorage.getItem('session');
    if(sess) {
      try { setUser(JSON.parse(sess)); } catch(e){}
    }
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme) setTheme(savedTheme);
  },[]);

  useEffect(()=>{
    if(users.length || complaints.length){
      localStorage.setItem('complaint_data',JSON.stringify({complaints,users}));
    }
  },[complaints,users]);

  useEffect(()=>{
    document.documentElement.dataset.theme=theme;
    localStorage.setItem('theme',theme);
  },[theme]);

  const currentUser = user;
  const isAdmin = currentUser?.role==='admin';
  const isStaff = currentUser?.role==='staff';
  const isStudent = currentUser?.role==='student';
  const isTeacher = currentUser?.role==='teacher';

  function addToast(msg,type='info'){
    const t={id:Date.now()+Math.random(),msg,type};
    setToasts(prev=>[...prev,t]);
    setTimeout(()=>setToasts(prev=>prev.filter(x=>x.id!==t.id)),4000);
  }

  function login(role){
    let u = users.find(x=>x.role===role);
    if(!u){
      const newUser = {
        id:'u'+Date.now(),
        name: role==='admin'?'Administrator':role==='student'?'Student':role==='teacher'?'Teacher':'IT Staff',
        email:`${role}@demo.com`,
        role:role,
        department: role==='staff'?'IT':role==='admin'?'Administration':role==='teacher'?'Academics':'General'
      };
      setUsers(prev=>[...prev,newUser]);
      u=newUser;
    }
    setUser(u);
    localStorage.setItem('session',JSON.stringify(u));
    addToast(`Welcome ${u.name} ✨`,'success');
    setView('dashboard');
  }

  function logout(){
    setUser(null);
    localStorage.removeItem('session');
    addToast('Logged out','info');
  }

  function saveComplaint(data){
    const newC = {
      ...data,
      id: generateId(),
      status:'submitted',
      assignedTo: null,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      timeline: [{status:'submitted',timestamp:Date.now(),note:'Complaint submitted'}],
      comments:[],
      resolution:'',
      rating:0,
      feedback:'',
      approved:false,
      resolvedBy:null,
      departmentApproved:false
    };
    setComplaints(prev=>[newC,...prev]);
    addToast(`Complaint ${newC.id} submitted successfully!`,'success');
    setView('complaints');
  }

  function updateComplaint(id,changes,note){
    setComplaints(prev=>prev.map(c=>{
      if(c.id!==id) return c;
      const newC={...c,...changes,updatedAt:Date.now()};
      if(note){
        newC.timeline=[...c.timeline,{status:changes.status||c.status,timestamp:Date.now(),note}];
      }
      return newC;
    }));
  }

  function assignComplaint(id,assignedTo,department){
    const staffUser = users.find(u=>u.id===assignedTo);
    updateComplaint(id,{
      assignedTo: assignedTo,
      department: department || staffUser?.department,
      status:'assigned'
    },`Assigned to ${staffUser?.name||'Staff'} (${staffUser?.department||department})`);
    addToast(`Complaint assigned to ${staffUser?.name||'Staff'} successfully!`,'success');
  }

  function addComment(cid,msg){
    const c={id:'cmt'+Date.now(),userId:currentUser?.id||'anon',name:currentUser?.name||'Anonymous',role:currentUser?.role||'user',message:msg,timestamp:Date.now()};
    setComplaints(prev=>prev.map(comp=>{
      if(comp.id===cid){
        return {...comp,comments:[...(comp.comments||[]),c]};
      }
      return comp;
    }));
    addToast('Comment added!','success');
  }

  function rateComplaint(cid,rating,feedback){
    updateComplaint(cid,{rating,feedback,status:'closed'},`Rated ${rating}/5 - Feedback: ${feedback}`);
    addToast('Thank you for your feedback! 🙏','success');
  }

  function approveComplaint(cid){
    updateComplaint(cid,{approved:true,status:'closed'},'Approved by Admin');
    addToast('Complaint approved and closed!','success');
  }

  function resolveComplaint(cid,resolution){
    updateComplaint(cid,{
      status:'resolved',
      resolution:resolution,
      resolvedBy:currentUser?.id,
      departmentApproved:true
    },'Resolved by department - pending admin approval');
    addToast('Complaint resolved! Waiting for admin approval.','success');
  }

  // Role-based filtering - FIXED: Staff can see assigned complaints
  const visibleComplaints = useMemo(()=>{
    let list = complaints;
    if(query){
      const q=query.toLowerCase();
      list = list.filter(c=> 
        (c.id||'').toLowerCase().includes(q) ||
        (c.title||'').toLowerCase().includes(q) ||
        (c.category||'').toLowerCase().includes(q) ||
        (c.department||'').toLowerCase().includes(q)
      );
    }
    if(isAdmin) return list;
    if(isStaff){
      // Staff sees complaints assigned to them OR complaints in their department
      return list.filter(c=>c.assignedTo===currentUser?.id || c.department===currentUser?.department);
    }
    if(isTeacher){
      return list.filter(c=>c.department===currentUser?.department || c.submittedBy===currentUser?.id);
    }
    if(isStudent){
      return list.filter(c=>c.submittedBy===currentUser?.id);
    }
    return list;
  },[complaints,query,currentUser,isAdmin,isStaff,isTeacher,isStudent]);

  const stats = useMemo(()=>{
    const total=visibleComplaints.length;
    const pending=visibleComplaints.filter(c=>!['resolved','closed','rejected'].includes(c.status)).length;
    const resolved=visibleComplaints.filter(c=>c.status==='resolved' || c.status==='closed').length;
    const approved=visibleComplaints.filter(c=>c.approved).length;
    const critical=visibleComplaints.filter(c=>c.priority==='critical').length;
    const assigned=visibleComplaints.filter(c=>c.assignedTo).length;
    return {total,pending,resolved,approved,critical,assigned};
  },[visibleComplaints]);

  if(!currentUser){
    return createElement(LoginPage, {onLogin:login, theme:theme, setTheme:setTheme});
  }

  return createElement(React.Fragment, null,
    createElement('div', {className:'app'},
      createElement(Sidebar, {view:view, setView:setView, user:currentUser, logout:logout, isAdmin:isAdmin}),
      createElement('main', {className:'main'},
        createElement(Topbar, {view:view, setView:setView, query:query, setQuery:setQuery, theme:theme, setTheme:setTheme, user:currentUser}),
        view==='dashboard' && createElement(Dashboard, {stats:stats, complaints:visibleComplaints, setSelected:setSelected, setView:setView}),
        view==='complaints' && createElement(ComplaintsList, {complaints:visibleComplaints, setSelected:setSelected, setView:setView, isAdmin:isAdmin, isStaff:isStaff}),
        view==='new' && createElement(NewComplaint, {user:currentUser, onSubmit:saveComplaint}),
        view==='analytics' && isAdmin && createElement(Analytics, {complaints:complaints}),
        view==='users' && isAdmin && createElement(UserManagement, {users:users}),
        view==='audit' && isAdmin && createElement(AuditLog, {complaints:complaints}),
        view==='settings' && createElement(Settings, {theme:theme, setTheme:setTheme})
      ),
      createElement(MobileNav, {view:view, setView:setView})
    ),
    selected && createElement(ComplaintDetail, {
      complaint:selected,
      user:currentUser,
      isAdmin:isAdmin,
      isStaff:isStaff,
      isStudent:isStudent,
      onClose:()=>setSelected(null),
      onComment:addComment,
      onResolve:resolveComplaint,
      onApprove:approveComplaint,
      onRate:rateComplaint,
      onAssign:assignComplaint,
      users:users,
      departments:DEPARTMENTS
    }),
    createElement('div', {className:'toast-wrap'},
      toasts.map(t=>createElement('div', {key:t.id, className:'toast '+t.type},
        createElement('i', {className:'fas '+(t.type==='success'?'fa-check-circle':t.type==='error'?'fa-exclamation-circle':'fa-info-circle')}),
        t.msg
      ))
    )
  );
}

// ===== DASHBOARD =====
function Dashboard({stats,complaints,setSelected,setView}){
  const recent = [...complaints].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(()=>{
    if(!chartRef.current || typeof Chart === 'undefined') return;
    if(chartInstance.current) chartInstance.current.destroy();
    
    const ctx = chartRef.current.getContext('2d');
    const statusCounts = STATUSES.map(s => complaints.filter(c=>c.status===s).length);
    const colors = ['#c9a84c','#d4a0a0','#8a9a8a','#c9a84c','#8a9a8a','#1a2332','#6b2e3e'];
    
    chartInstance.current = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: STATUSES,
        datasets: [{
          data: statusCounts,
          backgroundColor: colors.map(c=>c+'cc'),
          borderColor: colors,
          borderWidth: 2,
          hoverOffset: 15
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, font: { size: 10 } } },
          animation: { animateRotate: true, duration: 2000 }
        },
        cutout: '65%'
      }
    });

    return ()=> { if(chartInstance.current) chartInstance.current.destroy(); };
  },[complaints]);

  return createElement('div', {className:'animate-fade'},
    createElement('div', {className:'stats stagger'},
      createElement('div', {className:'stat-card'}, 
        createElement('div', {className:'icon', style:{color:'var(--gold)',borderColor:'rgba(201,168,76,.3)'}}, createElement('i', {className:'fas fa-folder-open'})),
        createElement('div', {className:'number'}, stats.total),
        createElement('div', {className:'label'}, 'Total Cases')
      ),
      createElement('div', {className:'stat-card'}, 
        createElement('div', {className:'icon', style:{color:'var(--burgundy)',borderColor:'rgba(107,46,62,.3)'}}, createElement('i', {className:'fas fa-clock'})),
        createElement('div', {className:'number'}, stats.pending),
        createElement('div', {className:'label'}, 'Pending')
      ),
      createElement('div', {className:'stat-card'}, 
        createElement('div', {className:'icon', style:{color:'var(--sage)',borderColor:'rgba(138,154,138,.3)'}}, createElement('i', {className:'fas fa-check-circle'})),
        createElement('div', {className:'number'}, stats.resolved),
        createElement('div', {className:'label'}, 'Resolved')
      ),
      createElement('div', {className:'stat-card'}, 
        createElement('div', {className:'icon', style:{color:'var(--gold)',borderColor:'rgba(201,168,76,.3)'}}, createElement('i', {className:'fas fa-crown'})),
        createElement('div', {className:'number'}, stats.approved),
        createElement('div', {className:'label'}, 'Approved')
      ),
      createElement('div', {className:'stat-card'}, 
        createElement('div', {className:'icon', style:{color:'var(--rose)',borderColor:'rgba(212,160,160,.3)'}}, createElement('i', {className:'fas fa-triangle-exclamation'})),
        createElement('div', {className:'number'}, stats.critical),
        createElement('div', {className:'label'}, 'Critical')
      )
    ),
    createElement('div', {className:'grid2'},
      createElement('div', {className:'panel pad animate-slide-left'},
        createElement('div', {className:'head'},
          createElement('div', null, createElement('h3', null, 'Recent Activity'), createElement('p', null, 'Latest complaints from your workspace')),
          createElement('button', {className:'btn sm outline', onClick:()=>setView('complaints')}, 'View All')
        ),
        recent.length ? recent.map(c=>createElement(ComplaintRow, {key:c.id, complaint:c, onClick:setSelected})) : 
          createElement('div', {style:{textAlign:'center',color:'var(--dim)',padding:30}}, 
            createElement('i', {className:'fas fa-inbox', style:{fontSize:24,display:'block',marginBottom:8}}), 'No complaints yet'
          )
      ),
      createElement('div', {className:'panel pad animate-slide-right'},
        createElement('div', {className:'head'},
          createElement('div', null, createElement('h3', null, 'Status Distribution'), createElement('p', null, 'Complaint breakdown by status'))
        ),
        createElement('div', {className:'chart-container'},

}

// ===== NEW COMPLAINT =====
function NewComplaint({user,onSubmit}){
  const [form,setForm]=useState({
    title:'',description:'',category:'Academic',priority:'medium',
    department:user?.department||'General',location:'',zone:'Academic Lab',
    submittedBy:user?.id
  });
  const [error,setError]=useState('');

  const handleCategoryChange = (cat)=>{
    const priority = PRIORITY_MAP[cat]||'medium';
    setForm({...form,category:cat,priority});
  };

  const handleSubmit=(e)=>{
    e.preventDefault();
    if(!form.title.trim()){
      setError('Title is required');
      return;
    }
    if(form.title.trim().length<5){
      setError('Title must be at least 5 characters');
      return;
    }
    if(!form.description.trim()){
      setError('Description is required');
      return;
    }
    setError('');
    onSubmit(form);
  };

  return createElement('div', {className:'animate-slide-up'},
    createElement('div', {className:'panel pad', style:{maxWidth:900,margin:'auto'}},
      createElement('div', {className:'head'},
        createElement('div', null, createElement('h3', null, 'Report a New Issue'), createElement('p', null, 'Fill in the details below'))
      ),
      createElement('form', {onSubmit:handleSubmit},
        createElement('div', {className:'form-grid'},
          createElement('div', {className:'field full'},
            createElement('label', null, 'Issue Title ', createElement('span', {style:{color:'var(--burgundy)'}}, '*')),
            createElement('input', {className:'input', value:form.title, onChange:e=>setForm({...form,title:e.target.value}), placeholder:'Enter a clear, descriptive title...'}),
            error && createElement('span', {style:{color:'var(--burgundy)',fontSize:11,marginTop:4}}, createElement('i', {className:'fas fa-exclamation-circle'}), ' ', error)
          ),
          createElement('div', {className:'field full'},
            createElement('label', null, 'Description ', createElement('span', {style:{color:'var(--burgundy)'}}, '*')),
            createElement('textarea', {className:'input', value:form.description, onChange:e=>setForm({...form,description:e.target.value}), placeholder:'Describe the issue in detail...', rows:4})
          ),
          createElement('div', {className:'field'},
            createElement('label', null, 'Category'),
            createElement('select', {className:'input', value:form.category, onChange:e=>handleCategoryChange(e.target.value)},
              CATEGORIES.map(c=>createElement('option', {key:c}, c))
            )
          ),
          createElement('div', {className:'field'},
            createElement('label', null, 'Priority ', createElement('span', {style:{color:'var(--dim)',fontWeight:400,textTransform:'none'}}, '(auto-set)')),
            createElement('input', {className:'input', value:form.priority, disabled:true, style:{opacity:.7,background:'rgba(201,168,76,.06)'}})
          ),
          createElement('div', {className:'field'},
            createElement('label', null, 'Department ', createElement('span', {style:{color:'var(--dim)',fontWeight:400,textTransform:'none'}}, '(auto-filled)')),
            createElement('input', {className:'input', value:form.department, disabled:true, style:{opacity:.7,background:'rgba(201,168,76,.06)'}})
          ),
          createElement('div', {className:'field'},
            createElement('label', null, 'Campus Zone'),
            createElement('select', {className:'input', value:form.zone, onChange:e=>setForm({...form,zone:e.target.value})},
              ZONES.map(z=>createElement('option', {key:z}, z))
            )
          ),
          createElement('div', {className:'field'},
            createElement('label', null, 'Location (optional)'),
            createElement('input', {className:'input', value:form.location, onChange:e=>setForm({...form,location:e.target.value}), placeholder:'Building / room number'})
          )
        ),
        createElement('div', {style:{display:'flex',justifyContent:'flex-end',gap:12,marginTop:18,borderTop:'1px solid var(--line)',paddingTop:18}},
          createElement('button', {type:'button', className:'btn', onClick:()=>window.history.back()}, 'Cancel'),
          createElement('button', {type:'submit', className:'btn primary'}, createElement('i', {className:'fas fa-paper-plane'}), ' Submit Complaint')
        )
      )
    )
  );
}

// ===== COMPLAINT DETAIL =====
function ComplaintDetail({complaint,user,isAdmin,isStaff,isStudent,onClose,onComment,onResolve,onApprove,onRate,onAssign,users,departments}){
  const [comment,setComment]=useState('');
  const [resolution,setResolution]=useState('');
  const [rating,setRating]=useState(0);
  const [feedback,setFeedback]=useState('');
  const [showAssign,setShowAssign]=useState(false);
  const [selectedDept,setSelectedDept]=useState(complaint.department||'');
  const [selectedStaff,setSelectedStaff]=useState(complaint.assignedTo||'');

  const isResolved = complaint.status==='resolved'||complaint.status==='closed';
  const canResolve = isStaff && !isResolved && complaint.status!=='rejected' && complaint.assignedTo===user?.id;
  const canApprove = isAdmin && complaint.status==='resolved' && !complaint.approved;
  const canRate = !isAdmin && complaint.status==='resolved' && complaint.approved && !complaint.rating && complaint.submittedBy===user?.id;
  const canAssign = isAdmin && !complaint.assignedTo && complaint.status!=='resolved' && complaint.status!=='closed';

  const staffUsers = users.filter(u=>u.role==='staff' || u.role==='admin');
  const filteredStaff = selectedDept ? staffUsers.filter(u=>u.department===selectedDept) : staffUsers;

  const handleAssign = ()=>{
    if(selectedStaff){
      const staff = users.find(u=>u.id===selectedStaff);
      onAssign(complaint.id,selectedStaff,selectedDept);
      setShowAssign(false);
      setSelectedStaff('');
    }
  };

  const addComment=()=>{
    if(!comment.trim()) return;
    onComment(complaint.id,comment);
    setComment('');
  };

  return createElement('div', {className:'modal', onClick:e=>e.target===e.currentTarget&&onClose()},
    createElement('div', {className:'modal-box animate-scale'},
      createElement('div', {className:'modal-head'},
        createElement('div', null,
          createElement('div', {className:'badges', style:{marginBottom:6}},
            createElement('span', {className:'badge badge-'+(complaint.priority==='critical'?'burgundy':complaint.priority==='high'?'rose':'sage')}, complaint.priority),
            createElement('span', {className:'badge badge-'+(complaint.status==='resolved'?'sage':complaint.status==='closed'?'navy':'gold')}, complaint.status),
            complaint.assignedTo && createElement('span', {className:'badge badge-sage'}, createElement('i', {className:'fas fa-user-check'}), ' Assigned'),
            complaint.approved && createElement('span', {className:'badge badge-gold'}, createElement('i', {className:'fas fa-check'}), ' Approved'),
            complaint.rating > 0 && createElement('span', {className:'badge badge-gold'}, createElement('i', {className:'fas fa-star'}), ' ', complaint.rating, '/5')
          ),
          createElement('h2', null, complaint.title),
          createElement('p', {style:{fontSize:12,color:'var(--muted)'}}, complaint.id, ' · ', complaint.category, ' · ', complaint.department)
        ),
        createElement('button', {className:'btn icon', onClick:onClose}, createElement('i', {className:'fas fa-times'}))
      ),
      
      createElement('p', {style:{color:'var(--text)',lineHeight:1.7,marginBottom:16,fontSize:14}}, complaint.description),
      
      createElement('div', {className:'grid3', style:{marginBottom:16}},
        createElement('div', null, 
          createElement('small', {className:'dim'}, 'Submitted'), 
          createElement('div', {style:{fontWeight:600,fontSize:13}}, new Date(complaint.createdAt).toLocaleString())
        ),
        createElement('div', null, 
          createElement('small', {className:'dim'}, 'By'), 
          createElement('div', {style:{fontWeight:600,fontSize:13}}, users.find(u=>u.id===complaint.submittedBy)?.name||'Anonymous')
        ),
        createElement('div', null, 
          createElement('small', {className:'dim'}, 'Location'), 
          createElement('div', {style:{fontWeight:600,fontSize:13}}, complaint.location||complaint.zone||'N/A')
        )
      ),

      // Assigned To
      complaint.assignedTo && createElement('div', {className:'panel pad', style:{marginBottom:16,background:'rgba(138,154,138,.06)'}},
        createElement('b', {style:{color:'var(--sage)'}}, createElement('i', {className:'fas fa-user-check'}), ' Assigned To'),
        createElement('p', {style:{fontSize:13,color:'var(--text)',marginTop:4}}, users.find(u=>u.id===complaint.assignedTo)?.name||'Staff'),
        createElement('small', {className:'dim'}, 'Department: ', complaint.department)
      ),

      // Resolution
      complaint.resolution && createElement('div', {className:'panel pad', style:{marginBottom:16,background:'rgba(138,154,138,.06)',borderColor:'var(--sage)'}},
        createElement('b', {style:{color:'var(--sage)'}}, createElement('i', {className:'fas fa-check-circle'}), ' Resolution'),
        createElement('p', {style:{fontSize:13,color:'var(--text)',marginTop:4}}, complaint.resolution),
        complaint.resolvedBy && createElement('small', {className:'dim'}, 'Resolved by: ', users.find(u=>u.id===complaint.resolvedBy)?.name||'Staff')
      ),

      // Timeline
      complaint.timeline && createElement('div', {className:'timeline'},
        complaint.timeline.map((t,i)=>createElement('div', {key:i, className:'event'},
          createElement('b', null, t.status),
          createElement('p', null, t.note),
          createElement('small', null, new Date(t.timestamp).toLocaleString())
        ))
      ),

      // Admin: Assign - FIXED: Added proper submit button
      canAssign && createElement('div', {className:'panel pad', style:{marginBottom:16,borderColor:'var(--gold)'}},
        createElement('div', {className:'head'},
          createElement('h3', {style:{color:'var(--gold)'}}, createElement('i', {className:'fas fa-user-plus'}), ' Assign Complaint')
        ),
        !showAssign ? 
          createElement('button', {className:'btn primary', onClick:()=>setShowAssign(true)},
            createElement('i', {className:'fas fa-user-plus'}), ' Assign to Department'
          ) :
          createElement('div', null,
            createElement('div', {className:'form-grid'},
              createElement('div', {className:'field'},
                createElement('label', null, 'Department'),
                createElement('select', {className:'input', value:selectedDept, onChange:e=>{setSelectedDept(e.target.value);setSelectedStaff('');}},
                  departments.map(d=>createElement('option', {key:d}, d))
                )
              ),
              createElement('div', {className:'field'},
                createElement('label', null, 'Staff Member'),
                createElement('select', {className:'input', value:selectedStaff, onChange:e=>setSelectedStaff(e.target.value)},
                  createElement('option', {value:''}, 'Select staff...'),
                  filteredStaff.map(u=>createElement('option', {key:u.id, value:u.id}, u.name+' ('+u.department+')'))
                )
              )
            ),
            createElement('div', {style:{display:'flex',gap:8,marginTop:12}},
              createElement('button', {className:'btn success', onClick:handleAssign, disabled:!selectedStaff},
                createElement('i', {className:'fas fa-check'}), ' Assign Complaint'
              ),
              createElement('button', {className:'btn', onClick:()=>setShowAssign(false)}, 'Cancel')
            )
          )
      ),

      // Staff: Resolve - Only if assigned to this staff
      canResolve && createElement('div', {className:'panel pad', style:{marginBottom:16}},
        createElement('div', {className:'head'}, createElement('h3', null, 'Resolve This Complaint')),
        createElement('textarea', {className:'input', value:resolution, onChange:e=>setResolution(e.target.value), placeholder:'Describe how this issue was resolved...', rows:2}),
        createElement('button', {className:'btn success', style:{marginTop:8}, onClick:()=>{if(resolution.trim()){onResolve(complaint.id,resolution);}}},
          createElement('i', {className:'fas fa-check-double'}), ' Mark Resolved'
        )
      ),

      // Admin: Approve
      canApprove && createElement('div', {className:'panel pad', style:{marginBottom:16,borderColor:'var(--gold)'}},
        createElement('div', {className:'head'}, createElement('h3', {style:{color:'var(--gold)'}}, 'Admin Approval')),
        createElement('p', {style:{fontSize:12,color:'var(--muted)',marginBottom:8}}, 'This complaint has been resolved. Approve to close it officially.'),
        createElement('button', {className:'btn primary', onClick:()=>onApprove(complaint.id)},
          createElement('i', {className:'fas fa-crown'}), ' Approve & Close'
        )
      ),

      // User: Rate - Only the person who filed the complaint can rate
      canRate && createElement('div', {className:'panel pad', style:{marginBottom:16,borderColor:'var(--gold)'}},
        createElement('div', {className:'head'}, createElement('h3', null, 'Rate Resolution')),
        createElement('p', {style:{fontSize:12,color:'var(--muted)',marginBottom:8}}, 'Please rate how the complaint was resolved:'),
        createElement('div', {style:{display:'flex',gap:6,marginBottom:8}},
          [1,2,3,4,5].map(n=>createElement('button', {key:n, className:'btn icon', style:{color:n<=rating?'var(--gold)':'var(--dim)',borderColor:n<=rating?'var(--gold)':'var(--line)'}, onClick:()=>setRating(n)},
            createElement('i', {className:'fas fa-star'})
          ))
        ),
        createElement('input', {className:'input', value:feedback, onChange:e=>setFeedback(e.target.value), placeholder:'Share your feedback about the resolution...'}),
        createElement('button', {className:'btn primary', style:{marginTop:8}, onClick:()=>{if(rating){onRate(complaint.id,rating,feedback);}}},
          createElement('i', {className:'fas fa-comment'}), ' Submit Feedback'
        )
      ),

      // Comments
      createElement('div', {className:'head', style:{marginTop:12}}, createElement('h3', null, 'Comments')),
      (complaint.comments||[]).map(c=>createElement('div', {key:c.id, className:'comment'},
        createElement('div', {className:'author'}, c.name, createElement('small', null, '@', c.role, ' · ', new Date(c.timestamp).toLocaleString())),
        createElement('p', null, c.message)
      )),
      
      createElement('div', {style:{display:'flex',gap:8,marginTop:12}},
        createElement('input', {className:'input', value:comment, onChange:e=>setComment(e.target.value), placeholder:'Add a comment...', onKeyDown:e=>e.key==='Enter'&&addComment()}),
        createElement('button', {className:'btn primary', onClick:addComment}, createElement('i', {className:'fas fa-paper-plane'}))
      )
    )
  );
}

// ===== ANALYTICS =====
function Analytics({complaints}){
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(()=>{
    if(!chartRef.current || typeof Chart === 'undefined') return;
    if(chartInstance.current) chartInstance.current.destroy();

    const ctx = chartRef.current.getContext('2d');
    const catCounts = CATEGORIES.map(c => complaints.filter(comp=>comp.category===c).length);
    const colors = ['#c9a84c','#d4a0a0','#8a9a8a','#6b2e3e','#1a2332','#c9a84c','#d4a0a0','#8a9a8a','#6b2e3e','#1a2332','#c9a84c','#d4a0a0','#8a9a8a','#6b2e3e'];

    chartInstance.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: CATEGORIES,
        datasets: [{
          label: 'Complaints by Category',
          data: catCounts,
          backgroundColor: colors.map(c=>c+'99'),
          borderColor: colors,
          borderWidth: 2,
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, animation: { duration: 2000 } },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(26,35,50,.06)' } },
          x: { grid: { display: false } }
        }
      }
    });

    return ()=> { if(chartInstance.current) chartInstance.current.destroy(); };
  },[complaints]);

  return createElement('div', {className:'animate-slide-up'},
    createElement('div', {className:'grid2'},
      createElement('div', {className:'panel pad'},
        createElement('div', {className:'head'},
          createElement('div', null, createElement('h3', null, 'Category Analytics'), createElement('p', null, 'Complaint distribution by category'))
        ),
        createElement('div', {className:'chart-container', style:{height:300}},
          createElement('canvas', {ref:chartRef})
        )
      ),
      createElement('div', {className:'panel pad'},
        createElement('div', {className:'head'},
          createElement('div', null, createElement('h3', null, 'Quick Stats'), createElement('p', null, 'Key metrics at a glance'))
        ),
        createElement('div', {style:{display:'grid',gap:12}},
          createElement('div', {className:'stat-card', style:{padding:'15px 18px'}},
            createElement('div', {style:{display:'flex',justifyContent:'space-between'}},
              createElement('span', {className:'label'}, 'Total Complaints'),
              createElement('span', {className:'number', style:{fontSize:24}}, complaints.length)
            )
          ),
          createElement('div', {className:'stat-card', style:{padding:'15px 18px'}},
            createElement('div', {style:{display:'flex',justifyContent:'space-between'}},
              createElement('span', {className:'label'}, 'Resolution Rate'),
              createElement('span', {className:'number', style:{fontSize:24}}, complaints.length ? Math.round(complaints.filter(c=>c.status==='closed'||c.status==='resolved').length/complaints.length*100)+'%' : '0%')
            )
          ),
          createElement('div', {className:'stat-card', style:{padding:'15px 18px'}},
            createElement('div', {style:{display:'flex',justifyContent:'space-between'}},
              createElement('span', {className:'label'}, 'Avg Rating'),
              createElement('span', {className:'number', style:{fontSize:24}}, 
                complaints.filter(c=>c.rating).length ? (complaints.reduce((a,c)=>a+c.rating,0)/complaints.filter(c=>c.rating).length).toFixed(1) : 'N/A'
              )
            )
          )
        )
      )
    )
  );
}

// ===== USER MANAGEMENT =====
function UserManagement({users}){
  return createElement('div', {className:'animate-slide-up panel pad'},
    createElement('div', {className:'head'},
      createElement('div', null, createElement('h3', null, 'User Management'), createElement('p', null, 'All registered users'))
    ),
    createElement('table', {className:'table', style:{marginTop:12}},
      createElement('thead', null,
        createElement('tr', null,
          createElement('th', null, 'Name'),
          createElement('th', null, 'Role'),
          createElement('th', null, 'Department')
        )
      ),
      createElement('tbody', null,
        users.map(u=>createElement('tr', {key:u.id},
          createElement('td', null, u.name),
          createElement('td', null, createElement('span', {className:'badge badge-gold'}, u.role)),
          createElement('td', null, u.department)
        ))
      )
    )
  );
}

// ===== AUDIT LOG =====
function AuditLog({complaints}){
  return createElement('div', {className:'animate-slide-up panel pad'},
    createElement('div', {className:'head'},
      createElement('div', null, createElement('h3', null, 'Audit Trail'), createElement('p', null, 'Recent activity log'))
    ),
    createElement('div', {style:{marginTop:12}},
      complaints.slice(0,10).map(c=>createElement('div', {key:c.id, style:{padding:10,borderBottom:'1px solid var(--line)',fontSize:12,display:'flex',justifyContent:'space-between',alignItems:'center'}},
        createElement('div', null,
          createElement('span', {className:'badge badge-navy'}, c.status),
          createElement('span', {style:{marginLeft:8}}, c.id, ' - ', c.title)
        ),
        createElement('span', {className:'dim', style:{fontSize:10}}, new Date(c.updatedAt).toLocaleString())
      ))
    )
  );
}

// ===== SETTINGS =====
function Settings({theme,setTheme}){
  return createElement('div', {className:'animate-slide-up panel pad'},
    createElement('div', {className:'head'},
      createElement('div', null, createElement('h3', null, 'Settings'), createElement('p', null, 'Customize your experience'))
    ),
    createElement('div', {style:{display:'flex',gap:12,alignItems:'center',marginTop:12}},
      createElement('button', {className:'btn', onClick:()=>setTheme(theme==='dark'?'light':'dark')},
        createElement('i', {className:'fas '+(theme==='dark'?'fa-sun':'fa-moon')}), ' Switch to ', theme==='dark'?'Light':'Dark', ' Mode'
      )
    ),
    createElement('p', {className:'muted', style:{fontSize:11,marginTop:16}},
      createElement('i', {className:'fas fa-database'}), ' Data is stored locally in your browser.'
    ),
    createElement('div', {style:{marginTop:12,padding:12,background:'rgba(201,168,76,.06)',borderRadius:'var(--r)',fontSize:11}},
      createElement('b', null, createElement('i', {className:'fas fa-info-circle'}), ' Features:'),
      createElement('ul', {style:{marginTop:6,paddingLeft:20,color:'var(--muted)',lineHeight:1.8}},
        createElement('li', null, '✅ Role-based access control (Admin, Student, Teacher, Staff)'),
        createElement('li', null, '✅ Admin can assign complaints to any department/staff'),
        createElement('li', null, '✅ Auto-priority based on category selection'),
        createElement('li', null, '✅ Auto-department from user login role'),
        createElement('li', null, '✅ Staff resolves, Admin approves'),
        createElement('li', null, '✅ Users rate resolved complaints'),
        createElement('li', null, '✅ Full audit trail and timeline')
      )
    )
  );
}

// ===== MOBILE NAV =====
function MobileNav({view,setView}){
  const items=[['dashboard','fa-gauge-high','Home'],['complaints','fa-list','Cases'],['new','fa-plus','New'],['settings','fa-sliders','More']];
  return createElement('nav', {className:'mobile-nav'},
    items.map(([id,icon,label])=>createElement('button', {key:id, className:view===id?'active':'', onClick:()=>setView(id)},
      createElement('i', {className:'fas '+icon}), label
    ))
  );
}

// ===== RENDER =====
ReactDOM.createRoot(document.getElementById('root')).render(createElement(App));
</script>
